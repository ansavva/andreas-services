[project]
name = "lora-lab"
version = "0.1.0"
description = "Character-LoRA experiment lab — RunPod + ComfyUI (PuLID-FLUX) + OneTrainer. Gitignored, never deployed."
requires-python = ">=3.11"

# Mirrors pipeline/pyproject.toml's shape (one dependency set, src layout,
# console script) so a later lift into studio_pipeline is a move, not a port.
# Deliberately NOT a dependency of the pipeline package, and nothing here may
# import from it — the lab shells out to the `studio` command instead, which
# is the same contract the skills use.
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.scripts]
lora-lab = "lora_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lora_lab"]
