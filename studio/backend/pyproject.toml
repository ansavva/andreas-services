[tool.poetry]
name = "studio-api"
version = "0.1.0"
description = "Studio media browser API Lambda"
authors = []
packages = []

[tool.poetry.dependencies]
python = "^3.11"
boto3 = "1.26.137"
Flask = "3.0.3"
Flask-Cors = "5.0.0"
Werkzeug = "3.0.4"
mangum = "0.17.0"
asgiref = "3.8.1"
# The `crypto` extra is not optional: it brings `cryptography`, without which
# PyJWT imports fine and then refuses the first RS256 token Cognito signs.
PyJWT = {version = "2.13.0", extras = ["crypto"]}

[tool.poetry.group.dev.dependencies]
# Both backends the suite mocks, named explicitly. The `dynamodb` extra adds
# nothing `s3` had not already pulled in (`py-partiql-parser`, at the same pin)
# plus `docker`, which only moto's DynamoDB-Streams-to-Lambda path uses. It is
# declared anyway: leaning on a transitive of a *different* extra is how a
# suite breaks on an unrelated dependency change, with an import error naming
# neither service. Dev group only — the Lambda image installs `--only main`.
moto = {version = "4.2.14", extras = ["s3", "dynamodb"]}
pytest = "7.4.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
