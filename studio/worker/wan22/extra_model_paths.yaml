# Where ComfyUI finds the weights: on the Runpod network volume, mounted at
# /runpod-volume on a serverless worker (fixed by Runpod). The dev pod mounts
# the same volume at /workspace and symlinks /runpod-volume to it, so one
# file serves both. `studio-cache/` under loras/ is the handler's download
# cache; ComfyUI lists loras recursively, so a cached file is addressed as
# `studio-cache/<sha256>.safetensors`.
studio_wan22:
  base_path: /runpod-volume
  diffusion_models: models/diffusion_models/
  text_encoders: models/text_encoders/
  vae: models/vae/
  loras: models/loras/
