[project]
name = "studio-pipeline"
version = "0.1.0"
description = "The studio generation pipeline — the local half of studio, driven by the studio-* Claude skills"
requires-python = ">=3.11"

# One dependency set for the whole pipeline.
#
# These used to be declared per script with PEP 723 inline metadata, which is
# the right shape for genuinely unrelated tools — but every script here wanted
# boto3 and at most one other package, so the isolation bought nothing and cost
# a resolve per script and no shared lockfile. Two scripts even declared the
# same pair in different orders, resolving as two separate cached environments.
#
# **`pillow` and `imageio-ffmpeg` are gone, and their absence is the point.**
# ~1,360 lines of local media processing — stitching, frame extraction, contact
# sheets, convert and crop — moved into the service: `convert` and `crop` are
# synchronous routes in the API image (Pillow only), and everything that needs
# ffmpeg is a job on the render queue answered by a second container image. This
# package asks and waits; it decodes nothing.
#
# `boto3` survives for exactly one caller, `profiles.aws_session()`, which
# `profile sync` uses to find the API in the first place.
dependencies = [
    "boto3>=1.34",
    "pyyaml>=6.0",
    "click>=8.4.2",
    # SRP sign-in for `studio login`. The pool allows ALLOW_USER_SRP_AUTH and
    # nothing else, the AWS CLI cannot do SRP, and after #308 the CLI holds no
    # AWS credentials to fall back on.
    "pycognito>=2024.5.1",
]

[project.scripts]
studio = "studio_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout: the importable package is not at the project root, so the
# interpreter's "current directory first" rule cannot shadow the installed
# package with the working copy. Tests then exercise what actually ships —
# including the package data below, whose absence from a wheel would otherwise
# only show up at runtime.
packages = ["src/studio_pipeline"]

# `models.json` was here and is not any more: the registry moved to
# `backend/studio_core/` so one copy could answer the CLI, the SPA and
# `GET /api/characters/<id>/selection` at once. This package reads it over the
# wire, so a wheel does not carry it — `engine/registry_file.py` names the repo
# path the two write commands edit, which is not a packaged resource.
[tool.hatch.build.targets.wheel.force-include]
"src/studio_pipeline/domain/templates/profile.yaml" = "studio_pipeline/domain/templates/profile.yaml"
# The angle spec is read at runtime by `character turnaround`, so a wheel without
# it fails only when someone runs the command. The angle images it names are NOT
# package data — they live in studio/config/ and reach the bucket via dev-setup.

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "moto[s3]>=4.2,<5",
    # **Pillow is a TEST dependency here and no longer a runtime one.** The CLI
    # decodes nothing — `convert` and `crop` are API routes and everything
    # needing ffmpeg is a render job — but the suite still has to MAKE images:
    # `tests/support/fake_api.py` answers a submission with a real decodable PNG,
    # and several tests open what a command produced to assert its dimensions.
    # Producing a fixture is not the same as being able to process one.
    "pillow>=10.0",
    # Report-only. There is no `--cov-fail-under` and CI does not gate on the
    # number — see `[tool.coverage]` below on why a threshold picked before
    # anyone has read a real one is worse than none.
    "pytest-cov>=5.0",
]



[tool.ruff]
# Inherit the monorepo's shared rules rather than replacing them; this only
# adds what ruff cannot infer — that studio_pipeline is our own package, not a
# third-party one, which is what its import grouping depends on.
extend = "../../ruff.toml"

[tool.ruff.lint.isort]
known-first-party = ["studio_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["studio_pipeline"]
branch = true
# `tests/` measures itself otherwise, which inflates the number with the one
# code in the repo guaranteed to be executed.
omit = ["*/tests/*"]

[tool.coverage.report]
# The parts of a file that are not a statement about behaviour.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
skip_covered = true
show_missing = true
