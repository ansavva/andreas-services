# The reference shoot — the STANDARD set of face and body plates every
# character's `reference/` library should hold, as data.
#
# One slot = one recorded run. `studio character shoot` reads this file, fills
# each prompt from the character's own bible, binds the slot's pose plate from
# `config/pose/`, and stops — the result stays in its run. Putting an image into
# `reference/` changes who a character IS, so it is a separate human decision.
#
# The `description` and `tags` below are still this file's job, and they are used
# at PROMOTION rather than at render: a shoot records its slot id in the run, and
# `add-refs --from-run` reads it back and writes these two fields onto the image.
# So no promoted image lands undescribed, and nobody retypes prose that is
# already here. Neither field reaches the model — only `prompt` does.
#
# RULES THIS FILE OBEYS
#
#   * NO CHARACTER SPECIFICS. Placeholders only. `{identity_block}`, `{top}`,
#     `{minimal}` and `{must}` are filled from the bible at build time. A
#     character's name, wardrobe or backdrop must never appear here (hard rule 1).
#   * `pose_image` is an S3 KEY under `config/`, whose source of truth is the
#     repo (`studio/config/`) and which `dev-setup.sh` copies out. A model is
#     only ever handed a presigned URL of an S3 object.
#   * `{pose_slot}` and `{identity_slots}` are filled with the REAL `[ImageN]`
#     positions at build time. Never write `[Image1]` literally — `gather()`
#     decides the resolved order, and a hard-coded number aims the pose-guide
#     instruction at whatever happens to be in that position.
#   * Defaults must be PORTABLE across every registered image model, because
#     `--model` overrides them and an unknown field fails preflight. Model-only
#     knobs go under `per_model`.
#
# The prompts are deliberately blunt about the plate being a guide and nothing
# else: an unqualified reference image invites a model to blend it, which would
# put a grey mannequin's proportions into a character's body.

defaults:
  model: gpt-image-2
  # 2:3 is the only portrait ratio every image model in the registry accepts
  # (gpt-image-2, gpt-image-1.5, nano-banana-pro, nano-banana-2), and it is the
  # proportion the existing studio sets already use.
  aspect_ratio: "2:3"
  # png is valid on all four despite the enums differing (png|jpeg|webp on the
  # GPT models, jpg|png on the Nano Banana models), and it keeps the output
  # Kling-legal — which is the whole reason these images exist.
  extra:
    output_format: png
  # Shared wording, referenced by the slot prompts below.
  backdrop_face: >-
    Flat mid-grey seamless studio backdrop, no floor line, no props, no text.
  backdrop_body: >-
    White seamless studio backdrop with a soft contact shadow at the feet, no
    floor line, no props, no text.
  light: >-
    Soft frontal key with gentle falloff, even and near-shadowless on the
    subject, no hard shadow edges, no colour cast.
  guide: >-
    is a POSE GUIDE ONLY. Match its stance, the direction the body and head
    face, and its framing. Take nothing else from it — not its build,
    proportions, skin, head, face or hair, and do not blend it into the person.
  # A SECOND guide, bound only where the first cannot carry the whole pose. The
  # face plates end at a neck stump, so they say nothing about which way the
  # shoulders point — and a symmetric stump reads as square to the camera. Both
  # back three-quarters duly came back as a correctly turned head on a flat
  # back, even with the prompt insisting the shoulders turn: the reference image
  # outvoted the words. This one is a whole figure at the same angle.
  guide_torso: >-
    is a SECOND POSE GUIDE, for the TORSO ONLY. Copy the angle of its shoulders
    and chest relative to the camera, and nothing else — not its framing, crop,
    head, face, hair, build, proportions or clothing. Do not blend it into the
    person and do not draw the whole figure it shows.
  # The MEDIUM is the character's, not this file's. It used to say "photographic,
  # no stylisation", which is only right for a character whose source material is
  # photographs — for one drawn in ink it would have converted him to a medium he
  # has never existed in. So the reference images lead, and the bible's
  # `rendering.default_style` names what they are.
  style_intro: >-
    Render in the SAME MEDIUM and visual style as the reference images of the
    person — do not convert them into another medium. Their style is
  style_fallback: >-
    whatever medium the reference images are in
  # Medium-agnostic: true of a photograph and of a drawing alike.
  quality: >-
    Clean and sharp, evenly lit, the whole subject in frame and in focus, no
    filter, no vignette, no added grain, no border.
  # Body plates deliberately strip wardrobe back so the silhouette reads. This
  # is the one place a plate overrides the bible's wardrobe, which is why the
  # body `must_intro` below says so out loud.
  # No trailing full stop: the slot prompts punctuate after it, as they do for
  # `{top}`.
  minimal: >-
    Wearing plain, close-fitting, unbranded dark shorts and nothing else, so the
    build, proportions and posture read clearly
  # A turnaround is used by comparing plates to each other, so the head must be
  # the SAME SIZE in all of them. "Cropped at mid-chest" fixes the bottom edge
  # and says nothing about scale: a live set came back with some heads half
  # again as large as others, which reads as several sessions rather than one.
  scale_face: >-
    SCALE, held constant across the whole set: the crown of the head sits just
    below the top edge of the frame with only a small margin above it, and the
    head occupies roughly the upper third of the image. Do not zoom in closer
    on some angles than others.
  # "Turned about 45 degrees … eyes returning to the lens" came back nearer 30
  # with the gaze wandering off camera, on two different characters. Degrees are
  # not checkable by a model; what is in the picture is.
  turn_check: >-
    A TRUE forty-five degrees, not a slight turn: the far cheek is partly
    hidden behind the bridge of the nose, the far ear is out of view, and the
    near ear is fully visible. BOTH eyes look directly into the lens — the gaze
    does not drift off camera.
  must_intro_face: >-
    Preserve these identity cues exactly:
  # A body plate exists to record a BUILD, and the first one rendered lost it:
  # the figure came back lean and narrow-shouldered, nothing like the bible's
  # taper or arm mass. The pose plate caused it — an untextured mannequin with
  # its own proportions, against which `{guide}`'s "not its build, proportions"
  # was one buried clause. Same lesson as the crop and the profile: foreground
  # it, and put something checkable in it. `{build}` is the bible's own
  # `body.silhouette` and `body.arms`, which carry a ratio in head-widths.
  # Seed pools accumulate over years — the same person at 35 and at 55 sitting
  # in one identity set, with nothing in the prompt to say which is wanted, so
  # the model averages them. The bible has always carried
  # `identity.apparent_age`; nothing read it until a live set mixed a decade.
  age_intro: >-
    RENDER THE PERSON AT THIS AGE, which the reference images do not all agree
    on — they were made across a span of years and some show them noticeably
    older or younger. Take face shape, features, colouring and proportions from
    the references, but take the AGE from here, including how grey the hair and
    stubble are and how deep the lines read:
  # THE FACE AND THE BUILD HAVE DIFFERENT AUTHORITIES, because a seed pool is
  # mostly head-and-shoulders. The face is the best-evidenced thing about a
  # character — photographs of it, from several angles — so the images lead and
  # the written cues are a checklist against them. The build usually is NOT
  # evidenced: a pool of portraits shows almost none of it. Telling a model to
  # take proportions "from the reference images" therefore points it at pictures
  # that do not contain the answer, and it invents one. So they are stated
  # separately, and each says which source wins.
  face_intro: >-
    THE FACE COMES FROM THE REFERENCE IMAGES. They show this person's real face:
    match its bone structure, the WIDTH of the jaw and chin, the set and spacing
    of the eyes, the nose, the hairline and the shape of the skull to them. The
    identity cues listed further down are a checklist to verify against those
    images, not a replacement for looking at them — where a written cue and an
    image disagree about the FACE, the images win.
  build_intro: >-
    THE BUILD IS THE PERSON'S, NOT THE GUIDE FIGURE'S — and unlike the face, the
    reference images may barely show it, since a reference pool is mostly
    head-and-shoulders. So take the build from THIS DESCRIPTION first, never
    from the pose guide, and do not reshape it toward the guide in any
    direction — not thinner, not thicker, not taller, not shorter:
  must_intro_body: >-
    Preserve these identity cues exactly — but the wardrobe named above governs
    this plate, so ignore any clothing rule among them:

# Applied ONLY when that model is the resolved one, so an override never carries
# another model's vocabulary into the payload.
per_model:
  gpt-image-2:
    quality: high
    moderation: auto
  gpt-image-1.5:
    quality: high
    input_fidelity: high
  nano-banana-pro: {}
  nano-banana-2: {}

# ── the slots ───────────────────────────────────────────────────────────────
#
# EIGHT orientations, the same eight for face and for body, one per pose plate:
# front, three-quarter and profile to each side, both three-quarter-backs, and
# back. A `-left` slot and its `-right` twin must face OPPOSITE ways — a live
# set once had two "three-quarter" frames turned the same way, which looks like
# coverage and is not.
#
# Direction is always stated as the edge of frame the face points toward, never
# as the subject's own left or right. The wording it replaced said "turned to
# THEIR LEFT so the viewer sees the LEFT side of the face", which instructs two
# opposite rotations in one sentence — and both three-quarters duly came back
# facing the same way.
#
# face: head and shoulders, cropped at mid-chest. The crop is spelled out on
# every slot because "head-and-shoulders studio portrait" did not hold: one slot
# returned a full-body figure and the framing drifted wider slot by slot.
#
# body: the whole figure head to feet, minimal clothing so the silhouette reads.
# "HEAD TO FEET IN FRAME including both feet" is likewise explicit, because a
# mid-thigh crop is the failure that actually happens.

slots:
  # ── face ──────────────────────────────────────────────────────────────
  - id: face_front
    group: face
    pose_image: config/pose/face/front.png
    description: >-
      Head and shoulders, front on, looking straight down the lens, neutral expression, grey studio backdrop.
    tags: [face, front, neutral, studio]
    prompt: >-
      {identity_slots} show the person. {pose_slot} {guide}
      A studio portrait of the person, front on, squared to the camera, looking straight down the lens. Neutral expression, mouth
      closed. CROPPED AT MID-CHEST — head and shoulders only, with no waist,
      no hips and no legs anywhere in the frame. {scale_face}
      {face_intro}
      {build_intro} {build}
      {age_intro} {age}. {top}. {backdrop_face}
      {light} {style} {quality} {must}

  - id: face_three_quarter_right
    group: face
    pose_image: config/pose/face/three-quarter-right.png
    description: >-
      Head and shoulders, face turned toward the right edge of frame, eyes to camera, grey studio backdrop.
    tags: [face, three-quarter, right, studio]
    prompt: >-
      {identity_slots} show the person. {pose_slot} {guide}
      A studio portrait of the person, turned about 45 degrees so the nose points toward the RIGHT edge of the frame, eyes returning to the lens. {turn_check} Neutral expression, mouth
      closed. CROPPED AT MID-CHEST — head and shoulders only, with no waist,
      no hips and no legs anywhere in the frame. {scale_face}
      {face_intro}
      {build_intro} {build}
      {age_intro} {age}. {top}. {backdrop_face}
      {light} {style} {quality} {must}

  - id: face_profile_right
    group: face
    pose_image: config/pose/face/profile-right.png
    description: >-
      Head and shoulders in full profile, face toward the right edge of frame, grey studio backdrop.
    tags: [face, profile, right, studio]
    prompt: >-
      {identity_slots} show the person. {pose_slot} {guide}
      A studio portrait of the person, in FULL PROFILE, turned 90 degrees so the nose points directly at the RIGHT edge of the frame, gaze level and straight ahead. Neutral expression, mouth
      closed. CROPPED AT MID-CHEST — head and shoulders only, with no waist,
      no hips and no legs anywhere in the frame. {scale_face}
      {face_intro}
      {build_intro} {build}
      {age_intro} {age}. {top}. {backdrop_face}
      {light} {style} {quality} {must}

  - id: face_three_quarter_back_right
    group: face
    pose_image: config/pose/face/three-quarter-back-right.png
    torso_image: config/pose/body/three-quarter-back-right.png
    description: >-
      Head and shoulders from behind at three-quarters, head and shoulders turned together, a sliver of the face at the right edge of the head, grey studio backdrop.
    tags: [face, three-quarter, back, right, studio]
    prompt: >-
      {identity_slots} show the person. {pose_slot} {guide}
      {torso_slot} {guide_torso}
      A studio portrait of the person seen FROM BEHIND at three-quarters — the
      head AND THE SHOULDERS TOGETHER turned about 135 degrees away from the
      lens, so the back of the head fills most of the frame. THE SHOULDERS ARE
      ANGLED, NOT SQUARE: one shoulder is clearly nearer the camera than the
      other and the far side of the chest is turning out of view, exactly as in
      {torso_slot}. Only a NARROW SLIVER of the face breaks the silhouette on
      the side toward the RIGHT edge of the frame — the brow, the cheekbone and
      the tip of the nose, and no more. NOT A PROFILE: the eye, the mouth and
      the front of the chin must not be visible. Neutral
      expression, mouth
      closed. CROPPED AT MID-CHEST — head and shoulders only, with no waist,
      no hips and no legs anywhere in the frame. {scale_face}
      {face_intro}
      {build_intro} {build}
      {age_intro} {age}. {top}. {backdrop_face}
      {light} {style} {quality} {must}

  - id: face_back
    group: face
    pose_image: config/pose/face/back.png
    description: >-
      Head and shoulders straight from behind, the back of the head to the lens, grey studio backdrop.
    tags: [face, back, studio]
    prompt: >-
      {identity_slots} show the person. {pose_slot} {guide}
      A studio portrait of the person, directly away from the camera, the back of the head to the lens. Neutral expression, mouth
      closed. CROPPED AT MID-CHEST — head and shoulders only, with no waist,
      no hips and no legs anywhere in the frame. {scale_face}
      {face_intro}
      {build_intro} {build}
      {age_intro} {age}. {top}. {backdrop_face}
      {light} {style} {quality} {must}

  - id: face_three_quarter_back_left
    group: face
    pose_image: config/pose/face/three-quarter-back-left.png
    torso_image: config/pose/body/three-quarter-back-left.png
    description: >-
      Head and shoulders from behind at three-quarters, head and shoulders turned together, a sliver of the face at the left edge of the head, grey studio backdrop.
    tags: [face, three-quarter, back, left, studio]
    prompt: >-
      {identity_slots} show the person. {pose_slot} {guide}
      {torso_slot} {guide_torso}
      A studio portrait of the person seen FROM BEHIND at three-quarters — the
      head AND THE SHOULDERS TOGETHER turned about 135 degrees away from the
      lens, so the back of the head fills most of the frame. THE SHOULDERS ARE
      ANGLED, NOT SQUARE: one shoulder is clearly nearer the camera than the
      other and the far side of the chest is turning out of view, exactly as in
      {torso_slot}. Only a NARROW SLIVER of the face breaks the silhouette on
      the side toward the LEFT edge of the frame — the brow, the cheekbone and
      the tip of the nose, and no more. NOT A PROFILE: the eye, the mouth and
      the front of the chin must not be visible. Neutral
      expression, mouth
      closed. CROPPED AT MID-CHEST — head and shoulders only, with no waist,
      no hips and no legs anywhere in the frame. {scale_face}
      {face_intro}
      {build_intro} {build}
      {age_intro} {age}. {top}. {backdrop_face}
      {light} {style} {quality} {must}

  - id: face_profile_left
    group: face
    pose_image: config/pose/face/profile-left.png
    description: >-
      Head and shoulders in full profile, face toward the left edge of frame, grey studio backdrop.
    tags: [face, profile, left, studio]
    prompt: >-
      {identity_slots} show the person. {pose_slot} {guide}
      A studio portrait of the person, in FULL PROFILE, turned 90 degrees so the nose points directly at the LEFT edge of the frame, gaze level and straight ahead. Neutral expression, mouth
      closed. CROPPED AT MID-CHEST — head and shoulders only, with no waist,
      no hips and no legs anywhere in the frame. {scale_face}
      {face_intro}
      {build_intro} {build}
      {age_intro} {age}. {top}. {backdrop_face}
      {light} {style} {quality} {must}

  - id: face_three_quarter_left
    group: face
    pose_image: config/pose/face/three-quarter-left.png
    description: >-
      Head and shoulders, face turned toward the left edge of frame, eyes to camera, grey studio backdrop.
    tags: [face, three-quarter, left, studio]
    prompt: >-
      {identity_slots} show the person. {pose_slot} {guide}
      A studio portrait of the person, turned about 45 degrees so the nose points toward the LEFT edge of the frame, eyes returning to the lens. {turn_check} Neutral expression, mouth
      closed. CROPPED AT MID-CHEST — head and shoulders only, with no waist,
      no hips and no legs anywhere in the frame. {scale_face}
      {face_intro}
      {build_intro} {build}
      {age_intro} {age}. {top}. {backdrop_face}
      {light} {style} {quality} {must}

  # ── body ──────────────────────────────────────────────────────────────
  - id: body_front
    group: body
    pose_image: config/pose/body/front.png
    description: >-
      Full body head to feet, front on, arms relaxed at the sides, white seamless backdrop.
    tags: [body, front, neutral, full-body, studio]
    prompt: >-
      {identity_slots} show the person. {pose_slot} {guide}
      A full-length studio plate of the person, THE WHOLE FIGURE FROM HEAD TO
      FEET IN FRAME including both feet, standing front on, squared to the camera, weight even on
      both legs, arms relaxed at the sides and clear of the body.
      {face_intro}
      {build_intro} {build}
      {age_intro} {age}.
      {minimal}. {backdrop_body} {light} {style} {quality} {must}

  - id: body_profile_right
    group: body
    pose_image: config/pose/body/profile-right.png
    description: >-
      Full body head to feet in side profile facing the right edge of frame, white seamless backdrop.
    tags: [body, profile, right, full-body, studio]
    prompt: >-
      {identity_slots} show the person. {pose_slot} {guide}
      A full-length studio plate of the person, THE WHOLE FIGURE FROM HEAD TO
      FEET IN FRAME including both feet, standing in FULL PROFILE, turned 90 degrees so the chest and the face point directly at the RIGHT edge of the frame, weight even on
      both legs, arms relaxed at the sides and clear of the body.
      {face_intro}
      {build_intro} {build}
      {age_intro} {age}.
      {minimal}. {backdrop_body} {light} {style} {quality} {must}

  - id: body_three_quarter_back_right
    group: body
    pose_image: config/pose/body/three-quarter-back-right.png
    description: >-
      Full body head to feet from behind at three-quarters, body angled not square, a sliver of the face at the right edge of the head, white seamless backdrop.
    tags: [body, three-quarter, back, right, full-body, studio]
    prompt: >-
      {identity_slots} show the person. {pose_slot} {guide}
      A full-length studio plate of the person, THE WHOLE FIGURE FROM HEAD TO
      FEET IN FRAME including both feet, seen FROM BEHIND at three-quarters —
      the head AND THE SHOULDERS TOGETHER turned about 135 degrees away from
      the lens, so the back of the figure faces the camera. THE SHOULDERS ARE
      ANGLED, NOT SQUARE: one shoulder is clearly nearer the camera than the
      other and the far side of the chest is turning out of view. Only a NARROW SLIVER of the face
      breaks the silhouette on the side toward the RIGHT edge of the frame —
      the brow, the cheekbone and the tip of the nose, and no more. NOT A
      PROFILE: the eye, the mouth and the front of the chin must not be
      visible. Weight even on
      both legs, arms relaxed at the sides and clear of the body.
      {face_intro}
      {build_intro} {build}
      {age_intro} {age}.
      {minimal}. {backdrop_body} {light} {style} {quality} {must}

  - id: body_back
    group: body
    pose_image: config/pose/body/back.png
    description: >-
      Full body head to feet, straight from behind, white seamless backdrop.
    tags: [body, back, full-body, studio]
    prompt: >-
      {identity_slots} show the person. {pose_slot} {guide}
      A full-length studio plate of the person, THE WHOLE FIGURE FROM HEAD TO
      FEET IN FRAME including both feet, standing directly away from the camera, the back of the head and body to the lens, weight even on
      both legs, arms relaxed at the sides and clear of the body.
      {face_intro}
      {build_intro} {build}
      {age_intro} {age}.
      {minimal}. {backdrop_body} {light} {style} {quality} {must}

  - id: body_three_quarter_back_left
    group: body
    pose_image: config/pose/body/three-quarter-back-left.png
    description: >-
      Full body head to feet from behind at three-quarters, body angled not square, a sliver of the face at the left edge of the head, white seamless backdrop.
    tags: [body, three-quarter, back, left, full-body, studio]
    prompt: >-
      {identity_slots} show the person. {pose_slot} {guide}
      A full-length studio plate of the person, THE WHOLE FIGURE FROM HEAD TO
      FEET IN FRAME including both feet, seen FROM BEHIND at three-quarters —
      the head AND THE SHOULDERS TOGETHER turned about 135 degrees away from
      the lens, so the back of the figure faces the camera. THE SHOULDERS ARE
      ANGLED, NOT SQUARE: one shoulder is clearly nearer the camera than the
      other and the far side of the chest is turning out of view. Only a NARROW SLIVER of the face
      breaks the silhouette on the side toward the LEFT edge of the frame —
      the brow, the cheekbone and the tip of the nose, and no more. NOT A
      PROFILE: the eye, the mouth and the front of the chin must not be
      visible. Weight even on
      both legs, arms relaxed at the sides and clear of the body.
      {face_intro}
      {build_intro} {build}
      {age_intro} {age}.
      {minimal}. {backdrop_body} {light} {style} {quality} {must}

  - id: body_profile_left
    group: body
    pose_image: config/pose/body/profile-left.png
    description: >-
      Full body head to feet in side profile facing the left edge of frame, white seamless backdrop.
    tags: [body, profile, left, full-body, studio]
    prompt: >-
      {identity_slots} show the person. {pose_slot} {guide}
      A full-length studio plate of the person, THE WHOLE FIGURE FROM HEAD TO
      FEET IN FRAME including both feet, standing in FULL PROFILE, turned 90 degrees so the chest and the face point directly at the LEFT edge of the frame, weight even on
      both legs, arms relaxed at the sides and clear of the body.
      {face_intro}
      {build_intro} {build}
      {age_intro} {age}.
      {minimal}. {backdrop_body} {light} {style} {quality} {must}

# What `--character <name>` sends when nobody picks. Fourteen slots does not mean
# fourteen images sent: this stays face-led and under the smallest cap in play
# (Kling takes 7).
default_set:
  - face_front
  - face_three_quarter_left
  - face_three_quarter_right
  - body_front
  - body_back
