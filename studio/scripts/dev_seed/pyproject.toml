# `dev-seed` — a tool of its own, deliberately not a `studio` subcommand.
#
# It was `studio dev-seed load|publish|tree`, and being there is what kept
# `adapters/ddb.py` and `adapters/s3.py` in the CLI: seeding writes the rows and
# copies the blobs a library is *made of*, server-side, before there is a
# signed-in session or in many cases a library at all. Every other `studio`
# command reaches the library through the API and holds no cloud credential
# (#308). One command needing the opposite does not belong in the same binary as
# the other ninety-odd — and while it was, the AWS-direct `maintenance/`
# commands sheltered under the same roof.
#
# So it lives beside the scripts it is actually used with — `dev-aws-setup.sh`,
# `dev-aws-seed.sh`, `dev-aws-destroy.sh` — and its own dependency set is four
# lines rather than the pipeline's.
[project]
name = "studio-dev-seed"
version = "0.1.0"
description = "Publish and load the studio dev-stack fixture"
requires-python = ">=3.11"
dependencies = ["boto3>=1.26", "click>=8.1"]

[project.scripts]
dev-seed = "dev_seed.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dev_seed"]

[dependency-groups]
dev = [
    "moto[dynamodb,s3]>=4.2,<5",
    "pytest>=9.1.1",
]
