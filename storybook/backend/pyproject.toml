Werkzeug = "3.0.4"
requests = "*"
boto3 = "*"
replicate = "*"
openai = "*"
stability-sdk = "*"
python-jose = {version = "*", extras = ["cryptography"]}
cognitojwt = "*"
mangum = "0.17.0"
asgiref = "3.8.1"
certifi = "*"
reportlab = "*"
Pillow = "*"
pillow-heif = "*"
