# Local pre-commit hooks. Mirrors what the PR workflows enforce so bad
# templates / Terraform never make it into a PR in the first place.
#
# Setup (once):
#   pip install pre-commit
#   pre-commit install
#
# Run manually against everything:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/aws-cloudformation/cfn-lint
    rev: v1.32.1
    hooks:
      - id: cfn-lint
        files: ^humbugg/infra/.*\.(yaml|yml)$
        args: [--non-zero-exit-code, error]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        # Only validate root configs (envs). Reusable modules have no
        # provider config and fail standalone validate.
        files: ^(storybook/infra/envs|infra)/.*\.tf$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff-check
        files: ^(storybook|humbugg|studio)/.*\.py$

  - repo: local
    hooks:
      # studio's skills describe the `studio` CLI, so they can go stale without
      # anything failing. This checks them against the live Click tree. Local
      # feedback only — studio-pr.yml runs the same script, and that is the
      # enforcement point.
      - id: studio-lint-skills
        name: studio — skills match the CLI
        entry: uv run --project studio/pipeline python studio/pipeline/scripts/lint_skills.py
        language: system
        pass_filenames: false
        files: ^studio/(\.claude/skills/|pipeline/src/)
