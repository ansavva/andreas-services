services:
  backend:
    build:
      context: .
      target: development
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "5001"
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      APP_BASE_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://localhost:8081
      HUMBUGG_EMAIL_PROVIDER: mailer
      HUMBUGG_MAILER_BASE_URL: http://host.docker.internal:8026
      HUMBUGG_MAILER_AUTH_MODE: none
      HUMBUGG_MAILER_SERVICE_ID: humbugg
      HUMBUGG_ENVIRONMENT: development
    ports:
      - "5001:5001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Humbugg.Api:/src/Humbugg.Api
      - api-bin:/src/Humbugg.Api/bin
      - api-obj:/src/Humbugg.Api/obj

volumes:
  api-bin:
  api-obj:
