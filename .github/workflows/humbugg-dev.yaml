name: Humbugg · Auth · Dev

on:
  workflow_dispatch:

concurrency:
  group: humbugg-dev
  cancel-in-progress: false

jobs:
  deploy-auth:
    name: Apply development Cognito
    runs-on: ubuntu-latest
    environment: humbugg-development
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4

      - name: Apply development authentication
        run: |
          terraform -chdir=humbugg/infra/envs/dev init -input=false
          terraform -chdir=humbugg/infra/envs/dev apply -auto-approve -input=false
