name: Scout · Deploy · Prod

# Combined prod deploy for scout.
#
# DAG (image is a prerequisite of Terraform Lambda creation, so build-and-push
# runs before deploy-infra to eliminate the chicken-and-egg of an empty ECR
# repo on first deploy):
#
#   detect-changes ─► build-and-push (always, when infra OR backend changes)
#                          │
#                          ▼
#                     deploy-infra (terraform apply)
#                          │
#                          ├─► update-lambda  (env vars + pin Lambdas to :sha)
#                          └─► deploy-frontend
#
# scout-pr.yml validates pull requests and never writes to AWS.

on:
  push:
    branches: [main]
    paths:
      - 'scout/infra/**'
      - 'scout/backend/**'
      - 'scout/frontend/**'
      - '.github/workflows/scout-prod.yaml'
  workflow_dispatch:
    inputs:
      run_infra:
        description: 'Run the deploy-infra job'
        type: boolean
        default: true
      run_app:
        description: 'Run update-lambda and deploy-frontend'
        type: boolean
        default: true
  workflow_run:
    workflows: ["Shared infra · Terraform apply · Prod"]
    types: [completed]
    branches: [main]

concurrency:
  group: scout-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  detect-changes:
    name: Detect Changes
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            infra:
              - 'scout/infra/**'
              - '.github/workflows/scout-prod.yaml'
            backend:
              - 'scout/backend/**'
              - '.github/workflows/scout-prod.yaml'
            frontend:
              - 'scout/frontend/**'
              - '.github/workflows/scout-prod.yaml'

  # ---------------------------------------------------------------------------
  # Build Docker images and push to ECR. Runs BEFORE deploy-infra so the
  # Lambda image_uri it references always exists.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    needs: detect-changes
    if: |
      !cancelled()
      && (
        (github.event_name == 'push'
         && (needs.detect-changes.outputs.infra == 'true'
             || needs.detect-changes.outputs.backend == 'true'))
        || (github.event_name == 'workflow_dispatch'
            && (inputs.run_infra || inputs.run_app))
        || github.event_name == 'workflow_run'
      )
    runs-on: ubuntu-latest
    environment: scout-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_ENV"

      - name: Ensure ECR repositories exist
        run: |
          for REPO in scout-events-api scout-renderer; do
            aws ecr describe-repositories --repository-names "$REPO" \
              --region "${{ env.AWS_REGION }}" >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "$REPO" \
              --region "${{ env.AWS_REGION }}" \
              --image-scanning-configuration scanOnPush=true \
              --tags Key=Project,Value=scout
          done

      - name: Build & push events-api
        run: |
          IMAGE="${ECR_REGISTRY}/scout-events-api"
          cd scout/backend
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Build & push renderer
        run: |
          IMAGE="${ECR_REGISTRY}/scout-renderer"
          cd scout/backend/renderer
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

  # ---------------------------------------------------------------------------
  # Apply Terraform and publish the resolved IDs into SSM for the app jobs.
  # By the time we get here :latest exists in ECR, so Lambda creation works
  # even on a fresh AWS account.
  # ---------------------------------------------------------------------------
  deploy-infra:
    name: Terraform Apply
    needs: [detect-changes, build-and-push]
    if: |
      !cancelled()
      && needs.build-and-push.result != 'failure'
      && (
        (github.event_name == 'push' && needs.detect-changes.outputs.infra == 'true')
        || (github.event_name == 'workflow_dispatch' && inputs.run_infra)
        || github.event_name == 'workflow_run'
      )
    runs-on: ubuntu-latest
    environment: scout-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=scout/infra/envs/prod init -input=false

      - name: Terraform apply
        env:
          TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        run: terraform -chdir=scout/infra/envs/prod apply -auto-approve -input=false

      - name: Write outputs to SSM
        run: |
          set -euo pipefail
          tf() { terraform -chdir=scout/infra/envs/prod output -raw "$1"; }
          aws ssm put-parameter --overwrite --type String \
            --name /scout/prod/api-url    --value "$(tf api_endpoint)"
          aws ssm put-parameter --overwrite --type String \
            --name /scout/prod/s3-bucket  --value "$(tf s3_bucket)"
          aws ssm put-parameter --overwrite --type String \
            --name /scout/prod/cf-dist-id --value "$(tf cloudfront_distribution_id)"
          aws ssm put-parameter --overwrite --type String \
            --name /scout/prod/cognito-user-pool-id --value "$(tf cognito_user_pool_id)"
          aws ssm put-parameter --overwrite --type String \
            --name /scout/prod/cognito-client-id --value "$(tf cognito_user_pool_client_id)"

  # ---------------------------------------------------------------------------
  # Bootstrap the first Cognito admin user (the pool is admin-create-user only).
  # Idempotent and self-skipping: does nothing if the admin secrets are unset or
  # the user already exists, so it never blocks a deploy.
  # ---------------------------------------------------------------------------
  bootstrap-admin:
    name: Bootstrap Admin User
    needs: [deploy-infra]
    if: |
      !cancelled()
      && needs.deploy-infra.result == 'success'
    runs-on: ubuntu-latest
    environment: scout-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create admin user
        env:
          ADMIN_EMAIL: ${{ secrets.SCOUT_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.SCOUT_ADMIN_PASSWORD }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_EMAIL}" ] || [ -z "${ADMIN_PASSWORD}" ]; then
            echo "SCOUT_ADMIN_EMAIL / SCOUT_ADMIN_PASSWORD not set — skipping admin bootstrap."
            exit 0
          fi
          USER_POOL_ID=$(aws ssm get-parameter --name /scout/prod/cognito-user-pool-id \
            --query Parameter.Value --output text)
          export USER_POOL_ID
          bash scout/scripts/create-admin-user.sh

  # ---------------------------------------------------------------------------
  # Update Lambda env vars and pin function code to :sha. No Docker work —
  # build-and-push has already pushed both :latest and :sha tags.
  # ---------------------------------------------------------------------------
  update-lambda:
    name: Update Lambda Functions
    needs: [detect-changes, build-and-push, deploy-infra]
    if: |
      !cancelled()
      && needs.build-and-push.result == 'success'
      && needs.deploy-infra.result != 'failure'
      && (
        (github.event_name == 'workflow_dispatch' && inputs.run_app)
        || (github.event_name == 'push'
            && (needs.detect-changes.outputs.backend == 'true'
                || needs.deploy-infra.result == 'success'))
        || (github.event_name == 'workflow_run'
            && needs.deploy-infra.result == 'success')
      )
    runs-on: ubuntu-latest
    environment: scout-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set ECR registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_ENV"

      - name: Update Lambda env vars
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CLIENT_ID:     ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          # Public API base, used by the Lambda to emit absolute our-domain URLs
          # for images and run artifacts. Mirrors VITE_API_URL.
          API_URL=$(aws ssm get-parameter --name /scout/prod/api-url \
            --query 'Parameter.Value' --output text)
          jq -n --arg api_url "${API_URL}" \
            '{Variables: {SCOUT_TABLE_SUFFIX: "", SCOUT_PROCESSOR_FN: "scout-source-run-processor", SCOUT_PUBLIC_API_URL: $api_url}}' \
            > /tmp/env-events-api.json

          jq -n --arg anthropic "${ANTHROPIC_API_KEY}" \
            --arg client_id "${GMAIL_CLIENT_ID}" --arg client_secret "${GMAIL_CLIENT_SECRET}" \
            --arg refresh_token "${GMAIL_REFRESH_TOKEN}" \
            '{Variables: {
              SCOUT_TABLE_SUFFIX:     "",
              SCOUT_ARTIFACTS_BUCKET: "scout-artifacts-production",
              SCOUT_IMAGES_BUCKET:    "scout-images-production",
              SCOUT_RENDERER_FN:      "scout-source-renderer",
              ANTHROPIC_API_KEY:      $anthropic,
              GMAIL_CLIENT_ID:        $client_id,
              GMAIL_CLIENT_SECRET:    $client_secret,
              GMAIL_REFRESH_TOKEN:    $refresh_token
            }}' > /tmp/env-processor.json

          jq -n '{Variables: {SCOUT_TABLE_SUFFIX: "", SCOUT_PROCESSOR_FN: "scout-source-run-processor"}}' \
            > /tmp/env-scheduler.json

          jq -n '{Variables: {SCOUT_TABLE_SUFFIX: ""}}' > /tmp/env-sweep.json

          set_env() {
            aws lambda update-function-configuration \
              --function-name "$1" --region "${{ env.AWS_REGION }}" \
              --environment "file://$2"
            aws lambda wait function-updated \
              --function-name "$1" --region "${{ env.AWS_REGION }}"
          }
          set_env scout-events-api           /tmp/env-events-api.json
          set_env scout-source-run-processor /tmp/env-processor.json
          set_env scout-scheduler            /tmp/env-scheduler.json
          set_env scout-sweep                /tmp/env-sweep.json

      - name: Update Lambda function code
        run: |
          set -euo pipefail
          update_code() {
            aws lambda update-function-code \
              --function-name "$1" \
              --image-uri "$2" \
              --region "${{ env.AWS_REGION }}" \
              --output table \
              --query '{FunctionName:FunctionName,CodeSize:CodeSize}'
          }
          # events-api + the run-pipeline Lambdas (processor/scheduler/sweep)
          # all share the one events-api image.
          for FN in scout-events-api scout-source-run-processor scout-scheduler scout-sweep; do
            update_code "${FN}" "${ECR_REGISTRY}/scout-events-api:${{ github.sha }}"
          done
          # The renderer ships from its own image.
          update_code scout-source-renderer "${ECR_REGISTRY}/scout-renderer:${{ github.sha }}"

  # ---------------------------------------------------------------------------
  # Build Vite SPA and sync to S3 + CloudFront.
  # Values come from SSM (written by deploy-infra).
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend
    needs: [detect-changes, deploy-infra]
    if: |
      !cancelled()
      && needs.deploy-infra.result != 'failure'
      && ((github.event_name == 'workflow_dispatch' && inputs.run_app)
          || (github.event_name == 'push'
              && (needs.detect-changes.outputs.frontend == 'true'
                  || needs.deploy-infra.result == 'success'))
          || (github.event_name == 'workflow_run'
              && needs.deploy-infra.result == 'success'))
    runs-on: ubuntu-latest
    environment: scout-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scout/frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read infrastructure values from SSM
        run: |
          get() { aws ssm get-parameter --name "/scout/prod/${1}" \
            --query Parameter.Value --output text; }

          echo "VITE_API_URL=$(get api-url)"            >> "$GITHUB_ENV"
          echo "S3_BUCKET=$(get s3-bucket)"             >> "$GITHUB_ENV"
          echo "CF_DIST_ID=$(get cf-dist-id)"           >> "$GITHUB_ENV"
          echo "VITE_COGNITO_USER_POOL_ID=$(get cognito-user-pool-id)" >> "$GITHUB_ENV"
          echo "VITE_COGNITO_CLIENT_ID=$(get cognito-client-id)"       >> "$GITHUB_ENV"

      - name: Install dependencies
        run: cd scout/frontend && npm ci

      - name: Build frontend
        env:
          VITE_BASE: /app/
        run: cd scout/frontend && npm run build

      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync scout/frontend/dist/ "s3://${S3_BUCKET}/app/" \
            --region "${{ env.AWS_REGION }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"

      - name: Sync HTML (no cache)
        run: |
          aws s3 sync scout/frontend/dist/ "s3://${S3_BUCKET}/app/" \
            --region "${{ env.AWS_REGION }}" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --include "*.html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DIST_ID}" \
            --paths "/*"
