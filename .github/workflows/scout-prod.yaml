name: Scout · Deploy · Prod

# Combined prod deploy for scout.
#
# DAG (image is a prerequisite of Terraform Lambda creation, so build-and-push
# runs before deploy-infra to eliminate the chicken-and-egg of an empty ECR
# repo on first deploy):
#
#   detect-changes ─► build-and-push (always, when infra OR backend changes)
#                          │
#                          ▼
#                     deploy-infra (terraform apply)
#                          │
#                          ├─► update-lambda  (env vars + pin Lambdas to :sha)
#                          └─► deploy-frontend
#
# scout-pr.yml validates pull requests and never writes to AWS.

on:
  push:
    branches: [main]
    paths:
      - 'scout/infra/**'
      - 'scout/backend/**'
      - 'scout/frontend/**'
      - '.github/workflows/scout-prod.yaml'
  workflow_dispatch:
    inputs:
      run_infra:
        description: 'Run the deploy-infra job'
        type: boolean
        default: true
      run_app:
        description: 'Run update-lambda and deploy-frontend'
        type: boolean
        default: true
  workflow_run:
    workflows: ["Shared infra · Terraform apply · Prod"]
    types: [completed]
    branches: [main]

concurrency:
  group: scout-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  detect-changes:
    name: Detect Changes
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            infra:
              - 'scout/infra/**'
              - '.github/workflows/scout-prod.yaml'
            backend:
              - 'scout/backend/**'
              - '.github/workflows/scout-prod.yaml'
            frontend:
              - 'scout/frontend/**'
              - '.github/workflows/scout-prod.yaml'

  # ---------------------------------------------------------------------------
  # Build Docker images and push to ECR. Runs BEFORE deploy-infra so the
  # Lambda image_uri it references always exists.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    needs: detect-changes
    if: |
      !cancelled()
      && (
        (github.event_name == 'push'
         && (needs.detect-changes.outputs.infra == 'true'
             || needs.detect-changes.outputs.backend == 'true'))
        || (github.event_name == 'workflow_dispatch'
            && (inputs.run_infra || inputs.run_app))
        || github.event_name == 'workflow_run'
      )
    runs-on: ubuntu-latest
    environment: scout-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_ENV"

      - name: Ensure ECR repositories exist
        run: |
          for REPO in scout-prod-events-api scout-prod-renderer; do
            aws ecr describe-repositories --repository-names "$REPO" \
              --region "${{ env.AWS_REGION }}" >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "$REPO" \
              --region "${{ env.AWS_REGION }}" \
              --image-scanning-configuration scanOnPush=true \
              --tags Key=Project,Value=scout
          done

      - name: Build & push events-api
        run: |
          IMAGE="${ECR_REGISTRY}/scout-prod-events-api"
          cd scout/backend
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Build & push renderer
        run: |
          IMAGE="${ECR_REGISTRY}/scout-prod-renderer"
          cd scout/backend/renderer
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

  # ---------------------------------------------------------------------------
  # Apply Terraform and publish the resolved IDs into SSM for the app jobs.
  # By the time we get here :latest exists in ECR, so Lambda creation works
  # even on a fresh AWS account.
  # ---------------------------------------------------------------------------
  deploy-infra:
    name: Terraform Apply
    needs: [detect-changes, build-and-push]
    if: |
      !cancelled()
      && needs.build-and-push.result != 'failure'
      && (
        (github.event_name == 'push' && needs.detect-changes.outputs.infra == 'true')
        || (github.event_name == 'workflow_dispatch' && inputs.run_infra)
        || github.event_name == 'workflow_run'
      )
    runs-on: ubuntu-latest
    environment: scout-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=scout/infra/envs/prod init -input=false

      # ECR repositories are created by build-and-push above so that :latest
      # exists before Terraform creates a Lambda that references it. That means
      # Terraform would try to create a repository AWS already has. Adopt it.
      #
      # This also covers a *rename*: when state holds a repository under the old
      # name, plain adoption is not enough -- Terraform would plan a replace and
      # fail with RepositoryAlreadyExistsException against the repo build-and-push
      # just made. So drop the stale object and import the new one in its place.
      # The old repository is deliberately left in AWS; deleting it is a separate,
      # deliberate step, not something a deploy should do behind your back.
      - name: Adopt bootstrap-created ECR repositories
        # `terraform import` evaluates the whole configuration, so it needs every
        # required variable -- the same ones the apply below is given. Without
        # this the step fails after `state rm` but before `import`, leaving the
        # repository tracked by nothing.
        env:
          TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          TF_DIR=scout/infra/envs/prod
          adopt() {
            local addr="$1" repo="$2" policy_addr="$3"
            if terraform -chdir="$TF_DIR" state show "$addr" >/dev/null 2>&1; then
              local current
              current=$(terraform -chdir="$TF_DIR" state show "$addr" \
                        | awk -F'"' '/^ *name *=/{print $2; exit}')
              if [ "$current" = "$repo" ]; then
                echo "already correct: $addr -> $repo"; return
              fi
              echo "rename: $addr holds '$current', config wants '$repo' -- re-adopting"
              terraform -chdir="$TF_DIR" state rm "$addr"
              # the lifecycle policy is keyed by repository name, so it goes too
              terraform -chdir="$TF_DIR" state rm "$policy_addr" 2>/dev/null || true
            fi
            if ! aws ecr describe-repositories --repository-names "$repo" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
              echo "not in AWS, Terraform will create it: $repo"; return
            fi
            echo "importing $repo -> $addr"
            terraform -chdir="$TF_DIR" import -input=false "$addr" "$repo"
          }
          adopt 'module.compute.aws_ecr_repository.events_api[0]' scout-prod-events-api 'module.compute.aws_ecr_lifecycle_policy.events_api[0]'
          adopt 'module.compute.aws_ecr_repository.renderer[0]' scout-prod-renderer 'module.compute.aws_ecr_lifecycle_policy.renderer[0]'

      - name: Terraform apply
        env:
          TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        run: terraform -chdir=scout/infra/envs/prod apply -auto-approve -input=false

      - name: Write outputs to SSM
        run: |
          set -euo pipefail
          tf() { terraform -chdir=scout/infra/envs/prod output -raw "$1"; }
          aws ssm put-parameter --overwrite --type String \
            --name /scout/prod/api-url    --value "$(tf api_endpoint)"
          aws ssm put-parameter --overwrite --type String \
            --name /scout/prod/s3-bucket  --value "$(tf s3_bucket)"
          aws ssm put-parameter --overwrite --type String \
            --name /scout/prod/cf-dist-id --value "$(tf cloudfront_distribution_id)"
          aws ssm put-parameter --overwrite --type String \
            --name /scout/prod/cognito-user-pool-id --value "$(tf cognito_user_pool_id)"
          aws ssm put-parameter --overwrite --type String \
            --name /scout/prod/cognito-client-id --value "$(tf cognito_user_pool_client_id)"

  # ---------------------------------------------------------------------------
  # Bootstrap the first Cognito admin user (the pool is admin-create-user only).
  # Idempotent and self-skipping: does nothing if the admin secrets are unset or
  # the user already exists, so it never blocks a deploy.
  # ---------------------------------------------------------------------------
  bootstrap-admin:
    name: Bootstrap Admin User
    needs: [deploy-infra]
    if: |
      !cancelled()
      && needs.deploy-infra.result == 'success'
    runs-on: ubuntu-latest
    environment: scout-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Passed under their own names rather than mapped down to bare
      # `ADMIN_*`. The script reads the prefixed pair first now, so the step no
      # longer has to rename anything — and the bare names were the ones that
      # could serve website's script just as well from a shared shell.
      - name: Create admin user
        env:
          SCOUT_ADMIN_EMAIL: ${{ secrets.SCOUT_ADMIN_EMAIL }}
          SCOUT_ADMIN_PASSWORD: ${{ secrets.SCOUT_ADMIN_PASSWORD }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          if [ -z "${SCOUT_ADMIN_EMAIL}" ] || [ -z "${SCOUT_ADMIN_PASSWORD}" ]; then
            echo "SCOUT_ADMIN_EMAIL / SCOUT_ADMIN_PASSWORD not set — skipping admin bootstrap."
            exit 0
          fi
          USER_POOL_ID=$(aws ssm get-parameter --name /scout/prod/cognito-user-pool-id \
            --query Parameter.Value --output text)
          export USER_POOL_ID
          bash scout/scripts/create-admin-user.sh

  # ---------------------------------------------------------------------------
  # Update Lambda env vars and pin function code to :sha. No Docker work —
  # build-and-push has already pushed both :latest and :sha tags.
  # ---------------------------------------------------------------------------
  update-lambda:
    name: Update Lambda Functions
    needs: [detect-changes, build-and-push, deploy-infra]
    if: |
      !cancelled()
      && needs.build-and-push.result == 'success'
      && needs.deploy-infra.result != 'failure'
      && (
        (github.event_name == 'workflow_dispatch' && inputs.run_app)
        || (github.event_name == 'push'
            && (needs.detect-changes.outputs.backend == 'true'
                || needs.deploy-infra.result == 'success'))
        || (github.event_name == 'workflow_run'
            && needs.deploy-infra.result == 'success')
      )
    runs-on: ubuntu-latest
    environment: scout-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set ECR registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_ENV"

      - name: Update Lambda env vars
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CLIENT_ID:     ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          # Public API base, used by the Lambda to emit absolute our-domain URLs
          # for images and run artifacts. Mirrors VITE_API_URL.
          API_URL=$(aws ssm get-parameter --name /scout/prod/api-url \
            --query 'Parameter.Value' --output text)
          jq -n --arg api_url "${API_URL}" \
            '{Variables: {SCOUT_CORE_TABLE: "scout-prod-core", SCOUT_SETTINGS_TABLE: "scout-prod-settings", SCOUT_PROCESSOR_FN: "scout-prod-source-run-processor", SCOUT_PUBLIC_API_URL: $api_url}}' \
            > /tmp/env-events-api.json

          jq -n --arg anthropic "${ANTHROPIC_API_KEY}" \
            --arg client_id "${GMAIL_CLIENT_ID}" --arg client_secret "${GMAIL_CLIENT_SECRET}" \
            --arg refresh_token "${GMAIL_REFRESH_TOKEN}" \
            '{Variables: {
              SCOUT_CORE_TABLE:       "scout-prod-core",
              SCOUT_SETTINGS_TABLE:   "scout-prod-settings",
              SCOUT_ARTIFACTS_BUCKET: "scout-prod-artifacts-us-east-1",
              SCOUT_IMAGES_BUCKET:    "scout-prod-images-us-east-1",
              SCOUT_RENDERER_FN:      "scout-prod-source-renderer",
              ANTHROPIC_API_KEY:      $anthropic,
              GMAIL_CLIENT_ID:        $client_id,
              GMAIL_CLIENT_SECRET:    $client_secret,
              GMAIL_REFRESH_TOKEN:    $refresh_token
            }}' > /tmp/env-processor.json

          jq -n '{Variables: {SCOUT_CORE_TABLE: "scout-prod-core", SCOUT_SETTINGS_TABLE: "scout-prod-settings", SCOUT_PROCESSOR_FN: "scout-prod-source-run-processor"}}' \
            > /tmp/env-scheduler.json

          jq -n '{Variables: {SCOUT_CORE_TABLE: "scout-prod-core", SCOUT_SETTINGS_TABLE: "scout-prod-settings"}}' > /tmp/env-sweep.json

          set_env() {
            aws lambda update-function-configuration \
              --function-name "$1" --region "${{ env.AWS_REGION }}" \
              --environment "file://$2"
            aws lambda wait function-updated \
              --function-name "$1" --region "${{ env.AWS_REGION }}"
          }
          set_env scout-prod-events-api           /tmp/env-events-api.json
          set_env scout-prod-source-run-processor /tmp/env-processor.json
          set_env scout-prod-scheduler            /tmp/env-scheduler.json
          set_env scout-prod-sweep                /tmp/env-sweep.json

      - name: Update Lambda function code
        run: |
          set -euo pipefail
          update_code() {
            aws lambda update-function-code \
              --function-name "$1" \
              --image-uri "$2" \
              --region "${{ env.AWS_REGION }}" \
              --output table \
              --query '{FunctionName:FunctionName,CodeSize:CodeSize}'
          }
          # events-api + the run-pipeline Lambdas (processor/scheduler/sweep)
          # all share the one events-api image.
          for FN in scout-prod-events-api scout-prod-source-run-processor scout-prod-scheduler scout-prod-sweep; do
            update_code "${FN}" "${ECR_REGISTRY}/scout-prod-events-api:${{ github.sha }}"
          done
          # The renderer ships from its own image.
          update_code scout-prod-source-renderer "${ECR_REGISTRY}/scout-prod-renderer:${{ github.sha }}"

  # ---------------------------------------------------------------------------
  # Build Vite SPA and sync to S3 + CloudFront.
  # Values come from SSM (written by deploy-infra).
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend
    needs: [detect-changes, deploy-infra]
    if: |
      !cancelled()
      && needs.deploy-infra.result != 'failure'
      && ((github.event_name == 'workflow_dispatch' && inputs.run_app)
          || (github.event_name == 'push'
              && (needs.detect-changes.outputs.frontend == 'true'
                  || needs.deploy-infra.result == 'success'))
          || (github.event_name == 'workflow_run'
              && needs.deploy-infra.result == 'success'))
    runs-on: ubuntu-latest
    environment: scout-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scout/frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read infrastructure values from SSM
        run: |
          # Assign, check, then export. `echo "X=$(get …)" >> "$GITHUB_ENV"`
          # took its exit status from `echo`, not from the substitution, so a
          # failed or renamed parameter wrote an EMPTY STRING and the step went
          # green under `bash -e`. An assignment carries the substitution's
          # status, and `exit` inside a function called at top level ends the
          # job rather than a subshell.
          #
          # `None` is what `--output text` prints for a null value, so it is an
          # empty read wearing a name.
          put() {
            local value
            value="$(aws ssm get-parameter --name "$2" \
              --query Parameter.Value --output text)" || exit 1
            [ -n "$value" ] && [ "$value" != "None" ] ||
              { echo "::error::$2 resolved empty; refusing to continue." >&2; exit 1; }
            echo "$1=$value" >> "$GITHUB_ENV"
          }

          put VITE_API_URL              /scout/prod/api-url
          put S3_BUCKET                 /scout/prod/s3-bucket
          put CF_DIST_ID                /scout/prod/cf-dist-id
          # Vite inlines these; empty ships an SPA whose login can never succeed.
          put VITE_COGNITO_USER_POOL_ID /scout/prod/cognito-user-pool-id
          put VITE_COGNITO_CLIENT_ID    /scout/prod/cognito-client-id

      - name: Install dependencies
        run: cd scout/frontend && npm ci

      - name: Build frontend
        env:
          VITE_BASE: /app/
        run: cd scout/frontend && npm run build

      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync scout/frontend/dist/ "s3://${S3_BUCKET}/app/" \
            --region "${{ env.AWS_REGION }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"

      - name: Sync HTML (no cache)
        run: |
          aws s3 sync scout/frontend/dist/ "s3://${S3_BUCKET}/app/" \
            --region "${{ env.AWS_REGION }}" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --include "*.html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DIST_ID}" \
            --paths "/*"
