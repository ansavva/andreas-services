name: Scout · Deploy · Prod

# Combined prod deploy for scout. Runs infra first (when the prod CFN template
# changes or manual dispatch requests it), then backend + frontend in parallel.
# Infra writes SSM params under /scout/prod/* that the app jobs read.
#
# DAG:
#   detect-changes ─► deploy-infra (if scout/cloudformation.yaml changed)
#                          │
#                          ├─► deploy-backend  (if scout/backend/** changed OR infra ran)
#                          └─► deploy-frontend (if scout/frontend/** changed OR infra ran)
#
# PR previews live in a different environment (scout-pr). Their workflows
# (scout-pr.yaml and scout-pr-teardown.yaml) stay separate. The shared
# preview infra is deployed as part of scout-pr.yaml itself.

on:
  push:
    branches: [main]
    paths:
      - 'scout/infra/cloudformation.yaml'
      - 'scout/backend/**'
      - 'scout/frontend/**'
      - '.github/workflows/scout-prod.yaml'
  workflow_dispatch:
    inputs:
      run_infra:
        description: 'Run the deploy-infra job'
        type: boolean
        default: true
      run_app:
        description: 'Run the deploy-backend and deploy-frontend jobs'
        type: boolean
        default: true
  workflow_run:
    workflows: ["Shared infra · Terraform apply · Prod"]
    types: [completed]
    branches: [main]

concurrency:
  group: scout-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: scout

jobs:
  detect-changes:
    name: Detect Changes
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'scout/infra/cloudformation.yaml'
              - '.github/workflows/scout-prod.yaml'
            backend:
              - 'scout/backend/**'
              - '.github/workflows/scout-prod.yaml'
            frontend:
              - 'scout/frontend/**'
              - '.github/workflows/scout-prod.yaml'

  # ---------------------------------------------------------------------------
  # Production stack (scout) — Lambdas, API GW @ scout-api.andreas.services,
  # CloudFront @ scout.andreas.services, DynamoDB, Route53.
  # Bootstrap ECR repos with a placeholder image before the first CFN deploy
  # so CloudFormation always has a valid ImageUri to reference.
  # ---------------------------------------------------------------------------
  deploy-infra:
    name: Deploy prod stack (scout)
    needs: detect-changes
    if: |
      (github.event_name == 'push' && needs.detect-changes.outputs.infra == 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.run_infra)
      || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    environment: scout-production
    permissions:
      id-token: write
      contents: read
    outputs:
      email_processor_image_uri: ${{ steps.ecr.outputs.email_processor_image_uri }}
      events_api_image_uri: ${{ steps.ecr.outputs.events_api_image_uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve shared infrastructure
        id: shared
        run: |
          ACM_ARN=$(aws acm list-certificates \
            --region us-east-1 \
            --query "CertificateSummaryList[?DomainName=='*.andreas.services'].CertificateArn | [0]" \
            --output text)
          ZONE_ID=$(aws route53 list-hosted-zones \
            --query "HostedZones[?Name=='andreas.services.'].Id | [0]" \
            --output text | sed 's|/hostedzone/||')
          echo "acm_arn=${ACM_ARN}" >> "$GITHUB_OUTPUT"
          echo "zone_id=${ZONE_ID}" >> "$GITHUB_OUTPUT"

      # Bootstrap ECR: create repos if absent, push base image placeholder so
      # CloudFormation has a valid ImageUri on first deploy (chicken-and-egg fix).
      - name: Bootstrap ECR repositories
        id: ecr
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"

          for REPO in scout-email-processor scout-events-api; do
            aws ecr describe-repositories --repository-names "${REPO}" \
              --region "${{ env.AWS_REGION }}" > /dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "${REPO}" \
              --region "${{ env.AWS_REGION }}" \
              --image-scanning-configuration scanOnPush=true \
              --tags Key=Project,Value=scout

            aws ecr put-lifecycle-policy \
              --repository-name "${REPO}" \
              --region "${{ env.AWS_REGION }}" \
              --lifecycle-policy-text '{"rules":[{"rulePriority":1,"description":"Keep last 10 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

            # Push placeholder only if no images exist yet
            IMAGE_COUNT=$(aws ecr describe-images \
              --repository-name "${REPO}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'length(imageDetails)' \
              --output text 2>/dev/null || echo "0")
            if [ "${IMAGE_COUNT}" = "0" ]; then
              aws ecr get-login-password --region "${{ env.AWS_REGION }}" | \
                docker login --username AWS --password-stdin "${REGISTRY}"
              docker pull public.ecr.aws/lambda/python:3.11
              docker tag public.ecr.aws/lambda/python:3.11 "${REGISTRY}/${REPO}:latest"
              docker push "${REGISTRY}/${REPO}:latest"
            fi
          done

          echo "email_processor_image_uri=${REGISTRY}/scout-email-processor:latest" >> "$GITHUB_OUTPUT"
          echo "events_api_image_uri=${REGISTRY}/scout-events-api:latest"           >> "$GITHUB_OUTPUT"

      - name: Deploy CloudFormation stack
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"

          aws cloudformation deploy \
            --template-file scout/infra/cloudformation.yaml \
            --stack-name "${{ env.STACK_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ProjectName=scout" \
              "EmailProcessorImageUri=${REGISTRY}/scout-email-processor:latest" \
              "EventsApiImageUri=${REGISTRY}/scout-events-api:latest" \
              "AcmCertificateArn=${{ steps.shared.outputs.acm_arn }}" \
              "Route53HostedZoneId=${{ steps.shared.outputs.zone_id }}" \
              "AnthropicApiKey=${{ secrets.ANTHROPIC_API_KEY }}" \
              "GmailClientId=${{ secrets.GMAIL_CLIENT_ID }}" \
              "GmailClientSecret=${{ secrets.GMAIL_CLIENT_SECRET }}" \
              "GmailRefreshToken=${{ secrets.GMAIL_REFRESH_TOKEN }}"

      - name: Store infrastructure outputs in SSM
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "${{ env.STACK_NAME }}" \
              --query "Stacks[0].Outputs[?OutputKey=='${1}'].OutputValue | [0]" \
              --output text
          }

          aws ssm put-parameter --overwrite --type String \
            --name /scout/prod/api-url \
            --value "$(get_output ApiEndpoint)"

          aws ssm put-parameter --overwrite --type String \
            --name /scout/prod/s3-bucket \
            --value "$(get_output S3BucketName)"

          aws ssm put-parameter --overwrite --type String \
            --name /scout/prod/cf-dist-id \
            --value "$(get_output CloudFrontDistributionId)"

  # ---------------------------------------------------------------------------
  # Build Docker images and push to ECR, then update Lambda functions
  # ---------------------------------------------------------------------------
  deploy-backend:
    name: Deploy Lambda Functions
    needs: [detect-changes, deploy-infra]
    if: |
      !cancelled()
      && needs.deploy-infra.result != 'failure'
      && ((github.event_name == 'workflow_dispatch' && inputs.run_app)
          || (github.event_name == 'push'
              && (needs.detect-changes.outputs.backend == 'true'
                  || needs.deploy-infra.result == 'success'))
          || (github.event_name == 'workflow_run'
              && needs.deploy-infra.result == 'success'))
    runs-on: ubuntu-latest
    environment: scout-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_ENV"

      - name: Build & push email-processor
        run: |
          IMAGE="${ECR_REGISTRY}/scout-email-processor"
          cd scout/backend/email-processor
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Build & push events-api
        run: |
          IMAGE="${ECR_REGISTRY}/scout-events-api"
          cd scout/backend/events-api
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Update Lambda function code
        run: |
          for FN in scout-email-processor scout-events-api; do
            aws lambda update-function-code \
              --function-name "${FN}" \
              --image-uri "${ECR_REGISTRY}/${FN}:${{ github.sha }}" \
              --region "${{ env.AWS_REGION }}" \
              --output table \
              --query '{FunctionName:FunctionName,CodeSize:CodeSize}'
          done

  # ---------------------------------------------------------------------------
  # Build Vite SPA and sync to S3 + CloudFront
  # Values come from SSM (written by deploy-infra)
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend
    needs: [detect-changes, deploy-infra]
    if: |
      !cancelled()
      && needs.deploy-infra.result != 'failure'
      && ((github.event_name == 'workflow_dispatch' && inputs.run_app)
          || (github.event_name == 'push'
              && (needs.detect-changes.outputs.frontend == 'true'
                  || needs.deploy-infra.result == 'success'))
          || (github.event_name == 'workflow_run'
              && needs.deploy-infra.result == 'success'))
    runs-on: ubuntu-latest
    environment: scout-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: scout/frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read infrastructure values from SSM
        run: |
          get() { aws ssm get-parameter --name "/scout/prod/${1}" \
            --query Parameter.Value --output text; }

          echo "VITE_API_URL=$(get api-url)"            >> "$GITHUB_ENV"
          echo "S3_BUCKET=$(get s3-bucket)"             >> "$GITHUB_ENV"
          echo "CF_DIST_ID=$(get cf-dist-id)"           >> "$GITHUB_ENV"

      - name: Install dependencies
        run: cd scout/frontend && npm ci

      - name: Build frontend
        env:
          VITE_BASE: /app/
        run: cd scout/frontend && npm run build

      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync scout/frontend/dist/ "s3://${S3_BUCKET}/app/" \
            --region "${{ env.AWS_REGION }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"

      - name: Sync HTML (no cache)
        run: |
          aws s3 sync scout/frontend/dist/ "s3://${S3_BUCKET}/app/" \
            --region "${{ env.AWS_REGION }}" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --include "*.html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DIST_ID}" \
            --paths "/*"
