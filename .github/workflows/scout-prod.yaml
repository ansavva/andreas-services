name: Scout · Deploy · Prod

# Combined prod deploy for scout. Runs infra first (when the prod CFN template
# changes or manual dispatch requests it), then backend + frontend in parallel.
# Infra writes SSM params under /scout/prod/* that the app jobs read.
#
# DAG:
#   detect-changes ─► deploy-infra (if scout/cloudformation.yaml changed)
#                          │
#                          ├─► deploy-backend  (if scout/backend/** changed OR infra ran)
#                          └─► deploy-frontend (if scout/frontend/** changed OR infra ran)
#
# PR previews live in a different environment (scout-pr). Their workflows
# (scout-pr.yaml and scout-pr-teardown.yaml) stay separate. The shared
# preview infra is deployed as part of scout-pr.yaml itself.

on:
  push:
    branches: [main]
    paths:
      - 'scout/infra/**'
      - 'scout/backend/**'
      - 'scout/frontend/**'
      - '.github/workflows/scout-prod.yaml'
  workflow_dispatch:
    inputs:
      run_infra:
        description: 'Run the deploy-infra job'
        type: boolean
        default: true
      run_app:
        description: 'Run the deploy-backend and deploy-frontend jobs'
        type: boolean
        default: true
  workflow_run:
    workflows: ["Shared infra · Terraform apply · Prod"]
    types: [completed]
    branches: [main]

concurrency:
  group: scout-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  detect-changes:
    name: Detect Changes
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'scout/infra/**'
              - '.github/workflows/scout-prod.yaml'
            backend:
              - 'scout/backend/**'
              - '.github/workflows/scout-prod.yaml'
            frontend:
              - 'scout/frontend/**'
              - '.github/workflows/scout-prod.yaml'

  # ---------------------------------------------------------------------------
  # Apply Terraform and publish the resolved IDs into SSM for the app jobs.
  # ---------------------------------------------------------------------------
  deploy-infra:
    name: Terraform Apply
    needs: detect-changes
    if: |
      (github.event_name == 'push' && needs.detect-changes.outputs.infra == 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.run_infra)
      || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    environment: scout-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=scout/infra/envs/prod init -input=false

      - name: Terraform apply
        env:
          TF_VAR_anthropic_api_key:   ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_gmail_client_id:     ${{ secrets.GMAIL_CLIENT_ID }}
          TF_VAR_gmail_client_secret: ${{ secrets.GMAIL_CLIENT_SECRET }}
          TF_VAR_gmail_refresh_token: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: terraform -chdir=scout/infra/envs/prod apply -auto-approve -input=false

      - name: Write outputs to SSM
        run: |
          set -euo pipefail
          tf() { terraform -chdir=scout/infra/envs/prod output -raw "$1"; }
          aws ssm put-parameter --overwrite --type String \
            --name /scout/prod/api-url    --value "$(tf api_endpoint)"
          aws ssm put-parameter --overwrite --type String \
            --name /scout/prod/s3-bucket  --value "$(tf s3_bucket)"
          aws ssm put-parameter --overwrite --type String \
            --name /scout/prod/cf-dist-id --value "$(tf cloudfront_distribution_id)"

  # ---------------------------------------------------------------------------
  # Build Docker images and push to ECR, then update Lambda functions
  # ---------------------------------------------------------------------------
  deploy-backend:
    name: Deploy Lambda Functions
    needs: [detect-changes, deploy-infra]
    if: |
      !cancelled()
      && needs.deploy-infra.result != 'failure'
      && ((github.event_name == 'workflow_dispatch' && inputs.run_app)
          || (github.event_name == 'push'
              && (needs.detect-changes.outputs.backend == 'true'
                  || needs.deploy-infra.result == 'success'))
          || (github.event_name == 'workflow_run'
              && needs.deploy-infra.result == 'success'))
    runs-on: ubuntu-latest
    environment: scout-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_ENV"

      - name: Build & push email-processor
        run: |
          IMAGE="${ECR_REGISTRY}/scout-email-processor"
          cd scout/backend/email-processor
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Build & push events-api
        run: |
          IMAGE="${ECR_REGISTRY}/scout-events-api"
          cd scout/backend/events-api
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Update Lambda env vars
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CLIENT_ID:     ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          jq -n \
            --arg table        "scout-events" \
            --arg anthropic    "${ANTHROPIC_API_KEY}" \
            --arg client_id    "${GMAIL_CLIENT_ID}" \
            --arg client_secret "${GMAIL_CLIENT_SECRET}" \
            --arg refresh_token "${GMAIL_REFRESH_TOKEN}" \
            '{Variables: {
              DYNAMODB_TABLE_NAME:  $table,
              ANTHROPIC_API_KEY:    $anthropic,
              GMAIL_CLIENT_ID:      $client_id,
              GMAIL_CLIENT_SECRET:  $client_secret,
              GMAIL_REFRESH_TOKEN:  $refresh_token
            }}' > /tmp/env-email-processor.json

          jq -n \
            --arg table "scout-events" \
            '{Variables: {DYNAMODB_TABLE_NAME: $table}}' \
            > /tmp/env-events-api.json

          aws lambda update-function-configuration \
            --function-name "scout-email-processor" \
            --region "${{ env.AWS_REGION }}" \
            --environment file:///tmp/env-email-processor.json

          aws lambda update-function-configuration \
            --function-name "scout-events-api" \
            --region "${{ env.AWS_REGION }}" \
            --environment file:///tmp/env-events-api.json

          aws lambda wait function-updated \
            --function-name "scout-email-processor" --region "${{ env.AWS_REGION }}"
          aws lambda wait function-updated \
            --function-name "scout-events-api" --region "${{ env.AWS_REGION }}"

      - name: Update Lambda function code
        run: |
          for FN in scout-email-processor scout-events-api; do
            aws lambda update-function-code \
              --function-name "${FN}" \
              --image-uri "${ECR_REGISTRY}/${FN}:${{ github.sha }}" \
              --region "${{ env.AWS_REGION }}" \
              --output table \
              --query '{FunctionName:FunctionName,CodeSize:CodeSize}'
          done

  # ---------------------------------------------------------------------------
  # Build Vite SPA and sync to S3 + CloudFront
  # Values come from SSM (written by deploy-infra)
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend
    needs: [detect-changes, deploy-infra]
    if: |
      !cancelled()
      && needs.deploy-infra.result != 'failure'
      && ((github.event_name == 'workflow_dispatch' && inputs.run_app)
          || (github.event_name == 'push'
              && (needs.detect-changes.outputs.frontend == 'true'
                  || needs.deploy-infra.result == 'success'))
          || (github.event_name == 'workflow_run'
              && needs.deploy-infra.result == 'success'))
    runs-on: ubuntu-latest
    environment: scout-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: scout/frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read infrastructure values from SSM
        run: |
          get() { aws ssm get-parameter --name "/scout/prod/${1}" \
            --query Parameter.Value --output text; }

          echo "VITE_API_URL=$(get api-url)"            >> "$GITHUB_ENV"
          echo "S3_BUCKET=$(get s3-bucket)"             >> "$GITHUB_ENV"
          echo "CF_DIST_ID=$(get cf-dist-id)"           >> "$GITHUB_ENV"

      - name: Install dependencies
        run: cd scout/frontend && npm ci

      - name: Build frontend
        env:
          VITE_BASE: /app/
        run: cd scout/frontend && npm run build

      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync scout/frontend/dist/ "s3://${S3_BUCKET}/app/" \
            --region "${{ env.AWS_REGION }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"

      - name: Sync HTML (no cache)
        run: |
          aws s3 sync scout/frontend/dist/ "s3://${S3_BUCKET}/app/" \
            --region "${{ env.AWS_REGION }}" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --include "*.html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DIST_ID}" \
            --paths "/*"
