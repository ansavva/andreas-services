name: Scout · PR

# Combined PR workflow for scout. Validates first (lint, unit tests, frontend
# build); then ensures the shared PR-preview infrastructure exists (idempotent
# CFN deploy); finally spins up the per-PR preview stack.
#
# DAG:
#   lint-unit-build ─► deploy-preview-infra ─► deploy-preview
#
# The shared preview infra (scout-pr-preview CFN stack — S3 bucket +
# CloudFront @ scout-pr.andreas.services and API Gateway custom domain
# @ scout-api-pr.andreas.services) used to live in its own workflow that ran
# only from main, which meant fresh AWS accounts needed a manual bootstrap
# before the first PR could deploy. We inline the deploy here instead so
# every PR self-heals the shared stack as part of its run.
#
# Teardown on close is handled by .github/workflows/scout-pr-teardown.yaml.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scout/**'
      - '.github/workflows/scout-pr.yml'

concurrency:
  group: scout-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  STACK_NAME: scout-pr-${{ github.event.pull_request.number }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  # ---------------------------------------------------------------------------
  # Validate: lint + unit tests + frontend build. Gates the preview deploy.
  # ---------------------------------------------------------------------------
  lint-unit-build:
    name: Lint, Unit Tests & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install --quiet poetry==2.2.1 poetry-plugin-export

      - name: Lint Python (ruff)
        run: |
          pip install --quiet ruff==0.15.8
          ruff check scout

      - name: Install events-api test deps
        run: |
          cd scout/backend/events-api
          poetry install --with dev --no-root --no-interaction --no-ansi

      - name: Run events-api unit tests
        run: |
          cd scout/backend/events-api
          poetry run pytest tests/ -v

      # Dockerfile build verification is handled by the deploy-preview job
      # below — same Dockerfile, same failure mode, ~1 min later. No need
      # to build a throwaway :ci-verify image here.

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: scout/frontend/package-lock.json

      - name: Install frontend deps
        run: cd scout/frontend && npm ci

      - name: Lint frontend
        run: cd scout/frontend && npm run lint

      - name: Type-check frontend
        # Catches TS errors without invoking the bundler. The actual bundler
        # build runs in deploy-preview with PR-specific VITE_* env vars.
        run: cd scout/frontend && npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # Validate Terraform configuration for all scout environments.
  # ---------------------------------------------------------------------------
  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.62.0

      - name: Terraform fmt check
        run: terraform -chdir=scout/infra/envs/prod fmt -check -recursive ../../

      - name: Terraform validate (all scout envs)
        run: |
          for env in prod pr-preview pr; do
            terraform -chdir=scout/infra/envs/$env init -backend=false -input=false
            terraform -chdir=scout/infra/envs/$env validate
          done

      - name: tflint init
        run: tflint --init --config "$(pwd)/.tflint.hcl"

      - name: tflint
        run: tflint --recursive --chdir=scout/infra --config "$(pwd)/.tflint.hcl"

  # ---------------------------------------------------------------------------
  # Ensure the shared PR-preview infrastructure exists. This is an idempotent
  # Terraform apply of the scout pr-preview env (S3 bucket + CloudFront
  # at scout-pr.andreas.services + API Gateway custom domain at
  # scout-api-pr.andreas.services). Outputs are published to SSM under
  # /scout/pr-preview/*, which the per-PR deploy consumes.
  #
  # Concurrency: every PR job in this workflow queues behind the previous PR
  # via the scout-preview-pr-<N> group above, but parallel PRs can each hit
  # this job simultaneously. Terraform's S3 state locking serialises the
  # applies safely; on empty plans Terraform is a no-op.
  # ---------------------------------------------------------------------------
  deploy-preview-infra:
    name: Ensure shared PR preview infra
    needs: [lint-unit-build, validate-terraform]
    runs-on: ubuntu-latest
    environment: scout-pr
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init (pr-preview)
        run: terraform -chdir=scout/infra/envs/pr-preview init -input=false

      - name: Terraform apply (pr-preview)
        run: terraform -chdir=scout/infra/envs/pr-preview apply -auto-approve -input=false

      - name: Write pr-preview outputs to SSM
        run: |
          set -euo pipefail
          tf() { terraform -chdir=scout/infra/envs/pr-preview output -raw "$1"; }
          aws ssm put-parameter --overwrite --type String \
            --name /scout/pr-preview/s3-bucket  --value "$(tf s3_bucket_id)"
          aws ssm put-parameter --overwrite --type String \
            --name /scout/pr-preview/cf-dist-id --value "$(tf cloudfront_distribution_id)"
          aws ssm put-parameter --overwrite --type String \
            --name /scout/pr-preview/api-domain  --value "$(tf api_domain_name)"

  # ---------------------------------------------------------------------------
  # Deploy per-PR preview stack (only runs if validation + shared infra passed).
  #   - CloudFormation stack scout-pr-<N> (Lambda + API GW + DynamoDB + Cognito)
  #   - BasePathMapping attaching the PR's API to scout-api-pr.andreas.services
  #   - Frontend published into s3://<shared-preview-bucket>/<N>/app/ and served
  #     at scout-pr.andreas.services/<N>/app
  # ---------------------------------------------------------------------------
  deploy-preview:
    name: Deploy PR Preview
    needs: deploy-preview-infra
    runs-on: ubuntu-latest
    environment: scout-pr
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------------------
      # Build + push Docker images to ECR with pr-<N> tags
      # ------------------------------------------------------------------
      - name: Set ECR registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_ENV"

      - name: Ensure ECR repositories exist
        run: |
          for REPO in scout-events-api scout-renderer; do
            aws ecr describe-repositories --repository-names "${REPO}" \
              --region "${{ env.AWS_REGION }}" > /dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "${REPO}" \
              --region "${{ env.AWS_REGION }}" \
              --image-scanning-configuration scanOnPush=true \
              --tags Key=Project,Value=scout
          done

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push events-api
        run: |
          IMAGE="${ECR_REGISTRY}/scout-events-api"
          cd scout/backend/events-api
          docker build -t "${IMAGE}:pr-${{ env.PR_NUMBER }}" .
          docker push "${IMAGE}:pr-${{ env.PR_NUMBER }}"

      - name: Build & push renderer
        run: |
          IMAGE="${ECR_REGISTRY}/scout-renderer"
          cd scout/backend/renderer
          docker build -t "${IMAGE}:pr-${{ env.PR_NUMBER }}" .
          docker push "${IMAGE}:pr-${{ env.PR_NUMBER }}"

      # ------------------------------------------------------------------
      # Deploy per-PR Terraform stack
      # ------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init (pr)
        run: |
          terraform -chdir=scout/infra/envs/pr init -input=false \
            -backend-config="key=scout/pr/${{ env.PR_NUMBER }}/terraform.tfstate"

      - name: Terraform apply (pr)
        env:
          TF_VAR_pr_number:                  "${{ env.PR_NUMBER }}"
          TF_VAR_events_api_image_uri:       "${{ env.ECR_REGISTRY }}/scout-events-api:pr-${{ env.PR_NUMBER }}"
          TF_VAR_renderer_image_uri:         "${{ env.ECR_REGISTRY }}/scout-renderer:pr-${{ env.PR_NUMBER }}"
          TF_VAR_anthropic_api_key:          ${{ secrets.ANTHROPIC_API_KEY }}
        run: terraform -chdir=scout/infra/envs/pr apply -auto-approve -input=false

      - name: Read PR outputs
        id: outputs
        run: |
          set -euo pipefail
          tf() { terraform -chdir=scout/infra/envs/pr output -raw "$1"; }
          echo "api_url=$(tf api_endpoint)"          >> "$GITHUB_OUTPUT"
          echo "pool_id=$(tf user_pool_id)"          >> "$GITHUB_OUTPUT"
          echo "client_id=$(tf user_pool_client_id)" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$(tf frontend_url)"     >> "$GITHUB_OUTPUT"

      # Bootstrap the admin console login for this PR's fresh Cognito pool
      # (admin-create-user only — no self-signup). Mirrors prod's bootstrap-admin
      # job; idempotent and self-skipping when the secrets are unset.
      - name: Bootstrap admin user
        env:
          ADMIN_EMAIL:    ${{ secrets.SCOUT_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.SCOUT_ADMIN_PASSWORD }}
          USER_POOL_ID:   ${{ steps.outputs.outputs.pool_id }}
          AWS_REGION:     ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_EMAIL}" ] || [ -z "${ADMIN_PASSWORD}" ]; then
            echo "SCOUT_ADMIN_EMAIL / SCOUT_ADMIN_PASSWORD not set — skipping admin bootstrap."
            exit 0
          fi
          bash scout/scripts/create-admin-user.sh

      - name: Update Lambda env vars
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CLIENT_ID:     ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          # Same per-PR public API base used to build VITE_API_URL — lets the
          # Lambda emit absolute our-domain URLs that resolve under the PR's
          # subdomain + base path.
          SCOUT_PUBLIC_API_URL: ${{ steps.outputs.outputs.api_url }}
        run: |
          set -euo pipefail
          PR="${{ env.PR_NUMBER }}"
          SUFFIX="-pr-${PR}"
          PROCESSOR_FN="scout-source-run-processor${SUFFIX}"

          jq -n --arg suffix "${SUFFIX}" --arg fn "${PROCESSOR_FN}" --arg api_url "${SCOUT_PUBLIC_API_URL}" \
            '{Variables: {SCOUT_TABLE_SUFFIX: $suffix, SCOUT_PROCESSOR_FN: $fn, SCOUT_PUBLIC_API_URL: $api_url}}' \
            > /tmp/env-events-api.json

          jq -n --arg suffix "${SUFFIX}" --arg anthropic "${ANTHROPIC_API_KEY}" --arg pr "${PR}" \
            --arg client_id "${GMAIL_CLIENT_ID}" --arg client_secret "${GMAIL_CLIENT_SECRET}" \
            --arg refresh_token "${GMAIL_REFRESH_TOKEN}" \
            '{Variables: {
              SCOUT_TABLE_SUFFIX:     $suffix,
              SCOUT_ARTIFACTS_BUCKET: ("scout-artifacts-pr-" + $pr),
              SCOUT_IMAGES_BUCKET:    ("scout-images-pr-" + $pr),
              SCOUT_RENDERER_FN:      ("scout-source-renderer-pr-" + $pr),
              ANTHROPIC_API_KEY:      $anthropic,
              GMAIL_CLIENT_ID:        $client_id,
              GMAIL_CLIENT_SECRET:    $client_secret,
              GMAIL_REFRESH_TOKEN:    $refresh_token
            }}' > /tmp/env-processor.json

          jq -n --arg suffix "${SUFFIX}" --arg fn "${PROCESSOR_FN}" \
            '{Variables: {SCOUT_TABLE_SUFFIX: $suffix, SCOUT_PROCESSOR_FN: $fn}}' \
            > /tmp/env-scheduler.json

          jq -n --arg suffix "${SUFFIX}" \
            '{Variables: {SCOUT_TABLE_SUFFIX: $suffix}}' > /tmp/env-sweep.json

          set_env() {
            aws lambda update-function-configuration \
              --function-name "$1" --region "${{ env.AWS_REGION }}" \
              --environment "file://$2"
            aws lambda wait function-updated \
              --function-name "$1" --region "${{ env.AWS_REGION }}"
          }
          set_env "scout-events-api${SUFFIX}"           /tmp/env-events-api.json
          set_env "${PROCESSOR_FN}"                     /tmp/env-processor.json
          set_env "scout-scheduler${SUFFIX}"            /tmp/env-scheduler.json
          set_env "scout-sweep${SUFFIX}"                /tmp/env-sweep.json

      - name: Force Lambda to pick up the latest image
        run: |
          set -euo pipefail
          SUFFIX="-pr-${{ env.PR_NUMBER }}"
          update_code() {
            aws lambda update-function-code \
              --function-name "$1" --image-uri "$2" \
              --region "${{ env.AWS_REGION }}" \
              --output table --query '{FunctionName:FunctionName,CodeSize:CodeSize}'
            aws lambda wait function-updated \
              --function-name "$1" --region "${{ env.AWS_REGION }}"
          }
          EVENTS_IMAGE="${ECR_REGISTRY}/scout-events-api:pr-${{ env.PR_NUMBER }}"
          for NAME in scout-events-api scout-source-run-processor scout-scheduler scout-sweep; do
            update_code "${NAME}${SUFFIX}" "${EVENTS_IMAGE}"
          done
          RENDERER_IMAGE="${ECR_REGISTRY}/scout-renderer:pr-${{ env.PR_NUMBER }}"
          update_code "scout-source-renderer${SUFFIX}" "${RENDERER_IMAGE}"

      # ------------------------------------------------------------------
      # Build + publish the frontend under /<N>/app/
      # ------------------------------------------------------------------
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: scout/frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd scout/frontend && npm ci

      - name: Build frontend
        env:
          VITE_BASE: /${{ env.PR_NUMBER }}/app/
          VITE_API_URL: ${{ steps.outputs.outputs.api_url }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.outputs.outputs.pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.outputs.outputs.client_id }}
        run: cd scout/frontend && npm run build

      - name: Read shared preview bucket + distribution from SSM
        id: preview_infra
        run: |
          BUCKET=$(aws ssm get-parameter \
            --name /scout/pr-preview/s3-bucket \
            --query Parameter.Value --output text)
          DIST=$(aws ssm get-parameter \
            --name /scout/pr-preview/cf-dist-id \
            --query Parameter.Value --output text)
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "dist=${DIST}"     >> "$GITHUB_OUTPUT"

      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync scout/frontend/dist/ \
            "s3://${{ steps.preview_infra.outputs.bucket }}/${{ env.PR_NUMBER }}/app/" \
            --region "${{ env.AWS_REGION }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"

      - name: Sync HTML (no cache)
        run: |
          aws s3 sync scout/frontend/dist/ \
            "s3://${{ steps.preview_infra.outputs.bucket }}/${{ env.PR_NUMBER }}/app/" \
            --region "${{ env.AWS_REGION }}" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --include "*.html"

      - name: Invalidate CloudFront for this PR
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.preview_infra.outputs.dist }}" \
            --paths "/${{ env.PR_NUMBER }}/*"

      # ------------------------------------------------------------------
      # Integration tests against the freshly deployed PR API
      # ------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install --quiet poetry==2.2.1

      - name: Install integration test deps
        run: |
          cd scout/tests/integration
          poetry install --with dev --no-root --no-interaction --no-ansi

      - name: Run integration tests
        env:
          SCOUT_API_URL: ${{ steps.outputs.outputs.api_url }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          cd scout/tests/integration
          poetry run pytest . -v

      # ------------------------------------------------------------------
      # Comment the PR with the preview URLs
      # ------------------------------------------------------------------
      - name: Comment preview URLs on PR
        if: always() && steps.outputs.outputs.api_url != ''
        uses: actions/github-script@v7
        env:
          FRONTEND_URL: ${{ steps.outputs.outputs.frontend_url }}
          API_URL: ${{ steps.outputs.outputs.api_url }}
          POOL_ID: ${{ steps.outputs.outputs.pool_id }}
          CLIENT_ID: ${{ steps.outputs.outputs.client_id }}
        with:
          script: |
            const marker = '<!-- scout-pr-preview -->';
            const body = [
              marker,
              '### Scout PR preview',
              '',
              `- Frontend: ${process.env.FRONTEND_URL}`,
              `- API:      ${process.env.API_URL}`,
              '',
              '<details><summary>Cognito (fresh per-PR pool)</summary>',
              '',
              `- User Pool ID: \`${process.env.POOL_ID}\``,
              `- App Client ID: \`${process.env.CLIENT_ID}\``,
              '',
              '</details>',
              '',
              '_Environment is torn down automatically when the PR closes._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
