name: Scout · PR

# Combined PR workflow for scout. Validates only — lint, unit tests, frontend
# build and Terraform validate. It never writes to AWS.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scout/**'
      - '.github/workflows/scout-pr.yml'


env:
  AWS_REGION: us-east-1

jobs:
  # ---------------------------------------------------------------------------
  # Validate: lint + unit tests + type-check.
  # ---------------------------------------------------------------------------
  lint-unit-build:
    name: Lint, Unit Tests & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install --quiet poetry==2.2.1 poetry-plugin-export

      - name: Lint Python (ruff)
        run: |
          pip install --quiet ruff==0.15.8
          ruff check scout

      - name: Install events-api test deps
        run: |
          cd scout/backend
          poetry install --with dev --no-root --no-interaction --no-ansi

      - name: Run events-api unit tests
        run: |
          cd scout/backend
          poetry run pytest tests/ -v

      # Both images ship to Lambda, so both are worth proving compile here.
      # The renderer has its own Dockerfile and its own dependency set — a
      # Chromium base image that breaks independently of the events API.
      - name: Build events-api image (verify only)
        run: cd scout/backend && docker build -t scout-events-api:ci-verify .

      - name: Build renderer image (verify only)
        run: cd scout/backend/renderer && docker build -t scout-renderer:ci-verify .

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scout/frontend/package-lock.json

      - name: Install frontend deps
        run: cd scout/frontend && npm ci

      - name: Lint frontend
        run: cd scout/frontend && npm run lint

      - name: Type-check frontend
        # Fast fail on TS errors before paying for the bundler below.
        run: cd scout/frontend && npx tsc --noEmit

      - name: Build frontend
        # VITE_BASE matches the prod build: the SPA is served from /app/, and a
        # base mismatch produces asset URLs that 404 rather than a build error.
        env:
          VITE_BASE: /app/
        run: cd scout/frontend && npm run build

  # ---------------------------------------------------------------------------
  # Validate Terraform configuration for all scout environments.
  # ---------------------------------------------------------------------------
  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.63.1

      - name: Terraform fmt check
        run: terraform -chdir=scout/infra/envs/prod fmt -check -recursive ../../

      - name: Terraform validate (all scout envs)
        run: |
          for env in prod; do
            terraform -chdir=scout/infra/envs/$env init -backend=false -input=false
            terraform -chdir=scout/infra/envs/$env validate
          done

      - name: Install tflint AWS plugin
        run: bash .github/scripts/install-tflint-aws-plugin.sh

      - name: tflint
        run: tflint --recursive --chdir=scout/infra --config "$(pwd)/.tflint.hcl"

