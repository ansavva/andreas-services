name: Scout · PR

# Combined PR workflow for scout. Validates first (lint, unit tests, frontend
# build); then ensures the shared PR-preview infrastructure exists (idempotent
# CFN deploy); finally spins up the per-PR preview stack.
#
# DAG:
#   lint-unit-build ─► deploy-preview-infra ─► deploy-preview
#

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scout/**'
      - '.github/workflows/scout-pr.yml'


env:
  AWS_REGION: us-east-1
  STACK_NAME: scout-pr-${{ github.event.pull_request.number }}

jobs:
  # ---------------------------------------------------------------------------
  # Validate: lint + unit tests + frontend build. Gates the preview deploy.
  # ---------------------------------------------------------------------------
  lint-unit-build:
    name: Lint, Unit Tests & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install --quiet poetry==2.2.1 poetry-plugin-export

      - name: Lint Python (ruff)
        run: |
          pip install --quiet ruff==0.15.8
          ruff check scout

      - name: Install events-api test deps
        run: |
          cd scout/backend
          poetry install --with dev --no-root --no-interaction --no-ansi

      - name: Run events-api unit tests
        run: |
          cd scout/backend
          poetry run pytest tests/ -v

      # Dockerfile build verification is handled by the deploy-preview job
      # below — same Dockerfile, same failure mode, ~1 min later. No need
      # to build a throwaway :ci-verify image here.

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scout/frontend/package-lock.json

      - name: Install frontend deps
        run: cd scout/frontend && npm ci

      - name: Lint frontend
        run: cd scout/frontend && npm run lint

      - name: Type-check frontend
        # Catches TS errors without invoking the bundler. The actual bundler
        # build runs in deploy-preview with PR-specific VITE_* env vars.
        run: cd scout/frontend && npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # Validate Terraform configuration for all scout environments.
  # ---------------------------------------------------------------------------
  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.63.1

      - name: Terraform fmt check
        run: terraform -chdir=scout/infra/envs/prod fmt -check -recursive ../../

      - name: Terraform validate (all scout envs)
        run: |
          for env in prod; do
            terraform -chdir=scout/infra/envs/$env init -backend=false -input=false
            terraform -chdir=scout/infra/envs/$env validate
          done

      - name: Install tflint AWS plugin
        run: bash .github/scripts/install-tflint-aws-plugin.sh

      - name: tflint
        run: tflint --recursive --chdir=scout/infra --config "$(pwd)/.tflint.hcl"

  # ---------------------------------------------------------------------------
  # Ensure the shared PR-preview infrastructure exists. This is an idempotent
