name: Studio · Catalog seed · Prod

# ─────────────────────────────────────────────────────────────────────────────
# DELIBERATELY TEMPORARY. Delete this file — do not grow it.
#
# It exists for one job that happens once. `studio catalog plan|seed|verify`
# inventories the prod media bucket into the prod catalog table, and it needs
# AWS credentials for S3, DynamoDB and Cognito. The CI role already has all
# three via OIDC, so running it here needs no credential handling anywhere and,
# unlike a laptop, is not somewhere the person doing it has to be sitting.
#
# It also makes the run auditable: the plan, the seed's counts and the verify
# result land in a workflow log attached to a commit rather than scrolling past
# in a terminal nobody else ever sees.
#
# #354 tracks deleting it. Once #279 has run the seed against prod and #290's
# dev environment can seed itself from `dev-aws-seed.sh`, what is left here is a
# standing button that writes to the prod catalog — which is exactly the thing
# nobody should inherit by accident.
#
# TWO INDEPENDENT CHOICES GATE THE WRITE: `phase: seed` AND `apply: true`.
# `plan` and `verify` are read-only, and they are read-only structurally — the
# `--apply` flag is built in exactly one step, and that step only runs when the
# phase is `seed`. Setting `apply: true` on a `plan` or `verify` run therefore
# cannot reach the CLI at all. A `seed` without `apply` is a real
# dry run rather than a refusal, which is how `migrate-layout` and the seed
# command already behave.
#
# Each run journals independently: `local/migrations/` is git-ignored, so a
# fresh checkout starts empty and every dispatch writes its own journal file.
# That is why the log matters — a later phase does not append to an earlier
# phase's journal the way a local sequence of runs does.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run (plan and verify are read-only)'
        type: choice
        options: [plan, seed, verify]
        default: plan
      owner_email:
        description: 'Email of the library owner — resolved to a Cognito sub here'
        type: string
        required: true
      apply:
        description: 'Write to the catalog. Only has an effect when phase is seed.'
        type: boolean
        default: false

# Two seeds at once are the situation the derived uuid5 ids are meant to
# survive, not the situation they are meant to permit. Its own group rather
# than `studio-prod`: sharing one with the deploy would let a queued seed
# cancel a queued deploy, since GitHub keeps only one pending run per group.
concurrency:
  group: studio-prod-catalog-seed
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # Mirrors the `--library-name` default in `maintenance/catalog_seed.py`.
  # Passed explicitly so the value that was used is in the log rather than
  # implied by a default the log cannot see.
  LIBRARY_NAME: Studio

jobs:
  catalog:
    name: Catalog ${{ inputs.phase }}
    runs-on: ubuntu-latest
    environment: studio-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Same setup as studio-pr.yml's "Pipeline — lint + tests" job: the
      # pipeline is a uv project, and `uv sync` installs it editable, which is
      # what makes `STUDIO_DIR` resolve to this checkout and the journal land
      # under `studio/local/migrations/`.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync the pipeline environment
        run: uv sync --project studio/pipeline --frozen

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The bucket and the table both have defaults in the pipeline that are
      # already the prod values. Reading the bucket from SSM anyway means the
      # seed records the bucket Terraform actually made, not the one a stale
      # default names.
      - name: Read the target bucket from SSM
        run: |
          set -euo pipefail
          bucket=$(aws ssm get-parameter --name /studio/prod/media-bucket \
            --query Parameter.Value --output text)
          echo "STUDIO_S3_BUCKET=${bucket}" >> "$GITHUB_ENV"
          echo "bucket   ${bucket}"
          echo "table    studio-prod-catalog   (adapters/ddb.py's default)"

      # `username_attributes = ["email"]` means `Username` is a generated UUID
      # and is NOT the `sub`, so the attribute is read explicitly. A wrong sub
      # writes a membership row for an account that does not exist and nobody
      # can use, so zero matches and more than one match both fail here rather
      # than picking something.
      - name: Resolve the owner email to a Cognito sub
        env:
          OWNER_EMAIL: ${{ inputs.owner_email }}
        run: |
          set -euo pipefail
          if [ -z "${OWNER_EMAIL}" ]; then
            echo "::error::owner_email is empty"; exit 1
          fi

          pool=$(aws ssm get-parameter --name /studio/prod/cognito-user-pool-id \
            --query Parameter.Value --output text)
          echo "pool     ${pool}"

          # `=` is Cognito's exact-match operator (`^=` is the prefix one).
          users=$(aws cognito-idp list-users \
            --user-pool-id "${pool}" \
            --filter "email = \"${OWNER_EMAIL}\"" \
            --output json)
          count=$(jq '.Users | length' <<<"${users}")
          echo "matches  ${count}"

          if [ "${count}" -eq 0 ]; then
            echo "::error::no user in ${pool} has email ${OWNER_EMAIL}"; exit 1
          fi
          if [ "${count}" -gt 1 ]; then
            echo "::error::${count} users in ${pool} match ${OWNER_EMAIL} — refusing to guess"
            exit 1
          fi

          sub=$(jq -r '.Users[0].Attributes[] | select(.Name == "sub") | .Value' <<<"${users}")
          if [ -z "${sub}" ] || [ "${sub}" = "null" ]; then
            echo "::error::the matched user has no sub attribute"; exit 1
          fi

          # Masked before it is ever written anywhere, so every later mention of
          # it — including the seed command's own output — prints as ***.
          echo "::add-mask::${sub}"
          echo "OWNER_SUB=${sub}" >> "$GITHUB_ENV"
          echo "sub      resolved (masked)"

      - name: Announce the run
        env:
          PHASE: ${{ inputs.phase }}
          APPLY: ${{ inputs.apply }}
          OWNER_EMAIL: ${{ inputs.owner_email }}
        run: |
          set -euo pipefail
          echo "phase    ${PHASE}"
          echo "apply    ${APPLY}   (only honoured when phase is seed)"
          echo "owner    ${OWNER_EMAIL}"
          echo "library  ${LIBRARY_NAME}"

      # ── the three phases, one step each ──────────────────────────────────
      # Separate steps rather than a `case`, so "read-only" is visible in the
      # file: neither of the two below can pass a flag the branch does not
      # mention.

      - name: Plan (read-only)
        if: inputs.phase == 'plan'
        run: uv run --project studio/pipeline studio catalog plan

      - name: Seed
        if: inputs.phase == 'seed'
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          # The only `--apply` in this workflow, in the only step that can run
          # it. Unset, the command dry-runs and reports what it would create.
          flag=""
          if [ "${APPLY}" = "true" ]; then
            flag="--apply"
            echo "APPLY: this run WRITES to the catalog table."
          else
            echo "DRY RUN: nothing is written. Re-dispatch with apply: true to write."
          fi
          # shellcheck disable=SC2086
          uv run --project studio/pipeline studio catalog seed \
            --owner-sub "${OWNER_SUB}" \
            --library-name "${LIBRARY_NAME}" \
            ${flag}

      - name: Verify (read-only)
        if: inputs.phase == 'verify'
        run: uv run --project studio/pipeline studio catalog verify

      # The journal is the record of what the phase did. It is git-ignored and
      # the runner is thrown away, so printing it here is the only place it
      # survives.
      - name: Show the journal
        if: always()
        run: |
          set -euo pipefail
          dir=studio/local/migrations
          shopt -s nullglob
          files=("${dir}"/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no journal was written"
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "── ${file}"
            cat "${file}"
            echo
          done
