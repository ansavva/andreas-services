name: Humbugg · Deploy · Prod

# Combined prod deploy for humbugg.
#
# DAG (image is a prerequisite of Terraform Lambda creation, so build-and-push
# runs before deploy-infra to eliminate the chicken-and-egg of an empty ECR
# repo on first deploy):
#
#   detect-changes ─► build-and-push (always, when infra OR backend changes)
#                          │
#                          ▼
#                     deploy-infra (terraform apply)
#                          │
#                          ├─► update-lambda  (env vars + pin Lambda to :sha)
#                          └─► deploy-frontend

on:
  push:
    branches: [main]
    paths:
      - 'humbugg/**'
      - '.github/workflows/humbugg-prod.yaml'
  workflow_dispatch:
    inputs:
      run_infra:
        description: 'Run the deploy-infra job'
        type: boolean
        default: true
      run_app:
        description: 'Run update-lambda and deploy-frontend'
        type: boolean
        default: true
  workflow_run:
    workflows: ["Shared infra · Terraform apply · Prod"]
    types: [completed]
    branches: [main]

concurrency:
  group: humbugg-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPO: humbugg-backend-production
  LAMBDA_NAME: humbugg-backend-production

jobs:
  detect-changes:
    name: Detect Changes
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'humbugg/infra/**'
              - '.github/workflows/humbugg-prod.yaml'
            backend:
              - 'humbugg/backend/**'
              - '.github/workflows/humbugg-prod.yaml'
            frontend:
              - 'humbugg/frontend/**'
              - '.github/workflows/humbugg-prod.yaml'

  # ---------------------------------------------------------------------------
  # Build Docker image and push to ECR. Runs BEFORE deploy-infra so the
  # Lambda image_uri it references always exists.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Image
    needs: detect-changes
    if: |
      !cancelled()
      && (
        (github.event_name == 'push'
         && (needs.detect-changes.outputs.infra == 'true'
             || needs.detect-changes.outputs.backend == 'true'))
        || (github.event_name == 'workflow_dispatch'
            && (inputs.run_infra || inputs.run_app))
        || github.event_name == 'workflow_run'
      )
    runs-on: ubuntu-latest
    environment: humbugg-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_URL=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${ECR_REPO}" >> "$GITHUB_ENV"

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${ECR_REPO}" \
            --region "${{ env.AWS_REGION }}" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "${ECR_REPO}" \
            --region "${{ env.AWS_REGION }}" \
            --image-scanning-configuration scanOnPush=true \
            --tags Key=Project,Value=humbugg

      - name: Build & push backend
        run: |
          cd humbugg/backend
          DOCKER_BUILDKIT=0 docker build \
            -t "${ECR_URL}:${{ github.sha }}" \
            -t "${ECR_URL}:latest" .
          docker push "${ECR_URL}:${{ github.sha }}"
          docker push "${ECR_URL}:latest"

  # ---------------------------------------------------------------------------
  # Apply Terraform and publish the resolved IDs into SSM for the app jobs.
  # ---------------------------------------------------------------------------
  deploy-infra:
    name: Terraform Apply
    needs: [detect-changes, build-and-push]
    if: |
      !cancelled()
      && needs.build-and-push.result != 'failure'
      && (
        (github.event_name == 'push' && needs.detect-changes.outputs.infra == 'true')
        || (github.event_name == 'workflow_dispatch' && inputs.run_infra)
        || github.event_name == 'workflow_run'
      )
    runs-on: ubuntu-latest
    environment: humbugg-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=humbugg/infra/envs/prod init -input=false

      - name: Terraform apply
        run: terraform -chdir=humbugg/infra/envs/prod apply -auto-approve -input=false

      - name: Write outputs to SSM
        run: |
          set -euo pipefail
          tf() { terraform -chdir=humbugg/infra/envs/prod output -raw "$1"; }
          put() { aws ssm put-parameter --overwrite --type String \
            --name "/humbugg/prod/${1}" --value "${2}"; }
          put api-url              "$(tf api_endpoint)"
          put lambda-name          "$(tf lambda_function_name)"
          put ecr-url              "$(tf ecr_repository_url)"
          put cognito-user-pool-id "$(tf cognito_user_pool_id)"
          put cognito-client-id    "$(tf cognito_client_id)"
          put s3-bucket            "$(tf s3_frontend_bucket)"
          put cf-dist-id           "$(tf cloudfront_distribution_id)"

  # ---------------------------------------------------------------------------
  # Update Lambda env vars and pin function code to :sha.
  # No Docker work — build-and-push has already pushed both :latest and :sha.
  # ---------------------------------------------------------------------------
  update-lambda:
    name: Update Lambda Function
    needs: [detect-changes, build-and-push, deploy-infra]
    if: |
      !cancelled()
      && needs.build-and-push.result == 'success'
      && needs.deploy-infra.result != 'failure'
      && (
        (github.event_name == 'workflow_dispatch' && inputs.run_app)
        || (github.event_name == 'push'
            && (needs.detect-changes.outputs.backend == 'true'
                || needs.deploy-infra.result == 'success'))
        || (github.event_name == 'workflow_run'
            && needs.deploy-infra.result == 'success')
      )
    runs-on: ubuntu-latest
    environment: humbugg-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read infrastructure values from SSM
        run: |
          get() { aws ssm get-parameter --name "/humbugg/prod/${1}" \
            --query Parameter.Value --output text; }
          echo "ECR_URL=$(get ecr-url)"                             >> "$GITHUB_ENV"
          echo "COGNITO_USER_POOL_ID=$(get cognito-user-pool-id)"   >> "$GITHUB_ENV"
          echo "COGNITO_CLIENT_ID=$(get cognito-client-id)"         >> "$GITHUB_ENV"

      - name: Update Lambda env vars + code
        run: |
          set -euo pipefail
          jq -n \
            --arg cors_origin "https://humbugg.andreas.services" \
            --arg cognito_region "${{ env.AWS_REGION }}" \
            --arg cognito_pool_id "${COGNITO_USER_POOL_ID}" \
            --arg cognito_client_id "${COGNITO_CLIENT_ID}" \
            --arg profiles_table "humbugg-profiles" \
            --arg groups_table "humbugg-groups" \
            --arg groupmembers_table "humbugg-groupmembers" \
            '{Variables: {
              CORS_ORIGIN: $cors_origin,
              COGNITO_REGION: $cognito_region,
              COGNITO_USER_POOL_ID: $cognito_pool_id,
              COGNITO_CLIENT_ID: $cognito_client_id,
              HUMBUGG_PROFILES_TABLE: $profiles_table,
              HUMBUGG_GROUPS_TABLE: $groups_table,
              HUMBUGG_GROUPMEMBERS_TABLE: $groupmembers_table
            }}' > /tmp/env-humbugg.json

          aws lambda update-function-configuration \
            --function-name "${LAMBDA_NAME}" \
            --region "${{ env.AWS_REGION }}" \
            --environment file:///tmp/env-humbugg.json

          aws lambda wait function-updated \
            --function-name "${LAMBDA_NAME}" \
            --region "${{ env.AWS_REGION }}"

          aws lambda update-function-code \
            --function-name "${LAMBDA_NAME}" \
            --image-uri "${ECR_URL}:${{ github.sha }}" \
            --region "${{ env.AWS_REGION }}" \
            --output table \
            --query '{FunctionName:FunctionName,CodeSize:CodeSize}'

  # ---------------------------------------------------------------------------
  # Build Vite SPA and sync to S3 + CloudFront
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend
    needs: [detect-changes, deploy-infra]
    if: |
      !cancelled()
      && needs.deploy-infra.result != 'failure'
      && ((github.event_name == 'workflow_dispatch' && inputs.run_app)
          || (github.event_name == 'push'
              && (needs.detect-changes.outputs.frontend == 'true'
                  || needs.deploy-infra.result == 'success'))
          || (github.event_name == 'workflow_run'
              && needs.deploy-infra.result == 'success'))
    runs-on: ubuntu-latest
    environment: humbugg-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read infrastructure values from SSM
        run: |
          get() { aws ssm get-parameter --name "/humbugg/prod/${1}" \
            --query Parameter.Value --output text; }

          echo "VITE_API_URL=$(get api-url)"                              >> "$GITHUB_ENV"
          echo "VITE_COGNITO_USER_POOL_ID=$(get cognito-user-pool-id)"   >> "$GITHUB_ENV"
          echo "VITE_COGNITO_CLIENT_ID=$(get cognito-client-id)"         >> "$GITHUB_ENV"
          echo "S3_BUCKET=$(get s3-bucket)"                              >> "$GITHUB_ENV"
          echo "CF_DIST_ID=$(get cf-dist-id)"                            >> "$GITHUB_ENV"

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: humbugg/frontend/package-lock.json

      - name: Install dependencies
        run: cd humbugg/frontend && npm ci --legacy-peer-deps

      - name: Build frontend
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ env.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ env.VITE_COGNITO_CLIENT_ID }}
          VITE_AWS_REGION: us-east-1
        run: cd humbugg/frontend && npm run build

      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync humbugg/frontend/dist/ "s3://${S3_BUCKET}/app/" \
            --region "${{ env.AWS_REGION }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"

      - name: Sync HTML (no cache)
        run: |
          aws s3 sync humbugg/frontend/dist/ "s3://${S3_BUCKET}/app/" \
            --region "${{ env.AWS_REGION }}" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --include "*.html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DIST_ID}" \
            --paths "/*"
