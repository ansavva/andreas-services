name: Humbugg · Deploy · Prod

# Combined prod deploy for humbugg.
#
# DAG (image is a prerequisite of Terraform Lambda creation, so build-and-push
# runs before deploy-infra to eliminate the chicken-and-egg of an empty ECR
# repo on first deploy):
#
#   detect-changes ─► build-and-push (backend + SSR marketing images and assets)
#                          │
#                          ▼
#                     deploy-infra (terraform apply)
#                          │
#                          ├─► update-lambda           (env vars + pin both Lambdas to :sha)
#                          ├─► deploy-frontend-assets  (marketing hashed assets → S3)
#                          └─► deploy-app              (Expo web export → S3, built here)
#
# Three surfaces come out of this: www.humbugg.com (marketing SSR),
# app.humbugg.com (Expo static export) and api.humbugg.com (backend Lambda).
# The Expo export is built in deploy-app rather than build-and-push because Metro
# inlines EXPO_PUBLIC_* at build time and those values come from the apply.

on:
  push:
    branches: [main]
    paths:
      - 'humbugg/**'
      - '.github/workflows/humbugg-prod.yaml'
  workflow_dispatch:
    inputs:
      run_infra:
        description: 'Run the deploy-infra job'
        type: boolean
        default: true
      run_app:
        description: 'Run update-lambda, deploy-frontend-assets and deploy-app'
        type: boolean
        default: true
  workflow_run:
    workflows: ["Shared infra · Terraform apply · Prod"]
    types: [completed]
    branches: [main]

concurrency:
  group: humbugg-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  API_ECR_REPO: humbugg-prod-api
  MARKETING_ECR_REPO: humbugg-prod-marketing
  API_LAMBDA_NAME: humbugg-prod-api
  EMAIL_STATUS_LAMBDA_NAME: humbugg-prod-email-status
  MARKETING_LAMBDA_NAME: humbugg-prod-marketing

jobs:
  detect-changes:
    name: Detect Changes
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      app: ${{ steps.filter.outputs.app }}
      shared_infra: ${{ steps.filter.outputs.shared_infra }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            infra:
              - 'humbugg/infra/**'
              - '.github/workflows/humbugg-prod.yaml'
            backend:
              - 'humbugg/backend/**'
              - '.github/workflows/humbugg-prod.yaml'
            web:
              - 'humbugg/marketing/**'
              - '.github/workflows/humbugg-prod.yaml'
            app:
              - 'humbugg/app/**'
              - '.github/workflows/humbugg-prod.yaml'
            shared_infra:
              - 'infra/**'

  # ---------------------------------------------------------------------------
  # Build both Lambda images and the matching client asset bundle before
  # Terraform so first-time Lambda creation always has an image available.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Images
    needs: detect-changes
    if: |
      !cancelled()
      && (
        (github.event_name == 'push'
         && needs.detect-changes.outputs.shared_infra != 'true'
         && (needs.detect-changes.outputs.infra == 'true'
             || needs.detect-changes.outputs.backend == 'true'
             || needs.detect-changes.outputs.web == 'true'
             || needs.detect-changes.outputs.app == 'true'))
        || (github.event_name == 'workflow_dispatch'
            && (inputs.run_infra || inputs.run_app))
        || github.event_name == 'workflow_run'
      )
    runs-on: ubuntu-latest
    environment: humbugg-production
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ansavva'
          cache: npm
          cache-dependency-path: |
            humbugg/marketing/package-lock.json
            humbugg/app/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_ENV"

      - name: Ensure ECR repositories exist
        run: |
          for REPO in "${API_ECR_REPO}" "${MARKETING_ECR_REPO}"; do
            aws ecr describe-repositories --repository-names "${REPO}" \
              --region "${{ env.AWS_REGION }}" >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "${REPO}" \
              --region "${{ env.AWS_REGION }}" \
              --image-scanning-configuration scanOnPush=true \
              --tags Key=Project,Value=humbugg
          done

      - name: Build & push backend
        run: |
          IMAGE="${ECR_REGISTRY}/${API_ECR_REPO}"
          cd humbugg/backend
          DOCKER_BUILDKIT=0 docker build \
            -t "${IMAGE}:${{ github.sha }}" \
            -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Install marketing site dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd humbugg/marketing && npm ci

      - name: Build marketing SSR and client assets
        env:
          VITE_APP_BASE_URL: https://www.humbugg.com
          VITE_APP_ORIGIN: https://app.humbugg.com
        run: cd humbugg/marketing && npm run build

      - name: Build & push SSR marketing site
        run: |
          IMAGE="${ECR_REGISTRY}/${MARKETING_ECR_REPO}"
          cd humbugg/marketing
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Upload client assets
        uses: actions/upload-artifact@v7
        with:
          name: humbugg-frontend-client
          path: humbugg/marketing/build/client
          retention-days: 1


  # ---------------------------------------------------------------------------
  # Apply Terraform and publish the resolved IDs into SSM for the app jobs.
  # ---------------------------------------------------------------------------
  deploy-infra:
    name: Terraform Apply
    needs: [detect-changes, build-and-push]
    if: |
      !cancelled()
      && needs.build-and-push.result != 'failure'
      && (
        (github.event_name == 'push'
         && needs.detect-changes.outputs.shared_infra != 'true'
         && needs.detect-changes.outputs.infra == 'true')
        || (github.event_name == 'workflow_dispatch' && inputs.run_infra)
        || github.event_name == 'workflow_run'
      )
    runs-on: ubuntu-latest
    environment: humbugg-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=humbugg/infra/envs/prod init -input=false

      # build-and-push runs first so the image exists before Terraform creates the
      # Lambda, and it creates the ECR repositories itself if they are missing.
      # On a fresh state file that leaves Terraform trying to create repositories
      # that already exist, which fails the apply with RepositoryAlreadyExists.
      # Adopt them instead. A no-op once they are in state, which is every run
      # after the first.
      - name: Adopt bootstrap-created ECR repositories
        run: |
          set -euo pipefail
          adopt() {
            local addr="$1" repo="$2"
            if terraform -chdir=humbugg/infra/envs/prod state show "$addr" >/dev/null 2>&1; then
              echo "already in state: $addr"; return
            fi
            if ! aws ecr describe-repositories --repository-names "$repo" \
                 --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
              echo "not in AWS, Terraform will create it: $repo"; return
            fi
            echo "importing $repo -> $addr"
            terraform -chdir=humbugg/infra/envs/prod import -input=false "$addr" "$repo"
          }
          adopt module.compute.aws_ecr_repository.api "${API_ECR_REPO}"
          adopt module.compute.aws_ecr_repository.marketing "${MARKETING_ECR_REPO}"

      - name: Terraform apply
        env:
          # Stripe test-mode credentials from the humbugg-production environment.
          # Empty until the Stripe test account is provisioned (issue #123); the
          # billing module skips uncreated parameters. Live-mode is blocked (#159).
          TF_VAR_stripe_publishable_key: ${{ vars.HUMBUGG_STRIPE_PUBLISHABLE_KEY }}
          TF_VAR_stripe_secret_key: ${{ secrets.HUMBUGG_STRIPE_SECRET_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.HUMBUGG_STRIPE_WEBHOOK_SECRET }}
        run: terraform -chdir=humbugg/infra/envs/prod apply -auto-approve -input=false

      - name: Wait for SES domain authentication
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            read -r verification dkim mail_from < <(aws sesv2 get-email-identity \
              --region "${{ env.AWS_REGION }}" \
              --email-identity humbugg.com \
              --query '[VerificationStatus,DkimAttributes.Status,MailFromAttributes.MailFromDomainStatus]' \
              --output text)
            echo "SES status: identity=${verification} dkim=${dkim} mail-from=${mail_from}"
            if [[ "$verification" == "SUCCESS" && "$dkim" == "SUCCESS" && "$mail_from" == "SUCCESS" ]]; then
              exit 0
            fi
            sleep 10
          done
          aws sesv2 get-email-identity --region "${{ env.AWS_REGION }}" --email-identity humbugg.com
          exit 1

      - name: Write outputs to SSM
        run: |
          set -euo pipefail
          tf() { terraform -chdir=humbugg/infra/envs/prod output -raw "$1"; }
          put() { aws ssm put-parameter --overwrite --type String \
            --name "/humbugg/prod/${1}" --value "${2}"; }
          put api-url              "$(tf api_endpoint)"
          put lambda-name          "$(tf lambda_function_name)"
          put ecr-url              "$(tf ecr_repository_url)"
          put marketing-lambda-name "$(tf marketing_lambda_function_name)"
          put marketing-ecr-url    "$(tf marketing_ecr_repository_url)"
          put cognito-user-pool-id "$(tf cognito_user_pool_id)"
          put cognito-client-id    "$(tf cognito_client_id)"
          put s3-bucket            "$(tf marketing_bucket)"
          put cf-dist-id           "$(tf cloudfront_distribution_id)"
          put app-s3-bucket        "$(tf app_bucket)"
          put app-cf-dist-id       "$(tf app_cloudfront_distribution_id)"
          put email-from-address   "$(tf email_from_address)"

  # ---------------------------------------------------------------------------
  # Update Lambda env vars and pin function code to :sha.
  # No Docker work — build-and-push has already pushed both :latest and :sha.
  # ---------------------------------------------------------------------------
  update-lambda:
    name: Update Lambda Functions
    needs: [detect-changes, build-and-push, deploy-infra]
    if: |
      !cancelled()
      && needs.build-and-push.result == 'success'
      && needs.deploy-infra.result != 'failure'
      && (
        (github.event_name == 'workflow_dispatch' && inputs.run_app)
        || github.event_name == 'push'
        || (github.event_name == 'workflow_run'
            && needs.deploy-infra.result == 'success')
      )
    runs-on: ubuntu-latest
    environment: humbugg-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read infrastructure values from SSM
        run: |
          # Assign, check, then export. `echo "X=$(get …)" >> "$GITHUB_ENV"`
          # took its exit status from `echo`, not from the substitution, so a
          # failed or renamed parameter wrote an EMPTY STRING and the step went
          # green under `bash -e`. An assignment carries the substitution's
          # status, and `exit` inside a function called at top level ends the
          # job rather than a subshell.
          #
          # `None` is what `--output text` prints for a null value, so it is an
          # empty read wearing a name.
          put() {
            local value
            value="$(aws ssm get-parameter --name "$2" \
              --query Parameter.Value --output text)" || exit 1
            [ -n "$value" ] && [ "$value" != "None" ] ||
              { echo "::error::$2 resolved empty; refusing to continue." >&2; exit 1; }
            echo "$1=$value" >> "$GITHUB_ENV"
          }

          put API_ECR_URL             /humbugg/prod/ecr-url
          put MARKETING_ECR_URL       /humbugg/prod/marketing-ecr-url
          put COGNITO_USER_POOL_ID    /humbugg/prod/cognito-user-pool-id
          put COGNITO_CLIENT_ID       /humbugg/prod/cognito-client-id
          put HUMBUGG_MAILER_BASE_URL /mailer/prod/humbugg/api-url
          # EMAIL_STATUS_LAMBDA_NAME is not read from SSM: the name is deterministic
          # (humbugg-prod-email-status) and already set as a job-level env default,
          # matching BACKEND/FRONTEND. Reading a missing SSM param here silently produced an
          # empty --function-name and broke the deploy.

      - name: Update Lambda env vars + code
        run: |
          set -euo pipefail
          jq -n \
            --arg cors_origins "https://www.humbugg.com,https://app.humbugg.com" \
            --arg cognito_region "${{ env.AWS_REGION }}" \
            --arg cognito_pool_id "${COGNITO_USER_POOL_ID}" \
            --arg cognito_client_id "${COGNITO_CLIENT_ID}" \
            --arg profiles_table "humbugg-prod-profiles" \
            --arg groups_table "humbugg-prod-groups" \
            --arg invitations_table "humbugg-prod-invitations" \
            --arg groupmembers_table "humbugg-prod-groupmembers" \
            --arg wishes_table "humbugg-prod-wishes" \
            --arg draws_table "humbugg-prod-draws" \
            --arg audit_events_table "humbugg-prod-audit-events" \
            --arg analytics_events_table "humbugg-prod-analytics-events" \
            --arg billing_table "humbugg-prod-billing" \
            --arg analytics_enabled "${{ vars.HUMBUGG_ANALYTICS_ENABLED || 'true' }}" \
            --arg email_messages_table "humbugg-prod-email-messages" \
            --arg app_bucket "humbugg-prod-app-files-us-east-1" \
            --arg app_base_url "https://app.humbugg.com" \
            --arg mailer_base_url "${HUMBUGG_MAILER_BASE_URL}" \
            --arg free_participant_limit "${{ vars.HUMBUGG_FREE_PARTICIPANT_LIMIT || '6' }}" \
            --arg plus_participant_limit "${{ vars.HUMBUGG_PLUS_PARTICIPANT_LIMIT || '50' }}" \
            --arg work_participant_limit "${{ vars.HUMBUGG_WORK_PARTICIPANT_LIMIT || '10000' }}" \
            --arg plus_price_cents "${{ vars.HUMBUGG_PLUS_PRICE_CENTS || '1200' }}" \
            --arg work_price_cents "${{ vars.HUMBUGG_WORK_PRICE_CENTS || '9900' }}" \
            --arg plus_product_id "${{ vars.HUMBUGG_PLUS_PRODUCT_ID }}" \
            --arg plus_price_id "${{ vars.HUMBUGG_PLUS_PRICE_ID }}" \
            --arg work_product_id "${{ vars.HUMBUGG_WORK_PRODUCT_ID }}" \
            --arg work_price_id "${{ vars.HUMBUGG_WORK_PRICE_ID }}" \
            --arg stripe_mode "${{ vars.HUMBUGG_STRIPE_MODE || 'disabled' }}" \
            --arg stripe_publishable_key "${{ vars.HUMBUGG_STRIPE_PUBLISHABLE_KEY }}" \
            --arg stripe_secret_key "${{ secrets.HUMBUGG_STRIPE_SECRET_KEY }}" \
            --arg stripe_webhook_secret "${{ secrets.HUMBUGG_STRIPE_WEBHOOK_SECRET }}" \
            '{Variables: {
              CORS_ORIGINS: $cors_origins,
              COGNITO_REGION: $cognito_region,
              COGNITO_USER_POOL_ID: $cognito_pool_id,
              COGNITO_CLIENT_ID: $cognito_client_id,
              HUMBUGG_PROFILES_TABLE: $profiles_table,
              HUMBUGG_GROUPS_TABLE: $groups_table,
              HUMBUGG_INVITATIONS_TABLE: $invitations_table,
              HUMBUGG_GROUPMEMBERS_TABLE: $groupmembers_table,
              HUMBUGG_WISHES_TABLE: $wishes_table,
              HUMBUGG_DRAWS_TABLE: $draws_table,
              HUMBUGG_AUDIT_EVENTS_TABLE: $audit_events_table,
              HUMBUGG_ANALYTICS_EVENTS_TABLE: $analytics_events_table,
              HUMBUGG_BILLING_TABLE: $billing_table,
              HUMBUGG_ANALYTICS_ENABLED: $analytics_enabled,
              HUMBUGG_EMAIL_MESSAGES_TABLE: $email_messages_table,
              HUMBUGG_APP_BUCKET: $app_bucket,
              HUMBUGG_EMAIL_PROVIDER: "mailer",
              HUMBUGG_MAILER_BASE_URL: $mailer_base_url,
              HUMBUGG_MAILER_AUTH_MODE: "sigv4",
              HUMBUGG_MAILER_SERVICE_ID: "humbugg",
              APP_BASE_URL: $app_base_url,
              HUMBUGG_FREE_PARTICIPANT_LIMIT: $free_participant_limit,
              HUMBUGG_PLUS_PARTICIPANT_LIMIT: $plus_participant_limit,
              HUMBUGG_WORK_PARTICIPANT_LIMIT: $work_participant_limit,
              HUMBUGG_PLUS_PRICE_CENTS: $plus_price_cents,
              HUMBUGG_WORK_PRICE_CENTS: $work_price_cents,
              HUMBUGG_PLUS_PRODUCT_ID: $plus_product_id,
              HUMBUGG_PLUS_PRICE_ID: $plus_price_id,
              HUMBUGG_WORK_PRODUCT_ID: $work_product_id,
              HUMBUGG_WORK_PRICE_ID: $work_price_id,
              HUMBUGG_STRIPE_MODE: $stripe_mode,
              HUMBUGG_STRIPE_PUBLISHABLE_KEY: $stripe_publishable_key,
              HUMBUGG_STRIPE_SECRET_KEY: $stripe_secret_key,
              HUMBUGG_STRIPE_WEBHOOK_SECRET: $stripe_webhook_secret,
              HUMBUGG_ENVIRONMENT: "production"
            }}' > /tmp/env-humbugg-backend.json

          jq -n \
            --arg email_messages_table "humbugg-prod-email-messages" \
            '{Variables: {
              HUMBUGG_CONSUMER: "email-status",
              HUMBUGG_EMAIL_MESSAGES_TABLE: $email_messages_table
            }}' > /tmp/env-humbugg-email-status.json

          # The marketing SSR Lambda no longer authenticates anyone — sign-in moved
          # to the product app — so the Cognito variables it used to receive are
          # gone. Its canonical origin is baked in at build time via
          # VITE_APP_BASE_URL; nothing in the server bundle reads process.env.
          jq -n \
            '{Variables: {
              NODE_ENV: "production"
            }}' > /tmp/env-humbugg-frontend.json

          aws lambda update-function-configuration \
            --function-name "${API_LAMBDA_NAME}" \
            --region "${{ env.AWS_REGION }}" \
            --environment file:///tmp/env-humbugg-backend.json

          aws lambda wait function-updated \
            --function-name "${API_LAMBDA_NAME}" \
            --region "${{ env.AWS_REGION }}"

          aws lambda update-function-configuration \
            --function-name "${EMAIL_STATUS_LAMBDA_NAME}" \
            --region "${{ env.AWS_REGION }}" \
            --environment file:///tmp/env-humbugg-email-status.json

          aws lambda wait function-updated \
            --function-name "${EMAIL_STATUS_LAMBDA_NAME}" \
            --region "${{ env.AWS_REGION }}"

          aws lambda update-function-configuration \
            --function-name "${MARKETING_LAMBDA_NAME}" \
            --region "${{ env.AWS_REGION }}" \
            --environment file:///tmp/env-humbugg-frontend.json

          aws lambda wait function-updated \
            --function-name "${MARKETING_LAMBDA_NAME}" \
            --region "${{ env.AWS_REGION }}"

          aws lambda update-function-code \
            --function-name "${API_LAMBDA_NAME}" \
            --image-uri "${API_ECR_URL}:${{ github.sha }}" \
            --region "${{ env.AWS_REGION }}" \
            --output table \
            --query '{FunctionName:FunctionName,CodeSize:CodeSize}'

          aws lambda wait function-updated \
            --function-name "${API_LAMBDA_NAME}" \
            --region "${{ env.AWS_REGION }}"

          aws lambda update-function-code \
            --function-name "${EMAIL_STATUS_LAMBDA_NAME}" \
            --image-uri "${API_ECR_URL}:${{ github.sha }}" \
            --region "${{ env.AWS_REGION }}" \
            --output table \
            --query '{FunctionName:FunctionName,CodeSize:CodeSize}'

          aws lambda wait function-updated \
            --function-name "${EMAIL_STATUS_LAMBDA_NAME}" \
            --region "${{ env.AWS_REGION }}"

          aws lambda update-function-code \
            --function-name "${MARKETING_LAMBDA_NAME}" \
            --image-uri "${MARKETING_ECR_URL}:${{ github.sha }}" \
            --region "${{ env.AWS_REGION }}" \
            --output table \
            --query '{FunctionName:FunctionName,CodeSize:CodeSize}'

          aws lambda wait function-updated \
            --function-name "${MARKETING_LAMBDA_NAME}" \
            --region "${{ env.AWS_REGION }}"

  # ---------------------------------------------------------------------------
  # Sync the client bundle built alongside the SSR image to S3.
  # ---------------------------------------------------------------------------
  deploy-frontend-assets:
    name: Deploy Frontend Assets
    needs: [detect-changes, build-and-push, deploy-infra]
    if: |
      !cancelled()
      && needs.build-and-push.result == 'success'
      && needs.deploy-infra.result != 'failure'
      && ((github.event_name == 'workflow_dispatch' && inputs.run_app)
          || (github.event_name == 'push'
              && (needs.detect-changes.outputs.web == 'true'
                  || needs.deploy-infra.result == 'success'))
          || (github.event_name == 'workflow_run'
              && needs.deploy-infra.result == 'success'))
    runs-on: ubuntu-latest
    environment: humbugg-production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download client assets
        uses: actions/download-artifact@v4
        with:
          name: humbugg-frontend-client
          path: build/client

      - name: Read infrastructure values from SSM
        run: |
          # `put` rather than `echo "X=$(get …)"`, which took its exit status
          # from `echo` and shipped an empty value on a failed read.
          put() {
            local value
            value="$(aws ssm get-parameter --name "$2" \
              --query Parameter.Value --output text)" || exit 1
            [ -n "$value" ] && [ "$value" != "None" ] ||
              { echo "::error::$2 resolved empty; refusing to continue." >&2; exit 1; }
            echo "$1=$value" >> "$GITHUB_ENV"
          }

          put S3_BUCKET  /humbugg/prod/s3-bucket
          put CF_DIST_ID /humbugg/prod/cf-dist-id

      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync build/client/ "s3://${S3_BUCKET}/" \
            --region "${{ env.AWS_REGION }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DIST_ID}" \
            --paths "/*"

  # ---------------------------------------------------------------------------
  # Publish the product app's static export to its own bucket + distribution.
  # Peer of deploy-frontend-assets: neither depends on the other.
  # ---------------------------------------------------------------------------
  deploy-app:
    name: Deploy Product App
    needs: [detect-changes, build-and-push, deploy-infra]
    if: |
      !cancelled()
      && needs.build-and-push.result == 'success'
      && needs.deploy-infra.result != 'failure'
      && ((github.event_name == 'workflow_dispatch' && inputs.run_app)
          || (github.event_name == 'push'
              && (needs.detect-changes.outputs.app == 'true'
                  || needs.deploy-infra.result == 'success'))
          || (github.event_name == 'workflow_run'
              && needs.deploy-infra.result == 'success'))
    runs-on: ubuntu-latest
    environment: humbugg-production
    permissions:
      id-token: write
      contents: read
      # npm ci pulls @ansavva/* from GitHub Packages. Declaring any permissions
      # block drops the default packages: read, so it has to be listed here.
      packages: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ansavva'
          cache: npm
          cache-dependency-path: humbugg/app/package-lock.json

      - name: Read infrastructure values from SSM
        run: |
          # `put` rather than `echo "X=$(get …)"`, which took its exit status
          # from `echo` and shipped an empty value on a failed read.
          put() {
            local value
            value="$(aws ssm get-parameter --name "$2" \
              --query Parameter.Value --output text)" || exit 1
            [ -n "$value" ] && [ "$value" != "None" ] ||
              { echo "::error::$2 resolved empty; refusing to continue." >&2; exit 1; }
            echo "$1=$value" >> "$GITHUB_ENV"
          }

          put APP_S3_BUCKET                    /humbugg/prod/app-s3-bucket
          put APP_CF_DIST_ID                   /humbugg/prod/app-cf-dist-id
          # Metro inlines these; empty ships an app that cannot sign anyone in.
          put EXPO_PUBLIC_COGNITO_USER_POOL_ID /humbugg/prod/cognito-user-pool-id
          put EXPO_PUBLIC_COGNITO_CLIENT_ID    /humbugg/prod/cognito-client-id

      - name: Install product app dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd humbugg/app && npm ci

      # Metro inlines EXPO_PUBLIC_* at build time, so the export must be built
      # AFTER deploy-infra with the values that apply produced. The build-first
      # ordering elsewhere in this workflow exists only because Terraform cannot
      # create a Lambda without an image already in ECR; a static export has no
      # such constraint, and building it early would bake in stale Cognito IDs.
      - name: Export product app for web
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.humbugg.com
          EXPO_PUBLIC_AWS_REGION: ${{ env.AWS_REGION }}
        run: cd humbugg/app && npx expo export -p web --source-maps

      - name: Assert the app build took the native leaf
        run: node humbugg/scripts/assert-design-system-leaves.mjs native humbugg/app/dist

      # The maps exist only so the assertion above can read them. Publishing them
      # would put the app's readable source on a public origin, so they go before
      # anything is synced.
      - name: Strip source maps before publishing
        run: find humbugg/app/dist -name '*.map' -delete

      # Two passes, because the export mixes lifetimes in one tree. The hashed
      # bundles are immutable; index.html must never be cached or a returning
      # visitor is pinned to a bundle that no longer exists. --delete goes on the
      # first pass only, so the second cannot remove what the first just wrote.
      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync humbugg/app/dist/ "s3://${APP_S3_BUCKET}/" \
            --region "${{ env.AWS_REGION }}" \
            --delete \
            --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Sync HTML (no cache)
        run: |
          aws s3 sync humbugg/app/dist/ "s3://${APP_S3_BUCKET}/" \
            --region "${{ env.AWS_REGION }}" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${APP_CF_DIST_ID}" \
            --paths "/*"

  email-feedback-smoke-test:
    name: Email Feedback Smoke Test
    needs: [update-lambda]
    if: ${{ !cancelled() && needs.update-lambda.result == 'success' }}
    runs-on: ubuntu-latest
    environment: humbugg-production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Exercise delivery, bounce, and complaint feedback
        run: |
          set -euo pipefail
          configuration_set=$(aws ssm get-parameter \
            --name /mailer/prod/humbugg/auth-configuration-set \
            --query Parameter.Value \
            --output text)
          content='{"Simple":{"Subject":{"Data":"Humbugg email feedback smoke test","Charset":"UTF-8"},"Body":{"Text":{"Data":"Automated SES mailbox simulator verification.","Charset":"UTF-8"}}}}'

          declare -a checks=()
          for scenario in success bounce complaint; do
            if [[ "${scenario}" != "success" ]]; then
              aws sesv2 delete-suppressed-destination \
                --email-address "${scenario}@simulator.amazonses.com" \
                >/dev/null 2>&1 || true
            fi
            message_id=$(aws sesv2 send-email \
              --region "${{ env.AWS_REGION }}" \
              --from-email-address no-reply@humbugg.com \
              --destination "{\"ToAddresses\":[\"${scenario}@simulator.amazonses.com\"]}" \
              --content "${content}" \
              --configuration-set-name "${configuration_set}" \
              --query MessageId \
              --output text)
            expected="${scenario}"
            if [[ "${scenario}" == "success" ]]; then expected="delivery"; fi
            checks+=("auth_${message_id}:${expected}")
          done

          for check in "${checks[@]}"; do
            message_id="${check%%:*}"
            expected="${check##*:}"
            for attempt in {1..60}; do
              actual=$(aws dynamodb get-item \
                --table-name humbugg-prod-email-messages \
                --key "{\"message_id\":{\"S\":\"${message_id}\"}}" \
                --query 'Item.status.S' \
                --output text)
              if [[ "${actual}" == "${expected}" ]]; then
                break
              fi
              if [[ "${attempt}" == "60" ]]; then
                echo "Expected ${message_id} to reach ${expected}; current status is ${actual}"
                exit 1
              fi
              sleep 10
            done
          done

  smoke-test:
    name: Production Smoke Test
    needs: [update-lambda, deploy-frontend-assets, deploy-app, email-feedback-smoke-test]
    # `!= 'failure'` rather than `== 'success'`, because a SKIPPED upstream job is
    # not a reason to skip this one. The three deploy jobs are path-filtered, so a
    # backend-only change skips `deploy-frontend-assets` and `deploy-app` — and
    # under the old `== 'success'` that skipped the smoke test too. The surfaces it
    # checks are live either way; not redeploying one is precisely when you want to
    # know it still answers.
    #
    # Found while verifying #387: that deploy went green with the smoke test
    # skipped, which is the state this condition was supposed to prevent.
    #
    # `!cancelled()` still stops it after a cancellation, and a genuine `failure`
    # upstream still stops it — that part was right.
    if: ${{ !cancelled() && needs.update-lambda.result != 'failure' && needs.deploy-frontend-assets.result != 'failure' && needs.deploy-app.result != 'failure' && needs.email-feedback-smoke-test.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify the three surfaces
        run: |
          set -euo pipefail

          # --- Marketing: www is canonical now ---
          marketing=$(curl --fail --silent --show-error --retry 5 --retry-delay 5 https://www.humbugg.com/)
          grep -q "More wonder" <<< "$marketing"
          grep -q '<meta name="description"' <<< "$marketing"
          curl --fail --retry 5 --retry-delay 5 https://www.humbugg.com/robots.txt >/dev/null
          curl --fail --retry 5 --retry-delay 5 https://www.humbugg.com/sitemap.xml >/dev/null

          # The apex folds into www, preserving path and query. Invite links carry
          # their secret in the fragment, which the browser re-applies to the
          # redirect target, so the path must survive.
          apex=$(curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' \
            'https://humbugg.com/join/example?source=apex')
          test "$apex" = "308 https://www.humbugg.com/join/example?source=apex"

          # Already-sent invite links land on www, which forwards them to the app.
          forwarded=$(curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' \
            'https://www.humbugg.com/join/example')
          test "$forwarded" = "301 https://app.humbugg.com/join/example"

          # --- Product app: the SPA fallback must answer a deep link, not just / ---
          curl --fail --retry 5 --retry-delay 5 https://app.humbugg.com/ >/dev/null
          deep=$(curl --silent --output /dev/null --write-out '%{http_code}' https://app.humbugg.com/groups/example)
          test "$deep" = "200"

          # --- API on its own domain ---
          curl --fail --retry 5 --retry-delay 5 https://api.humbugg.com/health >/dev/null
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' https://api.humbugg.com/api/groups)
          test "$status" = "401"

          # The single most valuable assertion here. Cross-origin, every non-simple
          # request is preceded by an OPTIONS preflight, and the API's authorizer
          # would 401 it before the Lambda ever saw it without an explicit
          # unauthenticated OPTIONS route. Same-origin traffic never exercised this,
          # so nothing else in the pipeline would catch a regression.
          preflight=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X OPTIONS \
            -H 'Origin: https://app.humbugg.com' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization,content-type' \
            https://api.humbugg.com/api/groups)
          test "$preflight" -lt 300
          allow=$(curl --silent --output /dev/null --write-out '%header{access-control-allow-origin}' \
            -X OPTIONS \
            -H 'Origin: https://app.humbugg.com' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization,content-type' \
            https://api.humbugg.com/api/groups)
          test "$allow" = "https://app.humbugg.com"
