name: Scout · Tear down preview · PR closed

on:
  pull_request:
    types:
      - closed

concurrency:
  group: scout-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  # ---------------------------------------------------------------------------
  # Delete the Scout ephemeral stack when a PR closes (merged or abandoned).
  # Runs for every PR close; the check-stack step short-circuits if there is
  # no scout-pr stack for this PR number.
  # ---------------------------------------------------------------------------
  teardown-scout:
    name: Teardown Scout PR Stack
    runs-on: ubuntu-latest
    environment: scout-pr
    permissions:
      id-token: write
      contents: read
    env:
      STACK_NAME: scout-pr-${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check if Terraform state exists
        id: check-state
        run: |
          # Suppress BOTH stdout and stderr — head-object writes JSON metadata
          # to stdout when the key exists, which would otherwise corrupt
          # $GITHUB_OUTPUT with multi-line content.
          if aws s3api head-object \
              --bucket andreas-services-terraform-state \
              --key "scout/pr/${{ github.event.pull_request.number }}/terraform.tfstate" \
              >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform destroy (pr)
        if: steps.check-state.outputs.exists == 'true'
        env:
          TF_VAR_pr_number:                  "${{ github.event.pull_request.number }}"
          TF_VAR_email_processor_image_uri:  "placeholder"
          TF_VAR_events_api_image_uri:       "placeholder"
          TF_VAR_anthropic_api_key:          ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_gmail_client_id:            ${{ secrets.GMAIL_CLIENT_ID }}
          TF_VAR_gmail_client_secret:        ${{ secrets.GMAIL_CLIENT_SECRET }}
          TF_VAR_gmail_refresh_token:        ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          terraform -chdir=scout/infra/envs/pr init -input=false \
            -backend-config="key=scout/pr/${{ github.event.pull_request.number }}/terraform.tfstate"
          terraform -chdir=scout/infra/envs/pr destroy -auto-approve -input=false

      - name: Skip (no Terraform state found)
        if: steps.check-state.outputs.exists == 'false'
        run: |
          echo "No Terraform state for PR ${{ github.event.pull_request.number }} — nothing to destroy."

      - name: Delete PR frontend from shared preview bucket
        run: |
          PR_PREVIEW_BUCKET=$(aws ssm get-parameter \
            --name /scout/pr-preview/s3-bucket \
            --query Parameter.Value --output text 2>/dev/null || echo "")
          if [ -n "${PR_PREVIEW_BUCKET}" ]; then
            aws s3 rm "s3://${PR_PREVIEW_BUCKET}/${{ github.event.pull_request.number }}/" \
              --recursive || true
          fi

      - name: Invalidate CloudFront PR prefix
        run: |
          PR_PREVIEW_CF_DIST=$(aws ssm get-parameter \
            --name /scout/pr-preview/cf-dist-id \
            --query Parameter.Value --output text 2>/dev/null || echo "")
          if [ -n "${PR_PREVIEW_CF_DIST}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "${PR_PREVIEW_CF_DIST}" \
              --paths "/${{ github.event.pull_request.number }}/*"
          fi

      - name: Skip (stack not found)
        if: steps.check-stack.outputs.status == 'DOES_NOT_EXIST'
        run: |
          echo "No Scout PR stack found for PR #${{ github.event.pull_request.number }} — nothing to delete."
