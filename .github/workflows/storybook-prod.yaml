name: Storybook · Deploy · Prod

# Combined prod deploy for storybook.
#
# DAG (image is a prerequisite of Terraform Lambda creation, so build-and-push
# runs before deploy-infra to eliminate the chicken-and-egg of an empty ECR
# repo on first deploy):
#
#   detect-changes ─► build-and-push (1 image, pushed to api + image-worker repos)
#                          │
#                          ▼
#                     deploy-infra (terraform apply)
#                          │
#                          ├─► update-lambda  (env vars + pin both Lambdas to :sha)
#                          └─► deploy-frontend

on:
  push:
    branches: [main]
    paths:
      - 'storybook/**'
      - '.github/workflows/storybook-prod.yaml'
  workflow_dispatch:
    inputs:
      run_infra:
        description: 'Run the deploy-infra job'
        type: boolean
        default: true
      run_app:
        description: 'Run update-lambda and deploy-frontend'
        type: boolean
        default: true
  workflow_run:
    workflows: ["Shared infra · Terraform apply · Prod"]
    types: [completed]
    branches: [main]

concurrency:
  group: storybook-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_DIR: storybook/infra/envs/prod
  ECR_API_REPO: storybook-prod-api
  ECR_WORKER_REPO: storybook-prod-image-normalization
  STORYBOOK_USER_PROFILES_TABLE:    storybook-prod-user-profiles
  STORYBOOK_CHILD_PROFILES_TABLE:   storybook-prod-child-profiles
  STORYBOOK_STORY_PROJECTS_TABLE:   storybook-prod-story-projects
  STORYBOOK_STORY_PAGES_TABLE:      storybook-prod-story-pages
  STORYBOOK_CHAT_MESSAGES_TABLE:    storybook-prod-chat-messages
  STORYBOOK_CHARACTER_ASSETS_TABLE: storybook-prod-character-assets
  STORYBOOK_STORY_STATES_TABLE:     storybook-prod-story-states
  STORYBOOK_IMAGES_TABLE:           storybook-prod-images
  STORYBOOK_MODEL_PROJECTS_TABLE:   storybook-prod-model-projects
  STORYBOOK_GENERATION_HISTORY_TABLE: storybook-prod-generation-history
  STORYBOOK_TRAINING_RUNS_TABLE:    storybook-prod-training-runs

jobs:
  detect-changes:
    name: Detect Changes
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            infra:
              - 'storybook/infra/**'
              - '.github/workflows/storybook-prod.yaml'
            backend:
              - 'storybook/backend/**'
              - '.github/workflows/storybook-prod.yaml'
            frontend:
              - 'storybook/frontend/**'
              - '.github/workflows/storybook-prod.yaml'

  # ---------------------------------------------------------------------------
  # Build Docker image and push to both ECR repos (api + image-worker).
  # Runs BEFORE deploy-infra so Lambda image_uri references always resolve.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Image
    needs: detect-changes
    if: |
      !cancelled()
      && (
        (github.event_name == 'push'
         && (needs.detect-changes.outputs.infra == 'true'
             || needs.detect-changes.outputs.backend == 'true'))
        || (github.event_name == 'workflow_dispatch'
            && (inputs.run_infra || inputs.run_app))
        || github.event_name == 'workflow_run'
      )
    runs-on: ubuntu-latest
    environment: storybook-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          echo "ECR_URL=${REGISTRY}/${ECR_API_REPO}"             >> "$GITHUB_ENV"
          echo "IMAGE_WORKER_ECR_URL=${REGISTRY}/${ECR_WORKER_REPO}" >> "$GITHUB_ENV"

      - name: Ensure ECR repositories exist
        run: |
          for REPO in "${ECR_API_REPO}" "${ECR_WORKER_REPO}"; do
            aws ecr describe-repositories --repository-names "$REPO" \
              --region "${{ env.AWS_REGION }}" >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "$REPO" \
              --region "${{ env.AWS_REGION }}" \
              --image-scanning-configuration scanOnPush=true \
              --tags Key=Project,Value=storybook
          done

      - name: Build & push image (single build, two repos)
        run: |
          cd storybook/backend
          DOCKER_BUILDKIT=0 docker build \
            -t "${ECR_URL}:${{ github.sha }}" \
            -t "${ECR_URL}:latest" \
            -t "${IMAGE_WORKER_ECR_URL}:${{ github.sha }}" \
            -t "${IMAGE_WORKER_ECR_URL}:latest" \
            .
          docker push "${ECR_URL}:${{ github.sha }}"
          docker push "${ECR_URL}:latest"
          docker push "${IMAGE_WORKER_ECR_URL}:${{ github.sha }}"
          docker push "${IMAGE_WORKER_ECR_URL}:latest"

  # ---------------------------------------------------------------------------
  # Terraform apply (storybook/infra/envs/prod) and publish outputs to SSM.
  # ---------------------------------------------------------------------------
  deploy-infra:
    name: Terraform Apply
    needs: [detect-changes, build-and-push]
    if: |
      !cancelled()
      && needs.build-and-push.result != 'failure'
      && (
        (github.event_name == 'push' && needs.detect-changes.outputs.infra == 'true')
        || (github.event_name == 'workflow_dispatch' && inputs.run_infra)
        || github.event_name == 'workflow_run'
      )
    runs-on: ubuntu-latest
    environment: storybook-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~1.5'
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      # Prune stale resources left in state after the VPC/DocumentDB removal.
      # The CI role no longer has ec2:DescribeSecurityGroups, so refreshing
      # these stale resources blocks every apply. `state rm` is idempotent —
      # once each address is gone, subsequent runs are no-ops.
      - name: Prune stale VPC resources from state
        working-directory: ${{ env.TF_DIR }}
        run: |
          for addr in \
            'aws_security_group_rule.lambda_to_docdb' \
            'aws_security_group_rule.image_worker_to_docdb' \
            'module.compute.aws_security_group.lambda[0]' \
            'module.image_worker.aws_security_group.worker[0]'; do
            terraform state rm "$addr" || true
          done

      # ECR repositories are created by build-and-push above so that :latest
      # exists before Terraform creates a Lambda that references it. That means
      # Terraform would try to create a repository AWS already has. Adopt it.
      #
      # This also covers a *rename*: when state holds a repository under the old
      # name, plain adoption is not enough -- Terraform would plan a replace and
      # fail with RepositoryAlreadyExistsException against the repo build-and-push
      # just made. So drop the stale object and import the new one in its place.
      # The old repository is deliberately left in AWS; deleting it is a separate,
      # deliberate step, not something a deploy should do behind your back.
      - name: Adopt bootstrap-created ECR repositories
        run: |
          set -euo pipefail
          TF_DIR=storybook/infra/envs/prod
          adopt() {
            local addr="$1" repo="$2" policy_addr="$3"
            if terraform -chdir="$TF_DIR" state show "$addr" >/dev/null 2>&1; then
              local current
              current=$(terraform -chdir="$TF_DIR" state show "$addr" \
                        | awk -F'"' '/^ *name *=/{print $2; exit}')
              if [ "$current" = "$repo" ]; then
                echo "already correct: $addr -> $repo"; return
              fi
              echo "rename: $addr holds '$current', config wants '$repo' -- re-adopting"
              terraform -chdir="$TF_DIR" state rm "$addr"
              # the lifecycle policy is keyed by repository name, so it goes too
              terraform -chdir="$TF_DIR" state rm "$policy_addr" 2>/dev/null || true
            fi
            if ! aws ecr describe-repositories --repository-names "$repo" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
              echo "not in AWS, Terraform will create it: $repo"; return
            fi
            echo "importing $repo -> $addr"
            terraform -chdir="$TF_DIR" import -input=false "$addr" "$repo"
          }
          adopt module.compute.aws_ecr_repository.backend "${ECR_API_REPO}" module.compute.aws_ecr_lifecycle_policy.backend
          adopt module.image_worker.aws_ecr_repository.worker "${ECR_WORKER_REPO}" module.image_worker.aws_ecr_lifecycle_policy.worker

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -input=false

      - name: Store infrastructure outputs in SSM
        working-directory: ${{ env.TF_DIR }}
        run: |
          put() {
            aws ssm put-parameter --overwrite --type String \
              --name "/storybook/prod/${1}" --value "${2}"
          }

          put cognito-user-pool-id    "$(terraform output -raw cognito_user_pool_id)"
          put cognito-client-id       "$(terraform output -raw cognito_user_pool_client_id)"
          put cognito-domain          "$(terraform output -raw cognito_domain)"
          put api-url                 "$(terraform output -raw api_url)"
          put app-url                 "$(terraform output -raw application_url)"
          put s3-frontend-bucket      "$(terraform output -raw s3_frontend_bucket)"
          put s3-backend-bucket       "$(terraform output -raw s3_backend_bucket)"
          put cf-dist-id              "$(terraform output -raw cloudfront_distribution_id)"
          put image-queue-url         "$(terraform output -raw image_queue_url)"
          put lambda-name             "$(terraform output -raw lambda_function_name)"
          put image-worker-lambda     "$(terraform output -raw image_worker_lambda_function_name)"
          put ecr-url                 "$(terraform output -raw ecr_repository_url)"
          put image-worker-ecr-url    "$(terraform output -raw image_worker_ecr_repository_url)"

  # ---------------------------------------------------------------------------
  # Update both Lambda functions (api + image-worker) — env vars and pin to :sha.
  # No Docker work — build-and-push has already pushed images to both repos.
  # ECR URLs and Lambda names come from SSM (written by deploy-infra).
  # ---------------------------------------------------------------------------
  update-lambda:
    name: Update Lambda Functions
    needs: [detect-changes, build-and-push, deploy-infra]
    if: |
      !cancelled()
      && needs.build-and-push.result == 'success'
      && needs.deploy-infra.result != 'failure'
      && ((github.event_name == 'workflow_dispatch' && inputs.run_app)
          || (github.event_name == 'push'
              && (needs.detect-changes.outputs.backend == 'true'
                  || needs.deploy-infra.result == 'success'))
          || (github.event_name == 'workflow_run'
              && needs.deploy-infra.result == 'success'))
    runs-on: ubuntu-latest
    environment: storybook-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read infrastructure values from SSM
        run: |
          # Assign, check, then export. `echo "X=$(get …)" >> "$GITHUB_ENV"`
          # took its exit status from `echo`, not from the substitution, so a
          # failed or renamed parameter wrote an EMPTY STRING and the step went
          # green under `bash -e`. `None` is what `--output text` prints for a
          # null value, so it is an empty read wearing a name.
          put() {
            local value
            value="$(aws ssm get-parameter --name "$2" \
              --query Parameter.Value --output text)" || exit 1
            [ -n "$value" ] && [ "$value" != "None" ] ||
              { echo "::error::$2 resolved empty; refusing to continue." >&2; exit 1; }
            echo "$1=$value" >> "$GITHUB_ENV"
          }

          put ECR_URL              /storybook/prod/ecr-url
          put IMAGE_WORKER_ECR_URL /storybook/prod/image-worker-ecr-url
          put LAMBDA_NAME          /storybook/prod/lambda-name
          put IMAGE_WORKER_LAMBDA  /storybook/prod/image-worker-lambda
          put S3_BACKEND_BUCKET    /storybook/prod/s3-backend-bucket
          put APP_URL              /storybook/prod/app-url
          put IMAGE_QUEUE_URL      /storybook/prod/image-queue-url
          put COGNITO_POOL_ID      /storybook/prod/cognito-user-pool-id
          put COGNITO_CLIENT_ID    /storybook/prod/cognito-client-id

      - name: Update API Lambda env vars + code
        env:
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          STABILITY_API_KEY:   ${{ secrets.STABILITY_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          set -euo pipefail
          ENV_OBJ="{}"
          for KEY in OPENAI_API_KEY STABILITY_API_KEY REPLICATE_API_TOKEN \
                     COGNITO_POOL_ID COGNITO_CLIENT_ID \
                     S3_BACKEND_BUCKET APP_URL IMAGE_QUEUE_URL \
                     STORYBOOK_USER_PROFILES_TABLE STORYBOOK_CHILD_PROFILES_TABLE \
                     STORYBOOK_STORY_PROJECTS_TABLE STORYBOOK_STORY_PAGES_TABLE \
                     STORYBOOK_CHAT_MESSAGES_TABLE STORYBOOK_CHARACTER_ASSETS_TABLE \
                     STORYBOOK_STORY_STATES_TABLE STORYBOOK_IMAGES_TABLE \
                     STORYBOOK_MODEL_PROJECTS_TABLE STORYBOOK_GENERATION_HISTORY_TABLE \
                     STORYBOOK_TRAINING_RUNS_TABLE; do
            VAL="${!KEY:-}"
            [ -n "$VAL" ] && ENV_OBJ=$(echo "$ENV_OBJ" | \
              jq -c --arg k "$KEY" --arg v "$VAL" '.[$k]=$v')
          done
          # Remap generic names to what the Lambda expects
          ENV_OBJ=$(echo "$ENV_OBJ" | jq -c '
            .AWS_COGNITO_USER_POOL_ID  = .COGNITO_POOL_ID   | del(.COGNITO_POOL_ID) |
            .AWS_COGNITO_APP_CLIENT_ID = .COGNITO_CLIENT_ID | del(.COGNITO_CLIENT_ID) |
            .S3_BUCKET_NAME            = .S3_BACKEND_BUCKET | del(.S3_BACKEND_BUCKET) |
            .IMAGE_UPLOAD_QUEUE_URL    = .IMAGE_QUEUE_URL   | del(.IMAGE_QUEUE_URL)
          ')
          jq -n --argjson v "$ENV_OBJ" '{Variables:$v}' > /tmp/env-api.json

          aws lambda update-function-configuration \
            --function-name "${LAMBDA_NAME}" \
            --region "${{ env.AWS_REGION }}" \
            --environment file:///tmp/env-api.json

          aws lambda wait function-updated \
            --function-name "${LAMBDA_NAME}" --region "${{ env.AWS_REGION }}"

          aws lambda update-function-code \
            --function-name "${LAMBDA_NAME}" \
            --image-uri "${ECR_URL}:${{ github.sha }}" \
            --region "${{ env.AWS_REGION }}" \
            --output table --query '{FunctionName:FunctionName,CodeSize:CodeSize}'

      - name: Update image worker Lambda env vars + code
        env:
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          STABILITY_API_KEY:   ${{ secrets.STABILITY_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          set -euo pipefail
          ENV_OBJ="{}"
          for KEY in OPENAI_API_KEY STABILITY_API_KEY REPLICATE_API_TOKEN \
                     COGNITO_POOL_ID COGNITO_CLIENT_ID S3_BACKEND_BUCKET APP_URL \
                     STORYBOOK_USER_PROFILES_TABLE STORYBOOK_CHILD_PROFILES_TABLE \
                     STORYBOOK_STORY_PROJECTS_TABLE STORYBOOK_STORY_PAGES_TABLE \
                     STORYBOOK_CHAT_MESSAGES_TABLE STORYBOOK_CHARACTER_ASSETS_TABLE \
                     STORYBOOK_STORY_STATES_TABLE STORYBOOK_IMAGES_TABLE \
                     STORYBOOK_MODEL_PROJECTS_TABLE STORYBOOK_GENERATION_HISTORY_TABLE \
                     STORYBOOK_TRAINING_RUNS_TABLE; do
            VAL="${!KEY:-}"
            [ -n "$VAL" ] && ENV_OBJ=$(echo "$ENV_OBJ" | \
              jq -c --arg k "$KEY" --arg v "$VAL" '.[$k]=$v')
          done
          ENV_OBJ=$(echo "$ENV_OBJ" | jq -c '
            .AWS_COGNITO_USER_POOL_ID  = .COGNITO_POOL_ID   | del(.COGNITO_POOL_ID) |
            .AWS_COGNITO_APP_CLIENT_ID = .COGNITO_CLIENT_ID | del(.COGNITO_CLIENT_ID) |
            .S3_BUCKET_NAME            = .S3_BACKEND_BUCKET | del(.S3_BACKEND_BUCKET)
          ')
          jq -n --argjson v "$ENV_OBJ" '{Variables:$v}' > /tmp/env-worker.json

          aws lambda update-function-configuration \
            --function-name "${IMAGE_WORKER_LAMBDA}" \
            --region "${{ env.AWS_REGION }}" \
            --environment file:///tmp/env-worker.json

          aws lambda wait function-updated \
            --function-name "${IMAGE_WORKER_LAMBDA}" --region "${{ env.AWS_REGION }}"

          aws lambda update-function-code \
            --function-name "${IMAGE_WORKER_LAMBDA}" \
            --image-uri "${IMAGE_WORKER_ECR_URL}:${{ github.sha }}" \
            --region "${{ env.AWS_REGION }}" \
            --output table --query '{FunctionName:FunctionName,CodeSize:CodeSize}'

  # ---------------------------------------------------------------------------
  # Build Vite SPA and sync to S3 + CloudFront
  # Values come from SSM (written by deploy-infra)
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend
    needs: [detect-changes, deploy-infra]
    if: |
      !cancelled()
      && needs.deploy-infra.result != 'failure'
      && ((github.event_name == 'workflow_dispatch' && inputs.run_app)
          || (github.event_name == 'push'
              && (needs.detect-changes.outputs.frontend == 'true'
                  || needs.deploy-infra.result == 'success'))
          || (github.event_name == 'workflow_run'
              && needs.deploy-infra.result == 'success'))
    runs-on: ubuntu-latest
    environment: storybook-production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read infrastructure values from SSM
        run: |
          # Assign, check, then export. `echo "X=$(get …)" >> "$GITHUB_ENV"`
          # took its exit status from `echo`, not from the substitution, so a
          # failed or renamed parameter wrote an EMPTY STRING and the step went
          # green under `bash -e`. `None` is what `--output text` prints for a
          # null value, so it is an empty read wearing a name.
          put() {
            local value
            value="$(aws ssm get-parameter --name "$2" \
              --query Parameter.Value --output text)" || exit 1
            [ -n "$value" ] && [ "$value" != "None" ] ||
              { echo "::error::$2 resolved empty; refusing to continue." >&2; exit 1; }
            echo "$1=$value" >> "$GITHUB_ENV"
          }

          put VITE_API_URL         /storybook/prod/api-url
          put S3_FRONTEND_BUCKET   /storybook/prod/s3-frontend-bucket
          put CF_DIST_ID           /storybook/prod/cf-dist-id
          # Vite inlines these; empty ships an SPA whose login can never succeed.
          put VITE_COGNITO_POOL_ID   /storybook/prod/cognito-user-pool-id
          put VITE_COGNITO_CLIENT_ID /storybook/prod/cognito-client-id
          put VITE_COGNITO_DOMAIN    /storybook/prod/cognito-domain

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: storybook/frontend/storybook-ui/package-lock.json

      - name: Install dependencies
        run: cd storybook/frontend/storybook-ui && npm ci --legacy-peer-deps

      - name: Build frontend
        env:
          VITE_API_URL:                  ${{ env.VITE_API_URL }}
          VITE_AWS_COGNITO_USER_POOL_ID: ${{ env.VITE_COGNITO_POOL_ID }}
          VITE_AWS_COGNITO_APP_CLIENT_ID: ${{ env.VITE_COGNITO_CLIENT_ID }}
          VITE_AWS_COGNITO_DOMAIN:       ${{ env.VITE_COGNITO_DOMAIN }}
        run: cd storybook/frontend/storybook-ui && npm run build

      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync storybook/frontend/storybook-ui/dist/ \
            "s3://${S3_FRONTEND_BUCKET}/app/" \
            --region "${{ env.AWS_REGION }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"

      - name: Sync HTML (no cache)
        run: |
          aws s3 sync storybook/frontend/storybook-ui/dist/ \
            "s3://${S3_FRONTEND_BUCKET}/app/" \
            --region "${{ env.AWS_REGION }}" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --include "*.html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DIST_ID}" \
            --paths "/*"
