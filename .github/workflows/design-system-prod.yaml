name: Design System · Publish

on:
  push:
    branches: [main]
    paths:
      - 'design-system/**'
  workflow_dispatch: {}

concurrency:
  group: design-system-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ansavva'
          cache: npm
          cache-dependency-path: design-system/package-lock.json

      - name: Install dependencies
        run: cd design-system && npm install

      - name: Typecheck
        run: cd design-system && npm run typecheck

      - name: Test
        run: cd design-system && npm test

      - name: Build
        run: cd design-system && npm run build

      - name: Check if this version is already published
        id: version-check
        working-directory: design-system
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@ansavva/design-system@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version-check.outputs.published == 'false'
        working-directory: design-system
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
