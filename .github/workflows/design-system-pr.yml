name: Design System · PR

on:
  pull_request:
    paths:
      - 'design-system/**'
      - '.github/workflows/design-system-pr.yml'

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: design-system/package-lock.json

      - name: Install dependencies
        run: cd design-system && npm install

      - name: Lint
        run: cd design-system && npm run lint

      - name: Typecheck
        run: cd design-system && npm run typecheck

      - name: Test
        run: cd design-system && npm test

      - name: Build
        run: cd design-system && npm run build
