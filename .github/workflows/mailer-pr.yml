name: Mailer · PR

on:
  pull_request:
    paths:
      - 'mailer/**'
      - 'infra/**'
      - '.github/workflows/mailer-pr.yml'
      - '.github/workflows/mailer-prod.yaml'

jobs:
  validate-python:
    name: Validate Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            mailer/requirements.txt
            mailer/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r mailer/requirements-dev.txt
      - name: Lint
        run: python -m ruff check mailer
      - name: Test
        run: python -m pytest mailer/tests

  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.63.1
      - name: Format check
        run: |
          terraform -chdir=mailer/infra/envs/prod fmt -check -recursive ../../
          terraform -chdir=infra/envs/shared fmt -check -recursive ../../
      - name: Validate Mailer
        run: |
          terraform -chdir=mailer/infra/envs/prod init -backend=false -input=false
          terraform -chdir=mailer/infra/envs/prod validate
      - name: Validate shared infrastructure
        run: |
          terraform -chdir=infra/envs/shared init -backend=false -input=false
          terraform -chdir=infra/envs/shared validate
      - name: TFLint
        run: |
          tflint --init --config "$(pwd)/.tflint.hcl"
          tflint --recursive --chdir=mailer/infra --config "$(pwd)/.tflint.hcl"
          tflint --recursive --chdir=infra --config "$(pwd)/.tflint.hcl"

  build-images:
    name: Build Lambda and Local Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose
        run: docker compose -f mailer/docker-compose.yml config
      - name: Build Lambda image
        run: docker build --target lambda -t mailer:ci mailer
      - name: Build local image
        run: docker build --target local -t mailer-local:ci mailer
      - name: Exercise local Mailer and Mailpit
        run: |
          docker compose -f mailer/docker-compose.yml up -d --build
          trap 'docker compose -f mailer/docker-compose.yml down -v' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8026/health && break
            sleep 1
          done
          curl --fail --silent \
            -H 'content-type: application/json' \
            --data @mailer/contracts/examples/message.json \
            http://127.0.0.1:8026/v1/services/humbugg/messages
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8025/api/v1/messages | grep -q 'recipient@example.com'; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f mailer/docker-compose.yml logs
          exit 1
