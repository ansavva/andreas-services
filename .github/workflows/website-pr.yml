name: Website · PR

# Validation-only PR checks for the website service (no AWS writes):
# backend unit tests + frontend lint/typecheck/build, plus a Docker build of
# both Lambda images to catch packaging regressions early.

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-pr.yml'

concurrency:
  group: website-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'website/backend/**'
              - '.github/workflows/website-pr.yml'
            frontend:
              - 'website/frontend/**'
              - '.github/workflows/website-pr.yml'

  backend:
    name: Backend — tests + image
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Install dependencies
        run: cd website/backend && poetry install --no-root --no-interaction

      - name: Run tests
        run: cd website/backend && poetry run pytest -q

      - name: Docker build (packaging check)
        run: cd website/backend && docker build -t website-api:ci .

  frontend:
    name: Frontend — lint/typecheck/build + image
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/frontend/package-lock.json

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd website/frontend && npm ci

      - name: Lint
        run: cd website/frontend && npm run lint

      - name: Typecheck
        run: cd website/frontend && npm run typecheck

      - name: Build
        run: cd website/frontend && npm run build

      - name: Docker build (packaging check)
        run: cd website/frontend && docker build -t website-frontend:ci .
