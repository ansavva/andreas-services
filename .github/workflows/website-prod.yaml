name: Website · Deploy · Prod

# Combined prod deploy for the website service (SSR frontend + Python API).
#
#   detect-changes ─► bootstrap-ecr (Terraform creates the two repositories)
#                          │
#                          ▼
#                     build-and-push (both images, when infra/backend/frontend change)
#                          │            (also uploads build/client for the asset sync)
#                          ▼
#                     deploy-infra (terraform apply → SSM outputs)
#                          │
#                          ├─► update-lambda        (env vars + pin both Lambdas to :sha)
#                          ├─► bootstrap-admin       (idempotent Cognito admin user)
#                          └─► deploy-frontend-assets (sync build/client → S3 + invalidate)
#
# Images are built BEFORE Terraform: the Lambdas reference :latest with
# lifecycle ignore_changes=[image_uri,environment], so the images must already
# exist in ECR on first apply.

on:
  push:
    branches: [main]
    paths:
      - 'website/infra/**'
      - 'website/backend/**'
      - 'website/frontend/**'
      - '.github/workflows/website-prod.yaml'
  workflow_dispatch:
    inputs:
      run_infra:
        description: 'Run the deploy-infra job'
        type: boolean
        default: true
      run_app:
        description: 'Run update-lambda and deploy-frontend-assets'
        type: boolean
        default: true
  workflow_run:
    workflows: ["Shared infra · Terraform apply · Prod"]
    types: [completed]
    branches: [main]

concurrency:
  group: website-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  detect-changes:
    name: Detect Changes
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            infra:
              - 'website/infra/**'
              - '.github/workflows/website-prod.yaml'
            backend:
              - 'website/backend/**'
              - '.github/workflows/website-prod.yaml'
            frontend:
              - 'website/frontend/**'
              - '.github/workflows/website-prod.yaml'

  # ---------------------------------------------------------------------------
  # Create the two image repositories before anything builds. Terraform owns
  # them, exactly as it does for mailer: the images must exist in ECR before
  # deploy-infra can create Lambdas that reference ${repo}:latest, and the
  # repositories must exist before build-and-push can push into them.
  #
  # This job used to be an `aws ecr create-repository` step inside
  # build-and-push, with an import step in deploy-infra to hand the result back
  # to Terraform. That is what broke #227: the import was guarded on the
  # Terraform ADDRESS being in state rather than on the repository NAME it held,
  # so mid-rename the guard saw website-api at the address, declared it already
  # adopted, skipped the import — and the apply then died trying to create a
  # website-prod-api the CLI step had already made. Letting Terraform create
  # them removes the collision instead of teaching a workaround to detect it.
  # ---------------------------------------------------------------------------
  bootstrap-ecr:
    name: Bootstrap ECR
    needs: detect-changes
    if: |
      !cancelled()
      && (
        (github.event_name == 'push'
         && (needs.detect-changes.outputs.infra == 'true'
             || needs.detect-changes.outputs.backend == 'true'
             || needs.detect-changes.outputs.frontend == 'true'))
        || (github.event_name == 'workflow_dispatch' && (inputs.run_infra || inputs.run_app))
        || github.event_name == 'workflow_run'
      )
    runs-on: ubuntu-latest
    environment: website-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Create the Terraform-owned image repositories first
        run: |
          terraform -chdir=website/infra/envs/prod init -input=false
          terraform -chdir=website/infra/envs/prod apply \
            -auto-approve -input=false \
            -target=module.compute.aws_ecr_repository.api \
            -target=module.compute.aws_ecr_repository.www \
            -target=module.compute.aws_ecr_lifecycle_policy.api \
            -target=module.compute.aws_ecr_lifecycle_policy.www

  # ---------------------------------------------------------------------------
  # Build both Docker images and push to ECR. Also builds the frontend client
  # bundle and uploads it so the asset sync uses the exact same hashes the
  # server bundle references.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Images
    needs: [detect-changes, bootstrap-ecr]
    if: |
      !cancelled()
      && needs.bootstrap-ecr.result == 'success'
      && (
        (github.event_name == 'push'
         && (needs.detect-changes.outputs.infra == 'true'
             || needs.detect-changes.outputs.backend == 'true'
             || needs.detect-changes.outputs.frontend == 'true'))
        || (github.event_name == 'workflow_dispatch' && (inputs.run_infra || inputs.run_app))
        || github.event_name == 'workflow_run'
      )
    runs-on: ubuntu-latest
    environment: website-production
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_ENV"

      - name: Build & push backend (website-prod-api)
        run: |
          IMAGE="${ECR_REGISTRY}/website-prod-api"
          cd website/backend
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Install frontend deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd website/frontend && npm ci

      - name: Build frontend (SSR + client assets)
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_CAL_LINK: ${{ vars.VITE_CAL_LINK }}
        run: cd website/frontend && npm run build

      - name: Build & push frontend (website-prod-www SSR image)
        run: |
          IMAGE="${ECR_REGISTRY}/website-prod-www"
          cd website/frontend
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Upload client assets (for the S3 sync)
        uses: actions/upload-artifact@v7
        with:
          name: frontend-client
          path: website/frontend/build/client
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Terraform apply + publish resolved IDs to SSM.
  # ---------------------------------------------------------------------------
  deploy-infra:
    name: Terraform Apply
    needs: [detect-changes, bootstrap-ecr, build-and-push]
    # A failed bootstrap skips build-and-push rather than failing it, so gating
    # only on build-and-push not being 'failure' would let a full apply run with
    # no repositories and no images behind it.
    if: |
      !cancelled()
      && needs.bootstrap-ecr.result == 'success'
      && needs.build-and-push.result != 'failure'
      && (
        (github.event_name == 'push' && needs.detect-changes.outputs.infra == 'true')
        || (github.event_name == 'workflow_dispatch' && inputs.run_infra)
        || github.event_name == 'workflow_run'
      )
    runs-on: ubuntu-latest
    environment: website-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=website/infra/envs/prod init -input=false

      - name: Terraform apply
        run: terraform -chdir=website/infra/envs/prod apply -auto-approve -input=false

      - name: Write outputs to SSM
        run: |
          set -euo pipefail
          tf() { terraform -chdir=website/infra/envs/prod output -raw "$1"; }
          put() { aws ssm put-parameter --overwrite --type String --name "$1" --value "$2"; }
          put /website/prod/cf-dist-id             "$(tf cloudfront_distribution_id)"
          put /website/prod/assets-bucket          "$(tf assets_bucket_name)"
          put /website/prod/intake-table           "$(tf intake_table_name)"
          put /website/prod/api-url                "$(tf api_domain)"
          put /website/prod/cognito-user-pool-id   "$(tf cognito_user_pool_id)"
          put /website/prod/cognito-client-id      "$(tf cognito_user_pool_client_id)"

  # ---------------------------------------------------------------------------
  # Set Lambda env vars and pin both functions to :sha.
  # ---------------------------------------------------------------------------
  update-lambda:
    name: Update Lambda Functions
    needs: [detect-changes, build-and-push, deploy-infra]
    # Deploy the freshly-built image whenever the build succeeded and infra did
    # not fail. deploy-infra legitimately *skips* on app-only changes (it is
    # gated on infra paths), so gating on its success would strand every
    # frontend/backend-only image in ECR, never repointing the Lambda.
    if: |
      !cancelled()
      && needs.build-and-push.result == 'success'
      && needs.deploy-infra.result != 'failure'
      && (
        (github.event_name == 'workflow_dispatch' && inputs.run_app)
        || github.event_name == 'push'
        || github.event_name == 'workflow_run'
      )
    runs-on: ubuntu-latest
    environment: website-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set ECR registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_ENV"

      - name: Update Lambda env vars
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_FORM_ID: ${{ secrets.KIT_FORM_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -euo pipefail
          get() { aws ssm get-parameter --name "/website/prod/${1}" --query Parameter.Value --output text; }
          API_URL=$(get api-url)
          POOL_ID=$(get cognito-user-pool-id)
          CLIENT_ID=$(get cognito-client-id)
          INTAKE_TABLE=$(get intake-table)

          jq -n --arg origin "https://www.andreas.services" \
                --arg table "${INTAKE_TABLE}" \
                --arg kit "${KIT_API_KEY}" --arg form "${KIT_FORM_ID}" \
            '{Variables: {
              WEBSITE_INTAKE_TABLE:   $table,
              WEBSITE_ALLOWED_ORIGIN: $origin,
              KIT_API_KEY:            $kit,
              KIT_FORM_ID:            $form
            }}' > /tmp/env-api.json

          jq -n --arg api "${API_URL}" --arg pool "${POOL_ID}" \
                --arg client "${CLIENT_ID}" --arg secret "${SESSION_SECRET}" \
            '{Variables: {
              NODE_ENV:             "production",
              WEBSITE_API_URL:      $api,
              COGNITO_USER_POOL_ID: $pool,
              COGNITO_CLIENT_ID:    $client,
              SESSION_SECRET:       $secret
            }}' > /tmp/env-frontend.json

          set_env() {
            aws lambda update-function-configuration \
              --function-name "$1" --region "${{ env.AWS_REGION }}" --environment "file://$2"
            aws lambda wait function-updated --function-name "$1" --region "${{ env.AWS_REGION }}"
          }
          set_env website-prod-api      /tmp/env-api.json
          set_env website-prod-www      /tmp/env-frontend.json

      - name: Update Lambda function code
        run: |
          set -euo pipefail
          update_code() {
            aws lambda update-function-code \
              --function-name "$1" --image-uri "$2" --region "${{ env.AWS_REGION }}" \
              --output table --query '{FunctionName:FunctionName,CodeSize:CodeSize}'
            aws lambda wait function-updated --function-name "$1" --region "${{ env.AWS_REGION }}"
          }
          update_code website-prod-api      "${ECR_REGISTRY}/website-prod-api:${{ github.sha }}"
          update_code website-prod-www      "${ECR_REGISTRY}/website-prod-www:${{ github.sha }}"

  # ---------------------------------------------------------------------------
  # Bootstrap the single Cognito admin user. Idempotent + self-skipping.
  # ---------------------------------------------------------------------------
  bootstrap-admin:
    name: Bootstrap Admin User
    needs: [deploy-infra]
    if: "!cancelled() && needs.deploy-infra.result == 'success'"
    runs-on: ubuntu-latest
    environment: website-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Namespaced secret names. `ADMIN_EMAIL`/`ADMIN_PASSWORD` were the only
      # unnamespaced secrets in the repo — every other service prefixes — and a
      # bare name is the one that collides if these ever become
      # organisation-level.
      #
      # The `|| secrets.ADMIN_*` fallback that carried the rename is gone. It
      # existed so the rename could happen in either order, and it has done its
      # job: the deploy that replaced this pool re-created the admin from
      # `WEBSITE_ADMIN_*`, and the bare pair is not set on the environment. A
      # fallback to something that does not exist only hides which name is
      # actually in use.
      - name: Create admin user
        env:
          WEBSITE_ADMIN_EMAIL: ${{ secrets.WEBSITE_ADMIN_EMAIL }}
          WEBSITE_ADMIN_PASSWORD: ${{ secrets.WEBSITE_ADMIN_PASSWORD }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          if [ -z "${WEBSITE_ADMIN_EMAIL}" ] || [ -z "${WEBSITE_ADMIN_PASSWORD}" ]; then
            echo "WEBSITE_ADMIN_EMAIL / WEBSITE_ADMIN_PASSWORD not set — skipping admin bootstrap."
            exit 0
          fi
          USER_POOL_ID=$(aws ssm get-parameter --name /website/prod/cognito-user-pool-id \
            --query Parameter.Value --output text)
          export USER_POOL_ID
          bash website/scripts/create-admin-user.sh

  # ---------------------------------------------------------------------------
  # Sync the client assets (built in build-and-push) to S3 and invalidate.
  # ---------------------------------------------------------------------------
  deploy-frontend-assets:
    name: Deploy Frontend Assets
    needs: [detect-changes, build-and-push, deploy-infra]
    # Same gating as update-lambda: ship the assets built alongside the image
    # even when deploy-infra skipped (app-only change).
    if: |
      !cancelled()
      && needs.build-and-push.result == 'success'
      && needs.deploy-infra.result != 'failure'
      && (
        (github.event_name == 'workflow_dispatch' && inputs.run_app)
        || github.event_name == 'push'
        || github.event_name == 'workflow_run'
      )
    runs-on: ubuntu-latest
    environment: website-production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download client assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-client
          path: build/client

      - name: Read infra values from SSM
        run: |
          # Assign, check, then export. `echo "X=$(get …)" >> "$GITHUB_ENV"`
          # took its exit status from `echo`, not from the substitution, so a
          # failed or renamed parameter wrote an EMPTY STRING and the step went
          # green under `bash -e`. `None` is what `--output text` prints for a
          # null value, so it is an empty read wearing a name.
          put() {
            local value
            value="$(aws ssm get-parameter --name "$2" \
              --query Parameter.Value --output text)" || exit 1
            [ -n "$value" ] && [ "$value" != "None" ] ||
              { echo "::error::$2 resolved empty; refusing to continue." >&2; exit 1; }
            echo "$1=$value" >> "$GITHUB_ENV"
          }

          put S3_BUCKET  /website/prod/assets-bucket
          put CF_DIST_ID /website/prod/cf-dist-id

      - name: Sync assets to S3 (immutable)
        run: |
          aws s3 sync build/client/ "s3://${S3_BUCKET}/" \
            --region "${{ env.AWS_REGION }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "${CF_DIST_ID}" --paths "/*"
