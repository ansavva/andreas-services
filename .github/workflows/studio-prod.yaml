name: Studio · Deploy · Prod

# Combined prod deploy for studio.
#
# DAG (the image is a prerequisite of Terraform's Lambda creation, so the ECR
# bootstrap and the image build both run before the full apply — that is what
# keeps a first deploy into an empty account from deadlocking on
# "Lambda needs an image / the image needs a repository"):
#
#   detect-changes ─► bootstrap-ecr ─► build-and-push ─► deploy-infra
#                                                            │
#                                                            ├─► update-lambda ─► smoke
#                                                            └─► deploy-frontend
#
# `smoke` is a DETECTOR, NOT A GATE, and the position in that graph is the whole
# reason to say so. Studio has no staging environment: this workflow deploys
# straight to production, so by the time the smoke suite signs in, the new image
# is already serving every request. Nothing it asserts can prevent a bad deploy.
# It fails the run because red is the signal — a broken deploy announcing itself
# in minutes with a named cause beats finding out weeks later from whoever opened
# the site, which is how a missing `dynamodb:BatchGetItem` grant was found.
#
# Two surfaces come out of this: studio.andreas.services (the Vite SPA on
# S3 + CloudFront) and studio-api.andreas.services (the Flask Lambda).
#
# studio-pr.yml validates pull requests and never writes to AWS.

# `studio/pipeline/`, `studio/.claude/skills/` and `studio/docs/` are excluded from the trigger: they
# are the local generation pipeline, its skills and its docs, which run inside Claude on a
# developer's machine and deploy nowhere. The `detect-changes` filters below
# would already skip every job for a skills-only change, but excluding them here
# means the workflow does not start at all.

on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - '!studio/.claude/**'
      - '!studio/docs/**'
      - '!studio/pipeline/**'
      - '.github/workflows/studio-prod.yaml'
  workflow_dispatch:
    inputs:
      run_infra:
        description: 'Run the deploy-infra job'
        type: boolean
        default: true
      run_app:
        description: 'Run update-lambda and deploy-frontend'
        type: boolean
        default: true
  workflow_run:
    workflows: ["Shared infra · Terraform apply · Prod"]
    types: [completed]
    branches: [main]

concurrency:
  group: studio-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  API_ECR_REPO: studio-prod-api
  API_LAMBDA_NAME: studio-prod-api

jobs:
  detect-changes:
    name: Detect Changes
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      smoke: ${{ steps.filter.outputs.smoke }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            infra:
              - 'studio/infra/**'
              - '.github/workflows/studio-prod.yaml'
            backend:
              - 'studio/backend/**'
              - '.github/workflows/studio-prod.yaml'
            frontend:
              - 'studio/frontend/**'
              - '.github/workflows/studio-prod.yaml'
            # The smoke run's own inputs. Its suite lives under
            # `studio/backend/**` and is covered there too; what this filter
            # adds is the fixture and the seeder, which change nothing that
            # deploys — so a change to either would otherwise start this
            # workflow, skip every job, and never re-seed.
            smoke:
              - 'studio/seeds/**'
              - 'studio/scripts/prod-seed-smoke.py'
              - 'studio/backend/tests/smoke/**'
              - '.github/workflows/studio-prod.yaml'

  # ---------------------------------------------------------------------------
  # Create only the ECR repository, so the image has somewhere to land before
  # the full apply tries to create a Lambda that references it.
  # ---------------------------------------------------------------------------
  bootstrap-ecr:
    name: Bootstrap ECR
    needs: detect-changes
    if: |
      !cancelled()
      && (
        (github.event_name == 'push'
         && (needs.detect-changes.outputs.infra == 'true'
             || needs.detect-changes.outputs.backend == 'true'
             || needs.detect-changes.outputs.frontend == 'true'))
        || (github.event_name == 'workflow_dispatch' && (inputs.run_infra || inputs.run_app))
        || github.event_name == 'workflow_run'
      )
    runs-on: ubuntu-latest
    environment: studio-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Create the Terraform-owned image repository first
        run: |
          set -euo pipefail

          # This targeted apply exists for one situation: a fresh AWS account,
          # where `build-and-push` has nowhere to push because Terraform has not
          # run yet, and Terraform cannot run first because the Lambda
          # references `${ecr_repo}:latest`. Once the repository exists it does
          # nothing.
          #
          # "Does nothing" was too generous. `-target` makes Terraform refuse
          # any plan whose state contains resources moved by a `moved` block
          # outside the target set — "Moved resource instances excluded by
          # targeting" — so a `moved` block anywhere in this configuration
          # failed this step, and with it every studio deploy, while the full
          # apply that would have consumed the move never ran. That is what
          # happened to the media bucket rename in #259.
          #
          # So skip it once the repository is there. The bootstrap keeps working
          # on a fresh account (no repository, and no prior state for a `moved`
          # block to collide with), and refactors stop being able to break the
          # pipeline through a step that had no work to do.
          if aws ecr describe-repositories \
               --repository-names "${{ env.API_ECR_REPO }}" >/dev/null 2>&1; then
            echo "${{ env.API_ECR_REPO }} already exists — nothing to bootstrap."
            exit 0
          fi

          echo "${{ env.API_ECR_REPO }} not found — bootstrapping it."
          terraform -chdir=studio/infra/envs/prod init -input=false
          terraform -chdir=studio/infra/envs/prod apply \
            -auto-approve -input=false \
            -target=module.compute.aws_ecr_repository.api \
            -target=module.compute.aws_ecr_lifecycle_policy.api

  # ---------------------------------------------------------------------------
  # Build and push the API image.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Image
    needs: [detect-changes, bootstrap-ecr]
    if: |
      !cancelled()
      && needs.bootstrap-ecr.result == 'success'
    runs-on: ubuntu-latest
    environment: studio-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_ENV"

      - name: Build & push backend (studio-prod-api)
        run: |
          set -euo pipefail
          IMAGE="${ECR_REGISTRY}/${{ env.API_ECR_REPO }}"
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" studio/backend
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

  # ---------------------------------------------------------------------------
  # Terraform apply.
  # ---------------------------------------------------------------------------
  deploy-infra:
    name: Terraform Apply
    needs: [detect-changes, bootstrap-ecr, build-and-push]
    # A failed bootstrap skips build-and-push rather than failing it, so gating
    # only on build-and-push not being 'failure' would let a full apply run with
    # no repository and no image behind it.
    if: |
      !cancelled()
      && needs.bootstrap-ecr.result == 'success'
      && needs.build-and-push.result != 'failure'
      && (
        (github.event_name == 'push' && needs.detect-changes.outputs.infra == 'true')
        || (github.event_name == 'workflow_dispatch' && inputs.run_infra)
        || github.event_name == 'workflow_run'
      )
    runs-on: ubuntu-latest
    environment: studio-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=studio/infra/envs/prod init -input=false

      - name: Terraform apply
        run: terraform -chdir=studio/infra/envs/prod apply -auto-approve -input=false

      - name: Write outputs to SSM
        run: |
          set -euo pipefail
          tf() { terraform -chdir=studio/infra/envs/prod output -raw "$1"; }
          put() { aws ssm put-parameter --overwrite --type String --name "$1" --value "$2"; }
          put /studio/prod/app-bucket            "$(tf app_bucket_name)"
          put /studio/prod/cf-dist-id            "$(tf cloudfront_distribution_id)"
          put /studio/prod/media-bucket          "$(tf media_bucket_name)"
          put /studio/prod/catalog-table         "$(tf catalog_table_name)"
          put /studio/prod/cognito-user-pool-id  "$(tf cognito_user_pool_id)"
          put /studio/prod/cognito-client-id     "$(tf cognito_user_pool_client_id)"
          # The Managed Login host. `deploy-frontend` reads it back as
          # VITE_COGNITO_DOMAIN, and it must be written by THIS job: infra
          # applies before the frontend builds, so the SPA can never ship
          # redirecting at a domain that does not exist yet.
          put /studio/prod/cognito-auth-domain   "$(tf cognito_auth_domain)"
          # Where Replicate calls back when a prediction finishes. `update-lambda`
          # reads it back as STUDIO_WEBHOOK_BASE_URL. It has to travel through SSM
          # rather than through Terraform's own `environment` block, and not for
          # the usual reason: `modules/compute` lends the callback worker its
          # execution role, so it cannot also read `modules/callbacks`'s output
          # without a dependency cycle.
          put /studio/prod/callback-base-url     "$(tf callback_base_url)"
          # The consumer's function name, so the step below can pin its image
          # alongside the API's. Both run the SAME image at different handlers.
          put /studio/prod/callback-worker       "$(tf callback_worker_function_name)"

  # ---------------------------------------------------------------------------
  # Set the Lambda's env vars and pin its code to :sha.
  # ---------------------------------------------------------------------------
  update-lambda:
    name: Update Lambda Function
    needs: [detect-changes, build-and-push, deploy-infra]
    # Deploy the freshly-built image whenever the build succeeded and infra did
    # not fail. deploy-infra legitimately *skips* on app-only changes (it is
    # gated on infra paths), so gating on its success would strand every
    # backend-only image in ECR, never repointing the Lambda.
    if: |
      !cancelled()
      && needs.build-and-push.result == 'success'
      && needs.deploy-infra.result != 'failure'
      && (
        (github.event_name == 'workflow_dispatch' && inputs.run_app)
        || github.event_name == 'push'
        || github.event_name == 'workflow_run'
      )
    runs-on: ubuntu-latest
    environment: studio-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set ECR registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_ENV"

      - name: Update Lambda env vars
        run: |
          set -euo pipefail
          get() { aws ssm get-parameter --name "/studio/prod/${1}" --query Parameter.Value --output text; }
          MEDIA_BUCKET=$(get media-bucket)
          CATALOG_TABLE=$(get catalog-table)
          POOL_ID=$(get cognito-user-pool-id)
          CLIENT_ID=$(get cognito-client-id)
          CALLBACK_URL=$(get callback-base-url)
          WORKER=$(get callback-worker)

          # THIS BLOCK, NOT TERRAFORM, IS WHAT SETS THE LAMBDA'S ENVIRONMENT.
          # The function carries `ignore_changes = [environment]`, so the
          # `environment` block in `modules/compute` applies at creation and
          # never again. A variable added there and not here reads as its
          # default — or as unset — in the running function, with a clean plan
          # and a correct-looking console entry to hide it. Every variable the
          # backend reads belongs in BOTH places.
          #
          # `update-function-configuration --environment` REPLACES the map
          # rather than merging into it, so this document must be complete:
          # dropping a line here unsets that variable on the next deploy.
          #
          # An EMPTY root prefix is the correct value, not a missing one: the
          # pipeline dropped its `media/` wrapper and now writes
          # `characters/`, `projects/` and `phrasebook/` at the top level, so
          # the browsable root is the bucket itself.
          #
          # The Cognito ids are here because the Lambda validates the JWT
          # itself — the gateway authorizer's claims cannot reach Flask through
          # Mangum. They are the same two parameters the frontend build and
          # `dev-setup.sh` read, so the API, the SPA and a local dev session all
          # track one pool.
          # STUDIO_REPLICATE_TOKEN_PARAMETER is a parameter NAME, never a token.
          # The Lambda reads the SecureString at call time under its own role, so
          # the secret never sits in this document, in this runner's memory, or in
          # a function's environment where `lambda:GetFunctionConfiguration` would
          # expose it. Set the value out of band:
          #   aws ssm put-parameter --overwrite --type SecureString \
          #     --name /studio/prod/replicate-api-token --value r8_…
          jq -n --arg bucket "${MEDIA_BUCKET}" \
                --arg prefix "" \
                --arg origin "https://studio.andreas.services" \
                --arg table "${CATALOG_TABLE}" \
                --arg pool "${POOL_ID}" \
                --arg client "${CLIENT_ID}" \
                --arg callback "${CALLBACK_URL}" \
            '{Variables: {
              STUDIO_MEDIA_BUCKET:              $bucket,
              STUDIO_MEDIA_ROOT_PREFIX:         $prefix,
              STUDIO_ALLOWED_ORIGIN:            $origin,
              STUDIO_CATALOG_TABLE:             $table,
              STUDIO_COGNITO_USER_POOL_ID:      $pool,
              STUDIO_COGNITO_CLIENT_ID:         $client,
              STUDIO_WEBHOOK_BASE_URL:          $callback,
              STUDIO_REPLICATE_TOKEN_PARAMETER: "/studio/prod/replicate-api-token"
            }}' > /tmp/env-api.json

          aws lambda update-function-configuration \
            --function-name "${{ env.API_LAMBDA_NAME }}" \
            --region "${{ env.AWS_REGION }}" --environment file:///tmp/env-api.json
          aws lambda wait function-updated \
            --function-name "${{ env.API_LAMBDA_NAME }}" --region "${{ env.AWS_REGION }}"

          # THE CALLBACK WORKER, WHICH RUNS THE SAME IMAGE AT ANOTHER HANDLER.
          #
          # It needs the bucket, the table and the token parameter and nothing
          # else: it holds no Cognito ids because it answers no request, and no
          # allowed origin because no browser reaches it. Updated in the same
          # step as the API so the two cannot be left on different code — a
          # worker running last week's image would close runs with last week's
          # closing logic, silently and correctly-looking.
          jq -n --arg bucket "${MEDIA_BUCKET}" \
                --arg prefix "" \
                --arg table "${CATALOG_TABLE}" \
            '{Variables: {
              STUDIO_MEDIA_BUCKET:              $bucket,
              STUDIO_MEDIA_ROOT_PREFIX:         $prefix,
              STUDIO_CATALOG_TABLE:             $table,
              STUDIO_REPLICATE_TOKEN_PARAMETER: "/studio/prod/replicate-api-token"
            }}' > /tmp/env-worker.json

          aws lambda update-function-configuration \
            --function-name "${WORKER}" \
            --region "${{ env.AWS_REGION }}" --environment file:///tmp/env-worker.json
          aws lambda wait function-updated \
            --function-name "${WORKER}" --region "${{ env.AWS_REGION }}"
          echo "WORKER=${WORKER}" >> "$GITHUB_ENV"

      - name: Update Lambda function code
        run: |
          set -euo pipefail
          # **Both functions, pinned to the same sha.** They are one image
          # entered at two handlers, so a partial update leaves the thing that
          # CLOSES a run on different code from the thing that SUBMITS one —
          # which fails in the least visible way there is, at the end of a
          # generation somebody has already paid for.
          for fn in "${{ env.API_LAMBDA_NAME }}" "${WORKER}"; do
            aws lambda update-function-code \
              --function-name "$fn" \
              --image-uri "${ECR_REGISTRY}/${{ env.API_ECR_REPO }}:${{ github.sha }}" \
              --region "${{ env.AWS_REGION }}" \
              --output table --query '{FunctionName:FunctionName,CodeSize:CodeSize}'
            aws lambda wait function-updated \
              --function-name "$fn" --region "${{ env.AWS_REGION }}"
          done

      - name: Smoke-check the API
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://studio-api.andreas.services/api/health || true)
            [ "$code" = "200" ] && { echo "health: 200"; exit 0; }
            echo "health: ${code} (attempt ${attempt})"; sleep 10
          done
          echo "API did not return 200 from /api/health"; exit 1

  # ---------------------------------------------------------------------------
  # Build the SPA and sync it to S3.
  #
  # Built here rather than in build-and-push because Vite inlines every VITE_*
  # value at build time, and the Cognito ids those need come out of the apply.
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend
    needs: [detect-changes, deploy-infra]
    if: |
      !cancelled()
      && needs.deploy-infra.result != 'failure'
      && ((github.event_name == 'workflow_dispatch' && inputs.run_app)
          || (github.event_name == 'push'
              && (needs.detect-changes.outputs.frontend == 'true'
                  || needs.deploy-infra.result == 'success'))
          || (github.event_name == 'workflow_run'
              && needs.deploy-infra.result == 'success'))
    runs-on: ubuntu-latest
    environment: studio-production
    permissions:
      id-token: write
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ansavva'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read infrastructure values from SSM
        run: |
          set -euo pipefail
          # Assign, check, then export. `echo "X=$(get …)" >> "$GITHUB_ENV"`
          # took its exit status from `echo`, not from the substitution, so a
          # failed or renamed parameter wrote an EMPTY STRING and the step went
          # green under `bash -e`. An assignment carries the substitution's
          # status, and `exit` inside a function called at top level ends the
          # job rather than a subshell.
          #
          # `None` is what `--output text` prints for a null value, so it is an
          # empty read wearing a name.
          put() {
            local value
            value="$(aws ssm get-parameter --name "$2" \
              --query Parameter.Value --output text)" || exit 1
            [ -n "$value" ] && [ "$value" != "None" ] ||
              { echo "::error::$2 resolved empty; refusing to continue." >&2; exit 1; }
            echo "$1=$value" >> "$GITHUB_ENV"
          }

          put S3_BUCKET  /studio/prod/app-bucket
          put CF_DIST_ID /studio/prod/cf-dist-id
          # A literal, so nothing can resolve it empty.
          echo "VITE_API_URL=https://studio-api.andreas.services" >> "$GITHUB_ENV"
          # Vite inlines these; empty ships an SPA whose login can never succeed.
          put VITE_COGNITO_USER_POOL_ID /studio/prod/cognito-user-pool-id
          put VITE_COGNITO_CLIENT_ID    /studio/prod/cognito-client-id
          # The Managed Login host the SPA redirects to. Empty is not a
          # degraded sign-in but no sign-in at all — there is no in-app form
          # to fall back to any more — which is what `put`'s emptiness check
          # is for.
          put VITE_COGNITO_DOMAIN       /studio/prod/cognito-auth-domain

      - name: Install dependencies
        run: cd studio/frontend && npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend
        run: cd studio/frontend && npm run build

      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync studio/frontend/dist/ "s3://${S3_BUCKET}/" \
            --region "${{ env.AWS_REGION }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"

      - name: Sync HTML (no cache)
        run: |
          aws s3 sync studio/frontend/dist/ "s3://${S3_BUCKET}/" \
            --region "${{ env.AWS_REGION }}" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --exclude "*" --include "*.html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DIST_ID}" --paths '/*' \
            --output table --query 'Invalidation.{Id:Id,Status:Status}'

  # ---------------------------------------------------------------------------
  # Seed the smoke account, then drive the deployed API as that account.
  #
  # A DETECTOR, NOT A GATE — see the header. This runs after the new image is
  # already live, and its job is to make a broken deploy say so.
  #
  # It is the only thing anywhere that exercises the LAMBDA'S OWN EXECUTION
  # ROLE. The unit suite runs against moto, which enforces no IAM at all; the
  # opt-in integration suite runs Flask in-process under a developer's far wider
  # credentials. A missing `dynamodb:BatchGetItem` grant reached production
  # through exactly that gap, behind a fully green suite, and was found by a
  # person opening the site.
  #
  # `environment: studio-production` is load-bearing twice over: it is where
  # AWS_ROLE_ARN lives, and where SMOKE_TEST_USER_EMAIL and
  # SMOKE_TEST_USER_PASSWORD live. A job missing
  # that key sees an environment secret as an empty string, silently — the seed
  # step below fails by name rather than trying to sign in as nobody.
  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke Test · Prod API
    needs: [detect-changes, update-lambda]
    # `!= 'failure'` rather than `== 'success'`: update-lambda legitimately
    # *skips* for a change to the fixture or the seeder, which deploy nothing,
    # and re-seeding then verifying the live API is exactly what such a change
    # should do.
    if: |
      !cancelled()
      && needs.update-lambda.result != 'failure'
      && (
        (github.event_name == 'push'
         && (needs.detect-changes.outputs.backend == 'true'
             || needs.detect-changes.outputs.infra == 'true'
             || needs.detect-changes.outputs.smoke == 'true'))
        || (github.event_name == 'workflow_dispatch' && inputs.run_app)
        || github.event_name == 'workflow_run'
      )
    runs-on: ubuntu-latest
    environment: studio-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      # The suite is pytest and nothing else — it imports no `studio_core` and
      # makes no AWS call. Installing the backend's dev group is how it gets a
      # runner, and keeps the smoke tree in the same suite a developer already
      # runs (where it skips, silently, without STUDIO_SMOKE).
      - name: Install backend dependencies
        run: cd studio/backend && poetry install --no-root --no-interaction

      # For the seeder and the SRP sign-in, both of which declare their own
      # dependencies inline (PEP 723). Neither belongs in the Lambda image's
      # lockfile: one needs boto3 the image already has, the other a Cognito
      # client it must never ship.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read the pool from SSM
        run: |
          set -euo pipefail
          # Assign, check, then export — the pattern deploy-frontend documents:
          # `echo "X=$(get …)" >> "$GITHUB_ENV"` takes its exit status from
          # `echo`, so a renamed parameter writes an EMPTY STRING and the step
          # goes green. `None` is what `--output text` prints for a null value,
          # which is an empty read wearing a name.
          put() {
            local value
            value="$(aws ssm get-parameter --name "$2" \
              --query Parameter.Value --output text)" || exit 1
            [ -n "$value" ] && [ "$value" != "None" ] ||
              { echo "::error::$2 resolved empty; refusing to continue." >&2; exit 1; }
            echo "$1=$value" >> "$GITHUB_ENV"
          }

          put STUDIO_SMOKE_POOL_ID   /studio/prod/cognito-user-pool-id
          put STUDIO_SMOKE_CLIENT_ID /studio/prod/cognito-client-id

      # Idempotent, and it runs BEFORE the suite so a provisioning problem fails
      # here with a named error rather than as a mystery assertion afterwards.
      # The CI role already carries `cognito-idp:*` and `dynamodb:*` on `*`
      # (infra/envs/shared/main.tf), so unlike the SSM statement beside them this
      # needed no IAM change.
      #
      # The seeder refuses to finish if the account holds more than one
      # membership. That check is the whole point of the exercise: one
      # membership is what makes this account structurally unable to address any
      # other library, since `before_request` resolves a request's library from
      # the caller's own rows.
      #
      # SMOKE_TEST_USER_EMAIL is a VARIABLE, not a secret: a reserved `.test`
      # address is unreachable by mail and identifies nobody, so encrypting it
      # would buy nothing and cost the ability to read back what the deploy
      # actually seeds. It has no default here or in the fixture — the seeder
      # refuses on an empty value rather than inventing an identity.
      - name: Seed the smoke account
        env:
          SMOKE_TEST_USER_EMAIL: ${{ vars.SMOKE_TEST_USER_EMAIL }}
          SMOKE_TEST_USER_PASSWORD: ${{ secrets.SMOKE_TEST_USER_PASSWORD }}
        run: uv run studio/scripts/prod-seed-smoke.py

      # A literal base URL, so nothing can resolve it empty — and the suite
      # itself has no default for it, so a run that was not told where to aim
      # refuses rather than guessing.
      - name: Run the smoke suite
        env:
          STUDIO_SMOKE: '1'
          STUDIO_SMOKE_BASE_URL: https://studio-api.andreas.services
          SMOKE_TEST_USER_EMAIL: ${{ vars.SMOKE_TEST_USER_EMAIL }}
          SMOKE_TEST_USER_PASSWORD: ${{ secrets.SMOKE_TEST_USER_PASSWORD }}
        run: cd studio/backend && poetry run pytest tests/smoke -q
