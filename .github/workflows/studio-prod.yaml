name: Studio · Deploy · Prod

# SHUT DOWN, 2026-09-14. Studio no longer deploys.
#
# `studio.andreas.services` and `studio-api.andreas.services` were taken down
# in one Terraform apply — the API Lambda and both ECR images, the REST and
# callback gateways, the render worker, the SPA bucket and CloudFront. What
# `studio/infra/envs/prod` still declares is the library and nothing else: the
# media bucket, the catalog table, the Cognito pool the catalog's rows are
# keyed by, and the shared dev-seed bucket.
#
# This workflow used to build two images, apply, pin the Lambdas, sync the SPA
# and smoke-test the live API. All of that is gone from here because none of
# it has a target; `git log` on this file has the DAG. What remains is the one
# job that keeps the surviving state honest — a Terraform apply — so a cert or
# zone change in shared infra still reaches the pool's custom auth domain, and
# so a config change to the bucket or the table lands through Terraform rather
# than by hand.
#
# studio-pr.yml still validates pull requests and never writes to AWS.

on:
  push:
    branches: [main]
    paths:
      - 'studio/infra/**'
      - '.github/workflows/studio-prod.yaml'
  workflow_dispatch:
    inputs:
      run_infra:
        description: 'Run the deploy-infra job'
        type: boolean
        default: true
  workflow_run:
    workflows: ["Shared infra · Terraform apply · Prod"]
    types: [completed]
    branches: [main]

concurrency:
  group: studio-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy-infra:
    name: Terraform Apply
    if: |
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.run_infra)
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: studio-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=studio/infra/envs/prod init -input=false

      - name: Terraform apply
        run: terraform -chdir=studio/infra/envs/prod apply -auto-approve -input=false
