name: Studio · PR

# Validation-only PR checks for the studio service (no AWS writes):
# backend unit tests + a Docker build of the Lambda image, frontend
# lint/typecheck/build, and Terraform fmt/validate.

#
# `studio/docs/` is excluded: it is prose, and nothing here can validate it.
# `studio/.claude/skills/` USED to be excluded for the same reason, and that was
# wrong — the skills are the agent-facing description of the `studio` CLI, and
# `tests/test_docs_match_cli.py` validates them against the live Click tree.
# Excluding them meant the one change that test exists to catch — a skill drifting
# from the CLI — was the one change that never ran it.
#
# `studio/pipeline/` is NOT excluded either: it deploys nowhere, but it is 7k
# lines of Python with a test suite, and "does not ship" is not a reason to leave
# it unchecked. It is excluded from studio-prod.yaml instead, which is where
# "deploys nowhere" actually applies.

on:
  pull_request:
    paths:
      - 'studio/**'
      - '!studio/docs/**'
      - '.github/workflows/studio-pr.yml'

concurrency:
  group: studio-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'studio/backend/**'
              # The smoke fixture is validated by tests/test_smoke_fixture.py,
              # which pins the rule that the smoke account is a member of
              # exactly one library. Without this line the one edit that could
              # break it is the one edit that never runs the check.
              - 'studio/seeds/**'
              - '.github/workflows/studio-pr.yml'
            frontend:
              - 'studio/frontend/**'
              - '.github/workflows/studio-pr.yml'
            infra:
              - 'studio/infra/**'
              - '.github/workflows/studio-pr.yml'
            pipeline:
              - 'studio/pipeline/**'
              # The skills describe this CLI, and the pipeline suite is what
              # checks that they still describe it accurately.
              - 'studio/.claude/skills/**'
              # The dev-stack scripts have no suite of their own, so
              # tests/contracts/test_dev_scripts.py is theirs — including the grep that
              # pins dev-aws-seed.sh out of ever spending money. Without this
              # line the change most likely to break that pin is the one change
              # that never runs it.
              - 'studio/scripts/**'
              - '.github/workflows/studio-pr.yml'

  backend:
    name: Backend — tests + image
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Install dependencies
        run: cd studio/backend && poetry install --no-root --no-interaction

      - name: Lint
        run: pipx run ruff check studio/backend

      # COVERAGE IS PRINTED AND GATES ON NOTHING. There is no
      # `--cov-fail-under`, deliberately: a threshold picked before anyone has
      # read a real number either sits under it (and means nothing) or fires on
      # unrelated PRs until somebody deletes it. The first honest figures were
      # pipeline 70%, backend 88%, frontend 36% — measured 2026-08-27, the day
      # this was added. Ratchet from those when there is a trend to ratchet.
      - name: Run tests
        run: cd studio/backend && poetry run pytest -q --cov --cov-report=term-missing:skip-covered

      - name: Docker build (packaging check)
        run: cd studio/backend && docker build -t studio-api:ci .

  frontend:
    name: Frontend — lint/typecheck/test/build
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ansavva'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json

      - name: Install dependencies
        run: cd studio/frontend && npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: cd studio/frontend && npm run lint

      # The hosted sign-in pages are styled by a committed JSON document rather
      # than by app.css, so nothing else would notice the two falling out of
      # step. This is what notices.
      - name: Cognito branding in sync with app.css
        run: cd studio/frontend && npm run brand:check

      # One suite, and it covers the legacy-URL resolver. Everything else on
      # this surface fails loudly — a broken listing is a blank page — but a
      # share link written before #313 that quietly stops resolving is invisible
      # until somebody reports it, so that is the piece with tests.
      - name: Run tests
        run: cd studio/frontend && npm run test:coverage

      - name: Build
        run: cd studio/frontend && npm run build

      # END-TO-END, STUBBED. Every `/api/**` is fulfilled from fixtures captured
      # off the real API, so this needs no AWS, no credentials and no dev stack —
      # which is what lets it run in a workflow that never writes to AWS. The
      # live mode (`npm run e2e:live`, against scripts/dev-up.sh) is local only.
      #
      # `--with-deps` because the runner has no browser; it is the browser
      # download, not the app, that makes this step the slow one.
      - name: Install the browser
        run: cd studio/frontend && npx playwright install --with-deps chromium

      - name: End-to-end
        run: cd studio/frontend && npm run e2e

      # The trace is the only thing worth having off a failed run — Playwright
      # writes one per failure and nothing on a pass.
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: studio/frontend/test-results/
          retention-days: 7

      # The design system ships every component as a .web/.native pair behind
      # one extensionless export, and picking the wrong leaf COMPILES CLEANLY —
      # it only shows up as an unstyled page at runtime. Auditing the source map
      # is the only trustworthy signal, so the build is not considered passing
      # until the bundle is proven to hold web leaves and no native ones.
      - name: Assert the web design-system leaves resolved
        run: |
          cd studio/frontend
          npx vite build --sourcemap >/dev/null
          node --input-type=module -e '
            import { readFileSync, readdirSync } from "node:fs";
            const dir = "dist/assets";
            const maps = readdirSync(dir).filter((f) => f.endsWith(".js.map"));
            const sources = maps.flatMap((f) => JSON.parse(readFileSync(`${dir}/${f}`, "utf8")).sources);
            const ds = sources.filter((s) => s.includes("design-system"));
            const web = ds.filter((s) => s.includes(".web."));
            const native = ds.filter((s) => s.includes(".native."));
            console.log(`design-system sources: ${ds.length} (web ${web.length}, native ${native.length})`);
            if (native.length) { console.error("Native leaves leaked into the web bundle:", native); process.exit(1); }
            if (!web.length) { console.error("No .web leaves resolved — check resolve.extensions ordering."); process.exit(1); }
          '

  pipeline:
    name: Pipeline — lint + tests
    needs: detect-changes
    if: needs.detect-changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync the pipeline environment
        run: uv sync --project studio/pipeline --all-groups --frozen

      # F821 in particular: the pipeline is a set of CLIs, so a name that only
      # resolves at call time is invisible to `--help` and to an import check.
      - name: Lint
        run: uv run --project studio/pipeline ruff check studio/pipeline

      # `dev-seed` is its own project — it holds AWS clients and the CLI
      # deliberately does not — so the pipeline's lint step and suite do not
      # reach it. It is the only Python in the repo that writes DynamoDB
      # directly, which is a reason to check it rather than a reason to skip it.
      - name: Lint dev-seed
        run: uv run --project studio/pipeline ruff check studio/scripts/dev_seed

      # Moto-backed, writes to no real table, and pins the publisher against the
      # loader's own validator — so the two halves of a fixture cannot drift.
      - name: Test dev-seed
        run: uv run --project studio/scripts/dev_seed pytest studio/scripts/dev_seed/tests -q

      # The skills describe this CLI and nothing else checks that they still do.
      # Kept out of the pytest suite deliberately: it is a linter, and 60-odd
      # parametrised markdown cases drowned the wiring tests that suite is for.
      - name: Lint skills against the CLI
        run: uv run --project studio/pipeline python studio/pipeline/scripts/lint_skills.py

      # COVERAGE IS PRINTED AND GATES ON NOTHING. There is no
      # `--cov-fail-under`, deliberately: a threshold picked before anyone has
      # read a real number either sits under it (and means nothing) or fires on
      # unrelated PRs until somebody deletes it. The first honest figures were
      # pipeline 70%, backend 88%, frontend 36% — measured 2026-08-27, the day
      # this was added. Ratchet from those when there is a trend to ratchet.
      - name: Run tests
        run: >
          uv run --project studio/pipeline pytest studio/pipeline/tests -q
          --cov=studio_pipeline --cov-config=studio/pipeline/pyproject.toml
          --cov-report=term-missing:skip-covered

  infra:
    name: Infra — fmt + validate
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -recursive -check studio/infra

      # No AWS credentials here by design, so the backend is skipped and this
      # checks configuration validity only — never state, never a plan.
      - name: Terraform validate
        run: |
          terraform -chdir=studio/infra/envs/prod init -backend=false -input=false
          terraform -chdir=studio/infra/envs/prod validate
          # `envs/dev` too, and it is not symmetry for its own sake. Nothing
          # applies this environment in CI — it is per machine — so a syntax
          # error or a missing variable in it is found by whichever developer
          # next runs `dev-aws-setup.sh`, at the moment they wanted a working
          # stack. A validate costs seconds and moves that to the PR.
          terraform -chdir=studio/infra/envs/dev init -backend=false -input=false
          terraform -chdir=studio/infra/envs/dev validate
